l_french:
 mod_mass_convert_subjects_decision: "$game_concept_demand_conversion$"
 mod_mass_convert_subjects_decision_desc: "$game_concept_demand_conversion_desc$"
 mod_mass_convert_subjects_decision_tooltip: "$game_concept_demand_conversion_desc$"

 mod_convert_direct_vassals_loc: "$game_concept_direct_vassals$ ([SCOPE.ScriptValue('mod_convert_direct_vassals_number')])"
 mod_convert_direct_vassals_tooltip: "Exigez la conversion de tous vos $game_concept_direct_vassals$ qui sont infidèles."

 mod_convert_indirect_vassals_loc: "$game_concept_vassals$ indirects ([SCOPE.ScriptValue('mod_convert_indirect_vassals_number')])"
 mod_convert_indirect_vassals_tooltip: "Exigez la conversion de tous vos $game_concept_vassals$ indirects qui sont infidèles."

 mod_convert_tributaries_loc: "Tributaires ([SCOPE.ScriptValue('mod_convert_tributaries_number')])"
 mod_convert_tributaries_tooltip: "Exigez la conversion de tous vos tributaires infidèles."

 mod_convert_courtiers_loc: "Courtisans ([SCOPE.ScriptValue('mod_convert_courtiers_number')])"
 mod_convert_courtiers_tooltip: "Exigez la conversion de tous vos [courtiers|E] qui sont infidèles."

 mod_convert_house_loc: "Membres de la Maison ([SCOPE.ScriptValue('mod_convert_house_number')])"
 mod_convert_house_tooltip: "Exigez la conversion de tous les membres de votre Maison qui sont infidèles."

 mod_mass_convert_subjects_decision_confirm: "Envoyer les demandes"

 # Acceptance only; actual conversion may finish through a later native event.
 mdc_conversion_accepted_title:0 "Demande de conversion acceptée"
 mdc_conversion_accepted_desc:0 "[recipient.GetShortUIName] a accepté la demande de conversion."

 # Immediate acceptance filter; no persistent player preference.
 mdc_chance_filter_heading:0 "Acceptation :"
 mdc_chance_filter_none:0 "Aucun"
 mdc_chance_filter_80:0 "≥ 80 %"
 mdc_chance_filter_100:0 "100 %"
 mdc_chance_filter_scope_note:0 "S’applique uniquement aux vassaux directs/indirects et aux tributaires. Les courtisans et les membres de la Maison restent inchangés."
 mdc_chance_filter_tooltip:0 "$mdc_chance_filter_scope_note$\n\nFiltre la chance calculée d’acceptation immédiate. Les négociations ultérieures et les conversions achevées ne sont pas incluses. 100 % ne garantit pas une conversion achevée. Les nombres indiquent les demandes admissibles ; les cibles sont vérifiées à nouveau avant l’envoi."
 mdc_convert_direct_vassals_80_loc:0 "$game_concept_direct_vassals$ ([SCOPE.ScriptValue('mdc_convert_direct_vassals_80_number')])"
 mdc_convert_direct_vassals_80_tooltip:0 "$mod_convert_direct_vassals_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_direct_vassals_100_loc:0 "$game_concept_direct_vassals$ ([SCOPE.ScriptValue('mdc_convert_direct_vassals_100_number')])"
 mdc_convert_direct_vassals_100_tooltip:0 "$mod_convert_direct_vassals_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"
 mdc_convert_indirect_vassals_80_loc:0 "$game_concept_vassals$ indirects ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_80_number')])"
 mdc_convert_indirect_vassals_80_tooltip:0 "$mod_convert_indirect_vassals_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_indirect_vassals_100_loc:0 "$game_concept_vassals$ indirects ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_100_number')])"
 mdc_convert_indirect_vassals_100_tooltip:0 "$mod_convert_indirect_vassals_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"
 mdc_convert_tributaries_80_loc:0 "Tributaires ([SCOPE.ScriptValue('mdc_convert_tributaries_80_number')])"
 mdc_convert_tributaries_80_tooltip:0 "$mod_convert_tributaries_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_tributaries_100_loc:0 "Tributaires ([SCOPE.ScriptValue('mdc_convert_tributaries_100_number')])"
 mdc_convert_tributaries_100_tooltip:0 "$mod_convert_tributaries_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"

 # Decision preview only; request outcomes remain native.
 mdc_mass_conversion_requests_effect:0 "Envoie des demandes de conversion normales aux destinataires choisis."
