 mdc_chance_filter_tooltip:0 "$mdc_chance_filter_scope_note$\n\n계산된 즉시 수락 확률을 기준으로 거릅니다. 이후 협상과 완료된 개종은 포함하지 않습니다. 100%는 개종 완료를 보장하지 않습니다. 숫자는 요청 가능한 대상 수이며, 보내기 전에 대상을 다시 확인합니다."
