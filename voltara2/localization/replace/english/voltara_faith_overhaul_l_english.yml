 voltara_relic_inventory:0 "Commission a Relic Inventory"
 voltara_relic_inventory_desc:0 "Ask temple keepers to distinguish a relic's documented history from later embellishment."
 voltara_relic_inventory_tooltip:0 "Ask temple keepers to distinguish a relic's documented history from later embellishment."
