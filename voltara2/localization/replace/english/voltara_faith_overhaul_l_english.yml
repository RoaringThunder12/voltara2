l_english:
 Voltara_Caelion:0 "Caelion"
 k_voltara_luminous_see:0 "Luminous See"
 k_voltara_luminous_see_adj:0 "Luminary"
 d_voltara_luminous_see:0 "Casavina"
 d_voltara_luminous_see_adj:0 "Casavinan"
 k_voltara_luminous_see_desc:0 "The clerical kingdom of Casavina, immediately west of Titania. Its High Luminary guards the communion of the Aeliunist rites while owing temporal allegiance to the Severosi crown. Caelion, its first recorded luminary, is a jurist who insists that imperial order must also shelter the powerless."
 building_voltara_first_measure_sanctuary_01:0 "Cathedral of the First Measure"
 building_voltara_first_measure_sanctuary_01_desc:0 "The Luminous See preserves the common calendar, clerical judgments and the duties owed by rulers to their people."
 holy_site_voltara_first_measure_name:0 "Cathedral of the First Measure"
 holy_site_voltara_first_measure_effects:0 "The Luminous See preserves the common calendar, clerical judgments and the duties owed by rulers to their people."
 voltara_relic_first_measure:0 "The First Measure"
 voltara_relic_first_measure_desc:0 "A silver measuring rod carried in the foundation procession at Casavina. Its authority rests in the oaths sworn upon it, not a claim that Aeliun wielded it."
 building_voltara_titania_sanctuary_01:0 "Titania: Sanctuary of the Crown"
 building_voltara_titania_sanctuary_01_desc:0 "The imperial capital binds the crown to public justice; its sanctuary records promises made before Aeliun."
 holy_site_voltara_titania_name:0 "Titania: Sanctuary of the Crown"
 holy_site_voltara_titania_effects:0 "The imperial capital binds the crown to public justice; its sanctuary records promises made before Aeliun."
 voltara_relic_titania:0 "Tablet of the Crown Covenant"
 voltara_relic_titania_desc:0 "The gilded tablet records a covenant of shelter, judgment and restraint. Pilgrims read its words aloud before asking blessings upon Severos."
 building_voltara_kartholos_sanctuary_01:0 "Karthalos: Shrine of the Crossing"
 building_voltara_kartholos_sanctuary_01_desc:0 "At Karthalon, the Keepers swear to defend the passage and give lawful travelers safe conduct."
 holy_site_voltara_kartholos_name:0 "Karthalos: Shrine of the Crossing"
 holy_site_voltara_kartholos_effects:0 "At Karthalon, the Keepers swear to defend the passage and give lawful travelers safe conduct."
 voltara_relic_kartholos:0 "Lamp of the Crossing"
 voltara_relic_kartholos_desc:0 "A weathered bronze lamp maintained by the Keepers of Kartholos, symbol of safe passage and a watch that does not end."
 building_voltara_thornfall_sanctuary_01:0 "Thornfall: Grove of the First Covenant"
 building_voltara_thornfall_sanctuary_01_desc:0 "Traditionalist keepers remember creation as the struggle of Aeliun and Khaos, and renew their obligations to the living land."
 holy_site_voltara_thornfall_name:0 "Thornfall: Grove of the First Covenant"
 holy_site_voltara_thornfall_effects:0 "Traditionalist keepers remember creation as the struggle of Aeliun and Khaos, and renew their obligations to the living land."
 voltara_relic_thornfall:0 "Root of the Covenant"
 voltara_relic_thornfall_desc:0 "A fallen root from the covenant grove, preserved rather than cut from a living tree. Generations of witnesses have bound their oath ribbons around its reliquary."
 building_voltara_enderal_sanctuary_01:0 "Enderal: Hearth of the Mountain Vigil"
 building_voltara_enderal_sanctuary_01_desc:0 "The Northern Creed blesses the wardens of the mountain passes and judges their strength by those they protect."
 holy_site_voltara_enderal_name:0 "Enderal: Hearth of the Mountain Vigil"
 holy_site_voltara_enderal_effects:0 "The Northern Creed blesses the wardens of the mountain passes and judges their strength by those they protect."
 voltara_relic_enderal:0 "Bell of the Mountain Vigil"
 voltara_relic_enderal_desc:0 "A cracked iron bell once used to call travelers into shelter. Its keepers teach that strength becomes sacred only when it guards another life."
 tenet_voltara_sacred_measure_name:0 "The Sacred Measure"
 tenet_voltara_sacred_measure_desc:0 "Aeliun grants no ruler permission to be arbitrary. Written judgment and the example of a just sovereign hold the realm together."
 tenet_voltara_communion_light_name:0 "Communion of Light"
 tenet_voltara_communion_light_desc:0 "Offerings sustain the common priesthood. The High Luminary hears petitions for reconciliation, and communion carries duties as well as blessings."
 tenet_voltara_twofold_creation_name:0 "Twofold Creation"
 tenet_voltara_twofold_creation_desc:0 "Order did not arise alone. Contemplating Aeliun and Khaos together is a discipline of understanding creation, not an excuse to abandon restraint."
 tenet_voltara_ancestral_witness_name:0 "Ancestral Witness"
 tenet_voltara_ancestral_witness_desc:0 "The dead are witnesses to promises made by the living. Their names are recited so that power cannot erase its obligations."
 tenet_voltara_sheltering_hearth_name:0 "The Sheltering Hearth"
 tenet_voltara_sheltering_hearth_desc:0 "A stranger rescued from the cold is a life restored to the ordered world. Hospitality is a sacred obligation, not a privilege reserved for kin."
 tenet_voltara_mountain_vigil_name:0 "The Mountain Vigil"
 tenet_voltara_mountain_vigil_desc:0 "The mountain passes are entrusted to their wardens. The Northern Creed honors endurance and the defense of those who seek shelter."
 tenet_voltara_living_covenant_name:0 "The Living Covenant"
 tenet_voltara_living_covenant_desc:0 "Grove, water and field are entrusted to mortal care. Their destruction for passing gain breaks the covenant with the generations still to come."
 tenet_voltara_erisian_inquiry_name:0 "Erisian Inquiry"
 tenet_voltara_erisian_inquiry_desc:0 "Erite scholars test a judgment against its words, its witnesses and its consequences. Debate is a service to sacred order, not disobedience in itself."
 voltara_order_rite_22:0 "Ordered Traditionalism"
 voltara_order_rite_22_adj:0 "Ordered Traditionalism"
 voltara_order_rite_22_adherent:0 "Ordered Traditionalism adherent"
 voltara_order_rite_22_adherent_plural:0 "Ordered Traditionalism adherents"
 voltara_order_rite_22_desc:0 "Traditionalists remember both Aeliun and Khaos in creation. Order begins within the believer: promises, restraint, ancestral obligations and care for the living land. They reject the claim that Aeliun commanded mortals to annihilate Khaos, while remaining an Aeliunist rite rather than the Elven communion of equal worship."
 voltara_order_rite_23:0 "Ordered Absolutism"
 voltara_order_rite_23_adj:0 "Ordered Absolutism"
 voltara_order_rite_23_adherent:0 "Ordered Absolutism adherent"
 voltara_order_rite_23_adherent_plural:0 "Ordered Absolutism adherents"
 voltara_order_rite_23_desc:0 "The Severosi mainline exalts Aeliun and rejects the worship of Khaos. The crown protects the faithful, while the Luminous See teaches that written law binds the powerful as well as their subjects. Caelion's clergy can bless imperial rule without declaring every imperial command righteous."
 voltara_order_rite_24:0 "Erite Order"
 voltara_order_rite_24_adj:0 "Erite Order"
 voltara_order_rite_24_adherent:0 "Erite Order adherent"
 voltara_order_rite_24_adherent_plural:0 "Erite Order adherents"
 voltara_order_rite_24_desc:0 "Erite houses preserve testimony, debate interpretation and teach disciplined inquiry. Their scholars serve the Aeliunist communion but resist the claim that a difficult question is itself a sin."
 voltara_order_rite_25:0 "Southern Creed"
 voltara_order_rite_25_adj:0 "Southern Creed"
 voltara_order_rite_25_adherent:0 "Southern Creed adherent"
 voltara_order_rite_25_adherent_plural:0 "Southern Creed adherents"
 voltara_order_rite_25_desc:0 "The southern congregations see order in the sheltering household, the well kept field and the open guest hall. Their priests collect offerings for refuge and reconciliation, and distrust conquest that leaves the common people hungry."
 voltara_order_rite_26:0 "Northern Creed"
 voltara_order_rite_26_adj:0 "Northern Creed"
 voltara_order_rite_26_adherent:0 "Northern Creed adherent"
 voltara_order_rite_26_adherent_plural:0 "Northern Creed adherents"
 voltara_order_rite_26_desc:0 "The northern hearths honor Aeliun through endurance and mutual protection. Enderali wardens, including those bearing the werebear gift, are judged by their conduct: a guardian may be honored, a predator must answer for the harm they cause."
 voltara_khaotism_rite:0 "Unbound Path"
 voltara_khaotism_rite_adj:0 "Unbound Path"
 voltara_khaotism_rite_adherent:0 "Unbound Path adherent"
 voltara_khaotism_rite_adherent_plural:0 "Unbound Path adherents"
 voltara_khaotism_rite_desc:0 "The Unbound Path prizes transformation and questions fixed authority. Mystics and ambitious rulers disagree about whether freedom can excuse domination. Khaos is venerated as a living power of creation, not equated with the Great Beyond or blamed for the captivity imposed upon him by the Grand Magus."
 voltara_veiled_balance:0 "Veiled Balance"
 voltara_veiled_balance_adj:0 "Veiled Balance"
 voltara_veiled_balance_adherent:0 "Veiled Balance adherent"
 voltara_veiled_balance_adherent_plural:0 "Veiled Balance adherents"
 voltara_veiled_balance_desc:0 "A reform movement within Aeliunism that insists the memory of Khaos cannot be banished from the account of creation. Its teachers seek balance without surrendering compassion."
 voltara_uncrowned_light:0 "Uncrowned Light"
 voltara_uncrowned_light_adj:0 "Uncrowned Light"
 voltara_uncrowned_light_adherent:0 "Uncrowned Light adherent"
 voltara_uncrowned_light_adherent_plural:0 "Uncrowned Light adherents"
 voltara_uncrowned_light_desc:0 "A reform movement that holds that sacred law must not be owned by a dynasty. Its assemblies reject a supreme pontiff and ask each congregation to hold its rulers to account."
 voltara_aeliun_name:0 "Aeliun"
 voltara_aeliun_possessive:0 "Aeliun's"
 voltara_creation_pair:0 "Aeliun and Khaos"
 voltara_creation_pair_possessive:0 "Aeliun and Khaos's"
 voltara_high_luminary:0 "High Luminary"
 voltara_luminous_see:0 "Luminous See"
 voltara_luminary:0 "luminary"
 voltara_luminaries:0 "luminaries"
 voltara_book_measure:0 "Book of the Measure"
 voltara_sacred_sun:0 "sun of the Measure"
 voltara_aeluinist:0 "Aeliunism"
 voltara_aeluinist_adj:0 "Aeliunism"
 voltara_aeluinist_adherent:0 "Aeliunism adherent"
 voltara_aeluinist_adherent_plural:0 "Aeliunism adherents"
 voltara_aeluinist_desc:0 "Aeliunist congregations preserve Elven-derived scriptures while interpreting order in distinct ways. Traditionalists begin with discipline within the believer; imperial absolutists express sacred order through law and institutions. Aeliun never gave a universal command to annihilate Khaos. Human Aeliunism remains distinct from the True Weavers, whose Elven communion gives both creators equal worship."
 voltara_religion:0 "Aeliunist Communion"
 voltara_religion_adj:0 "Aeliunist Communion"
 voltara_religion_adherent:0 "Aeliunist Communion adherent"
 voltara_religion_adherent_plural:0 "Aeliunist Communion adherents"
 voltara_religion_desc:0 "The Aeliunist traditions inherit ancient Elven accounts of creation and the wounded Weave. Their congregations differ over whether order is best guarded through personal discipline, communal obligation or imperial institutions. Their shared history does not make the Severosi church identical to the older Elven communion."
 voltara_faith_0:0 "Voltaran Folklore"
 voltara_faith_0_adj:0 "Voltaran Folklore"
 voltara_faith_0_adherent:0 "Voltaran Folklore adherent"
 voltara_faith_0_adherent_plural:0 "Voltaran Folklore adherents"
 voltara_faith_0_desc:0 "Local shrines, ancestral customs and seasonal observances outside the organized communions. These communities have no single sacred capital or universal priesthood."
 voltara_folk_religion:0 "Voltaran Folklore"
 voltara_folk_religion_adj:0 "Voltaran Folklore"
 voltara_folk_religion_adherent:0 "Voltaran Folklore adherent"
 voltara_folk_religion_adherent_plural:0 "Voltaran Folklore adherents"
 voltara_folk_religion_desc:0 "The diverse inherited customs of Voltaran communities."
 voltara_khaotism:0 "Khaotism"
 voltara_khaotism_adj:0 "Khaotism"
 voltara_khaotism_adherent:0 "Khaotism adherent"
 voltara_khaotism_adherent_plural:0 "Khaotism adherents"
 voltara_khaotism_desc:0 "Khaotism honors Khaos as the restless power of change. Decentralized congregations, mystics and local cults find divine possibility throughout living creation. Chaos is not the Great Beyond: the Grand Magus captured and nearly sacrificed Khaos while attempting to sever the Weave. Freedom, domination and responsibility remain matters of dispute among his followers."
 voltara_sanctuary_relic_modifier:0 "Sanctuary Relic"
 voltara_faith.1.t:0 "The Five Rites"
 voltara_faith.1.desc:0 "The Book of the Measure lies open beside the temple calendar. All five established rites honor Aeliun, but agreement about her name does not settle the duties of rulers, the memory of Khaos or the place of the stranger.\n\nThe Luminous See preserves their communion from Casavina beside Titania; the crown governs the empire. Neither office makes those questions disappear."
 voltara_faith.1.o0:0 "The crown and the priesthood."
 voltara_faith.1.o1:0 "Memory, inquiry and the hearth."
 voltara_faith.1.o2:0 "What divides the reform movements?"
 voltara_faith.1.o3:0 "Close the book."
 voltara_faith.2.t:0 "Crown and Measure"
 voltara_faith.2.desc:0 "Ordered Absolutism teaches that Aeliun's order requires law, communion and disciplined interpretation. Titus protects the See, but Caelion's jurists insist that a ruler also owes justice to the powerless.\n\nThe High Luminary holds spiritual authority over the communion. Regional rite leadership remains distinct; temporal allegiance to Severos is not a claim that the Emperor is a god."
 voltara_faith.2.o0:0 "Return to the book."
 voltara_faith.3.t:0 "Many Ways to Keep an Oath"
 voltara_faith.3.desc:0 "Traditionalists remember both Aeliun and Khaos in the creation story and preserve the covenant of the living land. Erite scholars compare testimony and challenge careless interpretation. The Southern Creed makes refuge and reconciliation central to worship.\n\nThe Northern Creed binds strength to protection. A werebear who guards an Enderali pass may be honored; the gift gives no excuse for predation."
 voltara_faith.3.o0:0 "Return to the book."
 voltara_faith.4.t:0 "The Unsettled Questions"
 voltara_faith.4.desc:0 "Two reform movements can emerge from these disputes. The Veiled Balance gives the memory of Khaos an explicit place within an Aeliunist life. The Uncrowned Light rejects a universal pontiff and insists that no dynasty can own sacred law.\n\nNeither begins with a landed congregation in 3116. A ruler who publicly embraces either accepts a real change of rite, not merely a fashionable opinion."
 voltara_faith.4.o0:0 "Return to the book."
 voltara_faith.10.t:0 "A Council of the Measure"
 voltara_faith.10.desc:0 "Clergy and household officers gather to debate a troubling petition: does obedience alone make a command just? One speaker appeals to the crown, another to the written covenant, and a third to the families who must live with the judgment."
 voltara_faith.10.o0:0 "Publish the judgment and its reasons."
 voltara_faith.10.o1:0 "Make reconciliation our first duty."
 voltara_faith.10.o2:0 "Authority must speak with one voice."
 voltara_faith.11.t:0 "Bread at the Temple Door"
 voltara_faith.11.desc:0 "Your temple stewards have gathered the names of households short of food and travelers without shelter. The offerings will not end every hardship. They can keep a hearth burning through the next cold night."
 voltara_faith.11.o0:0 "Let the stores serve those in need."
 voltara_faith.11.o1:0 "Endow a lasting guesthouse."
 voltara_faith.12.t:0 "The Seal on the Reliquary"
 voltara_faith.12.desc:0 "A temple keeper brings a careful copy of an old inventory. The relic's story has grown grander in every retelling. The earliest account speaks of mortal courage, while the newest claims the object fell from Aeliun's own hand."
 voltara_faith.12.o0:0 "Honor the oldest account; a mortal oath is sacred enough."
 voltara_faith.12.o1:0 "Let the object inspire worship without certifying the legend."
 voltara_faith.12.o2:0 "Commission witnesses and a new inventory."
 voltara_faith.20.t:0 "A Public Profession"
 voltara_faith.20.desc:0 "A reform movement within Aeliunism that insists the memory of Khaos cannot be banished from the account of creation. Its teachers seek balance without surrendering compassion.\n\nYour household waits for a clear declaration. Your own rite will change; your subjects retain their consciences and must be persuaded individually."
 voltara_faith.20.o0:0 "I will profess this teaching."
 voltara_faith.20.o1:0 "I will remain within my present rite."
 voltara_faith.21.t:0 "A Public Profession"
 voltara_faith.21.desc:0 "A reform movement that holds that sacred law must not be owned by a dynasty. Its assemblies reject a supreme pontiff and ask each congregation to hold its rulers to account.\n\nYour household waits for a clear declaration. Your own rite will change; your subjects retain their consciences and must be persuaded individually."
 voltara_faith.21.o0:0 "I will profess this teaching."
 voltara_faith.21.o1:0 "I will remain within my present rite."
 voltara_read_faiths:0 "Read the Book of the Measure"
 voltara_read_faiths_desc:0 "Read about the five rites, the Luminous See and the disputes that may produce reform movements."
 voltara_read_faiths_tooltip:0 "Read about the five rites, the Luminous See and the disputes that may produce reform movements."
 voltara_read_faiths_confirm:0 "Proceed"
 voltara_council_measure:0 "Convene a Council of the Measure"
 voltara_council_measure_desc:0 "Invite clergy to debate the obligations of rule and choose a principle for your administration."
 voltara_council_measure_tooltip:0 "Invite clergy to debate the obligations of rule and choose a principle for your administration."
 voltara_council_measure_confirm:0 "Proceed"
 voltara_temple_alms:0 "Endow Temple Relief"
 voltara_temple_alms_desc:0 "Support food stores and shelter through the temples of your capital."
