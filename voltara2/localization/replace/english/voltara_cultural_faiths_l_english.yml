 voltara_cultural_hostility_name:0 "Ancestral Communion"
 voltara_cultural_hostility_desc:0 "Related traditions are recognized as different paths; rites within one communion remain united."
 voltara_harmonious_pair_name:0 "The Two in Harmony"
 voltara_harmonious_pair_desc:0 "Only Aeliun and Khaos receive worship. Both are equally necessary; neither is the lesser power or the enemy of creation."
 voltara_first_cavern:0 "First Cavern"
 voltara_first_cavern_adj:0 "First Cavern"
 voltara_first_cavern_adherent:0 "First Cavern adherent"
 voltara_first_cavern_adherent_plural:0 "First Cavern adherents"
 voltara_first_cavern_desc:0 "Naga cavern keepers remember the ancestral birthplaces beneath the earth. Their vigils honor the World Serpents through remembrance, communal rites and care for the passages sheltering their descendants."
 voltara_tidal_memory:0 "Tidal Memory"
 voltara_tidal_memory_adj:0 "Tidal Memory"
 voltara_tidal_memory_adherent:0 "Tidal Memory adherent"
 voltara_tidal_memory_adherent_plural:0 "Tidal Memory adherents"
 voltara_tidal_memory_desc:0 "River and coastal congregations carry World Serpent ancestry into the changing waters. They honor the same forebears as the cavern keepers, while giving special attention to the shores, floods and migrations on which their communities depend."
 voltara_eternal_legacy:0 "Eternal Legacy"
 voltara_eternal_legacy_adj:0 "Eternal Legacy"
 voltara_eternal_legacy_adherent:0 "Eternal Legacy adherent"
 voltara_eternal_legacy_adherent_plural:0 "Eternal Legacy adherents"
 voltara_eternal_legacy_desc:0 "Duraz-Thar asks what will endure after a life is ended: an honored name, a sound hall, a fulfilled promise. Ancestors are remembered through their works. The dead return to the Deep, and vampirism violates that rest."
