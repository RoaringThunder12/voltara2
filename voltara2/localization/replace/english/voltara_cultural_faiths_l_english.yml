l_english:
 tenet_voltara_paired_harmony_name:0 "Harmony of the Two"
 tenet_voltara_paired_harmony_desc:0 "Aeliun and Khaos are equally necessary. Contemplation seeks their harmony within the self and the wounded Weave; it never demands the annihilation of either creator."
 tenet_voltara_living_weave_name:0 "The Living Weave"
 tenet_voltara_living_weave_desc:0 "Creation is a living pattern. Stewardship of grove, water and creature preserves the interplay of endurance and change."
 tenet_voltara_serpent_ancestry_name:0 "Ancestry of the World Serpents"
 tenet_voltara_serpent_ancestry_desc:0 "The World Serpents are godlike ancestors, and their cavern passages belong to the shared memory of the Naga."
 tenet_voltara_cavern_guardians_name:0 "Guardians of the First Caverns"
 tenet_voltara_cavern_guardians_desc:0 "The caverns are remembered birthplaces. Their keepers defend the passageways and shelters through which their people endure."
 tenet_voltara_stone_memory_name:0 "Stone Remembers"
 tenet_voltara_stone_memory_desc:0 "Names, enduring works and honored obligations preserve a life beyond its ending. The ancestral dead return to the Deep."
 tenet_voltara_load_bearing_oaths_name:0 "Load-Bearing Oaths"
 tenet_voltara_load_bearing_oaths_desc:0 "A promise supports more than its speaker. Like a pillar in a crowded hall, it must withstand the weight placed upon it."
 tenet_voltara_sacred_forge_name:0 "The Sacred Forge"
 tenet_voltara_sacred_forge_desc:0 "Patient work with stone, metal and gems is an act of understanding. The wise binder listens longer than they pull."
 tenet_voltara_old_ones_name:0 "The Living Old Ones"
 tenet_voltara_old_ones_desc:0 "The sacred is encountered in the land and the lives it sustains. Shamans draw upon natural gifts without declaring creation a possession to be mastered."
 tenet_voltara_unbound_ember_name:0 "The Unbound Ember"
 tenet_voltara_unbound_ember_desc:0 "Firekeepers gather their communities around a changing flame. Celebration remembers survival, shared possibilities and the courage to begin again."
 tenet_voltara_kin_memory_name:0 "The Memory of Kin"
 tenet_voltara_kin_memory_desc:0 "The names and deeds of earlier generations create obligations for those who follow. Communities remember their dead without surrendering the needs of the living."
 voltara_serpents_religion:0 "Twin Serpents"
 voltara_serpents_religion_adj:0 "Twin Serpents"
 voltara_serpents_religion_adherent:0 "Twin Serpents adherent"
 voltara_serpents_religion_adherent_plural:0 "Twin Serpents adherents"
 voltara_serpents_religion_desc:0 "The Twin Serpents honor the World Serpents as godlike ancestors. Naga traditions remember their birth in the vast caverns left by these beings, and preserve that inheritance among cavern, river, swamp and sea communities. The twin emblem expresses a shared devotion; it does not settle the number, names or fate of every World Serpent. Their ancestral communion is distinct from the eastern Tyrite Cult of the Serpent."
