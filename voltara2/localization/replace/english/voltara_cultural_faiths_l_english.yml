 voltara_stone_religion_desc:0 "Stone remembers. The Durkar, or Deep-Kin, honor ancestry through enduring works, faithful oaths and care for the halls inherited from the dead. Some recite how Vorel shaped them, Pyrion gave the forge its fire and Eris taught survival; others sing of stone awakening under the Deep Grinding. These remembered traditions meet in Duraz-Thar, the Eternal Legacy. Binding, Containment and Transmutation demand patient craft rather than reckless command of the Weave."
