 voltara_old_ones_religion_desc:0 "Orc traditions trace their people to the jungle mud of eastern Southorion. The Ways of the Old Ones honor ancestral memory, living landscapes and obligations proved through deeds. Local shamans listen to earth, water, fire and beast; their practices need not resemble the Elven discipline of binding the Weave. Shared origins do not impose one priesthood or an eternal quarrel with neighboring peoples."
