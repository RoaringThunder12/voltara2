 voltara_embers_religion_desc:0 "Goblin firekeepers tell that Khaos stirred the untamed Weave and brought forth their people. Sacred flame recalls how destruction and possibility can share one source. Shamans honor change, wit and resilience; town elders and clan rulers interpret these teachings in different ways. Goblin political life has changed across the centuries, and devotion to the Ember belongs to more than a single form of government."
