 voltara_weavers_religion:0 "The True Weavers"
 voltara_weavers_religion_adj:0 "The True Weavers"
 voltara_weavers_religion_adherent:0 "The True Weavers adherent"
 voltara_weavers_religion_adherent_plural:0 "The True Weavers adherents"
 voltara_weavers_religion_desc:0 "Aeliun gives the pattern endurance; Khaos gives it possibility. The True Weavers honor these two alone, equally and in harmony. Other powers may exist, but neither creator can be replaced or subordinated. Their Elven traditions seek order within the believer and freedom within a living pattern. Their Aeliunist and Khaotist sects emphasize different disciplines without denying the equal worth of the Two. The Sundering wounded the Weave; it did not destroy it."
