 voltara_sacred_forge_adj:0 "Forge Covenant"
 voltara_sacred_forge_adherent:0 "Forge Covenant adherent"
 voltara_sacred_forge_adherent_plural:0 "Forge Covenant adherents"
 voltara_sacred_forge_desc:0 "The forge and the mason's bench are places of devotion. Keepers recite the gifts of Vorel, Pyrion and Eris, teaching that skill must serve clan obligations. A wise binder listens longer than they pull; lasting craft takes precedence over spectacular power."
 voltara_harmonious_weave:0 "The Harmonious Weave"
 voltara_harmonious_weave_adj:0 "The Harmonious Weave"
 voltara_harmonious_weave_adherent:0 "The Harmonious Weave adherent"
 voltara_harmonious_weave_adherent_plural:0 "The Harmonious Weave adherents"
 voltara_harmonious_weave_desc:0 "Aeliun and Khaos alone receive worship, equally and together. Order provides continuity, Chaos permits change, and neither can flourish by destroying the other. The Elven discipline is to live within that harmony and tend the Weave injured by the Sundering."
 voltara_weavers_aeliunist:0 "Aeliunist Weavers"
 voltara_weavers_aeliunist_adj:0 "Aeliunist Weavers"
 voltara_weavers_aeliunist_adherent:0 "Aeliunist Weavers adherent"
 voltara_weavers_aeliunist_adherent_plural:0 "Aeliunist Weavers adherents"
 voltara_weavers_aeliunist_desc:0 "These True Weavers begin with Aeliun's discipline: govern oneself before claiming the right to govern creation. Their emphasis on order does not make Khaos a lesser being. Both creators remain equally necessary, and imperial conquest is no universal command of Aeliun."
 voltara_weavers_khaotist:0 "Khaotist Weavers"
 voltara_weavers_khaotist_adj:0 "Khaotist Weavers"
 voltara_weavers_khaotist_adherent:0 "Khaotist Weavers adherent"
 voltara_weavers_khaotist_adherent_plural:0 "Khaotist Weavers adherents"
 voltara_weavers_khaotist_desc:0 "These True Weavers begin with Khaos's transformations, without denying Aeliun's equal place. They distinguish their devotion from the Grand Magus's attempt to sever the Weave: he captured and nearly sacrificed Khaos using powers of the Great Beyond. Khaos was not the author of that captivity."
 voltara_mud_and_flame:0 "Mud and Flame"
 voltara_mud_and_flame_adj:0 "Mud and Flame"
 voltara_mud_and_flame_adherent:0 "Mud and Flame adherent"
 voltara_mud_and_flame_adherent_plural:0 "Mud and Flame adherents"
 voltara_mud_and_flame_desc:0 "Orc shamans recount emergence from the jungle mud and the obligations owed to kin, guests and the living land. The Old Ones are approached through local memory and natural gifts, rather than a single worldwide priesthood or an obligation to sacrifice other peoples."
 voltara_embers_of_khaos:0 "Embers of Khaos"
 voltara_embers_of_khaos_adj:0 "Embers of Khaos"
 voltara_embers_of_khaos_adherent:0 "Embers of Khaos adherent"
 voltara_embers_of_khaos_adherent_plural:0 "Embers of Khaos adherents"
 voltara_embers_of_khaos_desc:0 "Firekeepers honor Khaos through change, communal memory and courage before uncertain magic. The same flame can destroy a dwelling or warm a new one. Goblin towns, clans and courts give these teachings different forms without losing their ancestral ties."
 voltara_khaos_religion_desc:0 "Khaotist traditions honor transformation, living powers and the refusal to treat the world as a finished order. Their devotion to Khaos is distinct from worship of the Great Beyond and from the Grand Magus who tried to exploit him during the Sundering."
