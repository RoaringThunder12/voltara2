l_english:
 spn_wound_incubation.0011.desc:0 "Sleep brings no rest. You wake drenched in sweat, copper on your tongue, your dreams thick with running and roaring and the warm weight of the hunt. Each night, the dreams feel a little less like dreams."
 spn_wound_incubation.0020.t:0 "The Bear Stirs"
 spn_wound_incubation.0020.a.tt:0 "Embrace the change. The infection eases and your stress lifts - the surest path to becoming a werebear."
 spn_wound_incubation.9000.b:0 "Surrender to the bear"
 spn_wound_incubation.9000.b.tt:0 "Give yourself fully to the beast. #weak Leans hardest toward becoming a werebear - if your body survives it.#!"
 spn_wound_incubation.9011.desc:0 "The fever ebbs, and a strange clarity settles in its place. The ache fades, the wound closes clean, and you feel the bear settle into you as though it had always been there.\n\nYou have come through whole. You are a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] now."
 spn_wound_incubation.9012.desc:0 "You live. Barely. The change clawed its way through you and left its marks - nerves rubbed raw, a body wrung out and slow to mend.\n\nBut you live, and the bear lives in you: a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], bought at a steep price."
 spn_wound_incubation.9020.desc:0 "You fought it, night after night, and somehow - impossibly - you won. The fever breaks at last and does not return. The bear never came for you.\n\nYou are no werebear... but neither are you the one who was clawed. You are harder now, tempered by an ordeal few ever survive."
 spn_wound_incubation.9021.desc:0 "The sickness releases you at last, but it does not leave you as it found you. The bear never took; the fighting it did. You are torn open where the fever worked hardest, and it will be a long season before you can put weight on it without thinking.\n\nStill: you are alive, and you are yourself."
 spn_wound_incubation.0050.desc:0 "In the long hours before dawn it is not the fever that torments you, but the question beneath it. What is this thing taking root in your flesh - a punishment, a trial, or a gift wearing the mask of a curse? You have prayed until the words lost their shape in your mouth. The priests name the beasts that walk as men abominations before God; and yet here you remain, His creature still, and something else besides. When you close your eyes you can no longer tell whether the roaring you hear is the Devil at the door or your own soul learning a new and terrible tongue. However you mean to face your God through this, you must face Him alone."
 POD_wereshapeshift_interaction_lupus:0 "Shapeshift to Werebear form."
 POD_wereshapeshift_interaction_glabro:0 "Shapeshift to Half-Bear form."
 spn_force_gift_interaction_desc:0 "Rake your claws across them against their will. A werebear's claws carry a deadly curse - many never survive the wound - yet it is also how the curse spreads, willing or not. Forced upon them, the change takes hold deep in the sickness, so their odds are grim and the ordeal drags on with no certain end. Should they survive, they emerge a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )] - and they will not soon forgive the one who did this to them."
 spn_turn_into_hybrid_interaction_desc:0 "Offer the chance to become a Hybrid, an abomination with the strength of both Vampire and Werebear. The transition is dangerous and fraught with risk, but for those who survive, power unimaginable awaits."
 SPN_OFFER_HYBRID_INTERACTION_NOTIFICATION:0 "I offer to turn you into both a Vampire & Werebear."
 spn_event_bonus_to_gift_accept_desc:0 "Recent events have left this character unusually open to accepting a werebear's gift."
 spn_debug_events.0200.desc:0 "#high What the hunting layer is actually running on.#!\n\n#high Trails#! (counties carrying Something Stalks Here): #P [spn_census.MakeScope.Var('spn_dbg_trails').GetValue|0]#!\n#high Warm#! (culprit still alive: the only ones a hunt can use): #P [spn_census.MakeScope.Var('spn_dbg_warm').GetValue|0]#!\n#high Witch trails#! (what a Witch Hunt can be pointed at): #P [spn_census.MakeScope.Var('spn_dbg_witch').GetValue|0]#!\n\n#high Hunters in the world#!: #P [spn_census.MakeScope.Var('spn_dbg_hunters').GetValue|0]#!\n#high Creatures#! (vampire, werebear, hybrid, demon): #P [spn_census.MakeScope.Var('spn_dbg_creature').GetValue|0]#!\n#high Witches#! (the trait, on a ruler): #P [spn_census.MakeScope.Var('spn_dbg_witches').GetValue|0]#!\n\n#high You yourself#! -- the on_death writer's door opens for a creature, or a witch by trait OR by secret. 1 means yes.\n#high  ... a creature#!: #P [spn_census.MakeScope.Var('spn_dbg_self_creature').GetValue|0]#!\n#high  ... a witch, openly or in secret#!: #P [spn_census.MakeScope.Var('spn_dbg_self_witch').GetValue|0]#!\n\n#high Hunts running right now#! (world cap is 6): #P [spn_census.MakeScope.Var('spn_dbg_running').GetValue|0]#!\n\nTrails at 0 after years of play means nothing is writing marks, and no roll anywhere will help. Warm well below Trails means the culprits are dying of other things. Witch trails at 0 with Witches above 0 means witches are not killing anyone the county can find."
 spn_embrace_lycanthropy_decision:0 "Embrace Ursanthropy"
 spn_embrace_lycanthropy_decision_desc:0 "Do you wish to accept Ursanthropy?"
 spn_embrace_lycanthropy_decision_tooltip:0 "Become a Werebear"
 spn_msg_tooltip_embrace_lycanthropy_desc:0 "You will be prompted to choose which Werebear traits you want, or fire a random Werebear embrace event, depending on which settings you are using."
 spn_abandon_lycanthropy_decision:0 "Abandon Ursanthropy"
 spn_abandon_lycanthropy_decision_desc:0 "Do you wish to abandon Ursanthropy?"
 spn_abandon_lycanthropy_decision_tooltip:0 "Abandon Ursanthropy"
 spn_msg_tooltip_abandon_lycanthropy_desc:0 "All Werebear traits will be removed."
 spn_satiate_hunger_decision_desc:0 "Werebears can go feed and satiate their hunger, even increase in power. These hunts help control your character's impulses, and the chance to improve your lycanthropic ranking by feeding. They do however come with additional risks and rewards."
 spn_satiate_bloodhunger.b.tt:0 "Heart Healthy: Werebear"
 spn_doctrine_lycanthropy_name:0 "Ursanthropy"
 spn_doctrine_lycanthropy_crime_descriptive_name:0 "Criminal Ursanthropy"
 spn_doctrine_lycanthropy_shunned_descriptive_name:0 "Shunned Ursanthropy"
 spn_doctrine_lycanthropy_accepted_descriptive_name:0 "Accepted Ursanthropy"
 spn_doctrine_lycanthropy_virtuous_descriptive_name:0 "Virtuous Ursanthropy"
 spn_embrace.2004.desc.a:0 "You are frozen in place and witnessing this giant creature devour what moments ago was a majestic animal. It resembles that of a bear but it towers over you as it stands on its hindlegs. It pauses and sniffs towards your direction. The realization that you are discovered strikes your entire being like an enormous wave.\n\nYou stand there dumbfounded and in terror as the beast lunges at you and takes a bite out of your skull. "
 spn_embrace.2005.desc.a:0 "You are frozen in place and witnessing this giant beast devour what moments ago was a majestic animal. It resembles that of a bear but it towers over you as it stands on its hindlegs. It pauses and sniffs towards my direction. The realization that you are discovered strikes your entire being like an enormous wave.\n\nIt slowly approaches as you make no attempt to flee. The dread grows as it gets closer. By some miracle, your fellow hunters find you and fire arrows at the beast, it manages to kill some of them and you get injured in the melee and lose consciousness.\n\nYou awake in your bed in bandages. You feel no pain and seem to have fully healed. Your chancellor enters and explains you were attacked by a large bear and that your retinue saved you. No one had noticed it walked the way humans do and due to a strong fog, you decided to ruminate on the matter once you feel better.\n\nThe night brings no relief. Your physician peels back the bandages and goes quiet. The wound is not closing. It is not even trying. The flesh at its edges has gone grey and warm, and something under it moves when you breathe.\n\nYour physician tells you it will pass, and says it the way people say things they do not believe."
 spn_embrace.3001.desc:0 "A scream awakens you in the night. You take a moment to light a candle and grab a knife. You open the door to your chambers and look down the hallway. Through the dim candlelight, you make out your guardsman lying on the ground. There is blood and gore strewn throughout the hallway.\n\nYou hear the sound of your guards frantically shouting throughout the keep. At the next moment, you hear a growl that sends shivers down your spine. Suddenly the glow of two large eyes reflects the light of your candle. The bear-like monstrosity moves into the candlelight and unleashes a rumbling roar."
 spn_gain_power.4022.desc:0 "Tonight's hunt has been going as well as you can ask for, I was able to bring down a large Deer and also chased down a couple foxes and consumed their hearts.\n\nAs I decided to call it a night and travel back to the castle, as I shifted back into my human form to clean myself off, I should have checked my surroundings first. There stands on the ridge on horseback, one of my messengers returning from the count I sent him off to, staring at me with disbelief - and then he sped off on his horse into the town yelling. "Our Liege is a Werebear!"\n\n I guess the dog is out of the bag now."
 spn_gain_power.4023.desc:0 "As I finished stashing my clothes and armor, I heard some noise far off in the woods and decided to shift into my bear form, and head off into the opposite direction. All I need is to satiate my hunger and head back, no sense getting into trouble out here.\n\nI was able to find a beautiful Elk some distance out in the woods, and thought I was about to get even luckier as I lunged at another meal behind a rock, and as my teeth teared into it's neck, I realized too late..\n\nI just ripped out the throat of one of my vassals, whom I now recall was supposed to go on a hunting party in the next week! "
 spn_gain_power.4027.t:0 "Another Bear's Ground"
 setting_spn_non_hybrid_ai_can_confer_desc:0 "Only Vampire and Werebear characters will turn other characters."
 setting_spn_only_lycan_ai_can_confer:0 "Only Werebears"
 setting_spn_only_lycan_ai_can_confer_desc:0 "Only Werebear characters will turn other characters."
 setting_spn_yes_trait_inheritance_desc:0 "Hybrids create lycan children with each other. Lycan fathers create human children with human mothers. Human fathers create Werebear children with immortal mothers."
 setting_spn_no_trait_inheritance_desc:0 "Vampires, Hybrids & Werebears will not be able to procreate at all and instead will rely upon adoption."
 setting_spn_immortal_only_trait_inheritance:0 "Werebears/Hybrids Only"
 setting_spn_immortal_only_trait_inheritance_desc:0 "Werebears/Hybrids create lycan children with each other but NOT with humans."
 setting_spn_human_no_immortal_trait_inheritance:0 "Werebears/Hybrids Create Humans"
 setting_spn_human_no_immortal_trait_inheritance_desc:0 "Werebears/Hybrids create human offspring regardless of if their partners are lycan or human."
 setting_spn_human_only_trait_inheritance_desc:0 "Werebears/Hybrids can create human offspring with human partners."
 setting_spn_werewolf_trait_inheritance:0 "Default (Werebear Trait Only)"
 setting_spn_werewolf_trait_inheritance_desc:0 "Werebears/Hybrids create Werebear children with each other. Werebears procreating with humans will create human offspring occasionally."
 setting_spn_demon_yes_inheritance_desc:0 "Demons can father and bear children. Two Demons have a chance of producing a demon-blooded (Demon Spawn) child. A Demon and a Human, werebear or hybrid have a 50% chance of a demon-blooded child, otherwise a normal Human is born."
 game_concept_werewolf:0 "Werebear"
 game_concept_werewolves:0 "Werebears"
 game_concept_werewolf_desc:0 "Werebears are supernatural beings endowed with immense strength, agility, and heightened senses. Their curse compels them to embrace their dual nature, transforming into powerful beasts. Despite their primal instincts, werebears often form strong lodges and live among humans, balancing their humanity with the call of the wild."
 game_concept_hybrid_desc:0 "Hybrids are near-mythical beings born from the fusion of vampire and werebear bloodlines. Their existence defies natural law, granting them the combined strengths of both: immortality, unmatched power, and the ability to walk between worlds without many of the limitations that burden their kin. Hybrids stand as living legends, their presence both awe-inspiring and feared."
 game_concept_spn_hunter_desc:0 "Hunters are skilled and dedicated warriors tasked with protecting the world from supernatural threats. They specialize in two disciplines: Monster Hunting, which targets vampires, werebears, and other creatures, and Witch Hunting, which focuses on rogue magic users. Their resolve and training make them humanity's first line of defense against the unknown."
 game_concept_werewolves_desc:0 "Werebears are [men_at_arms|E] who are commanded by other, more powerful Supernatural Monsters, skilled in decimating an untrained enemy.\n\nWhile their quantity may be low, their high quality shines through."
 spn_initiate.1003.t:0 "Werebear Genetic Trait"
 spn_initiate.1003.desc:0 "Select which genetic Werebear trait you wish to obtain."
 spn_initiate.1003.a:0 "Become a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], as a Lone Bear."
 spn_initiate.1003.b:0 "Become a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], as a Lodge Member."
 spn_initiate.1003.c:0 "Become a [GetTrait('supernatural_werewolf').GetName( GetNullCharacter )], as a Lodge Leader."
 spn_initiate.2003.a:0 "Become a [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )], as a Fledgling Bear."
 spn_initiate.2003.b:0 "Become a [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )], as a Middling Lodge Member."
 spn_initiate.2003.c:0 "Become a [GetTrait('supernatural_hybrid').GetName( GetNullCharacter )], as a Master Lodge Leader."
 spn_received_lycanthropy:0 "You've become a Werebear"
 spn_msg_received_lycanthropy_interaction_message:0 "Ursanthropy was given to you."
 spn_confered_lycanthropy:0 "Accepted Ursanthropy"
 spn_msg_confered_lycanthropy_interaction_message:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] accepted the gift of Ursanthropy and became a Werebear."
 werewolves:0 "Werebears"
 wolves_flavor:0 "#F Few sounds in nature are more chilling than a bear's roar. Somehow it encompasses everything humanity fears about the wilderness, as well as everything we ache for.#!"
 spn_secret_werewolf:0 "Werebear"
 spn_secret_werewolf_desc:0 "Is a Werebear"
 spn_secret_werewolf_tooltip_desc:0 "This character is a Werebear."
 SPN_BLACKMAIL_NOTIFICATION_SECRET_LYCAN:0 "\nI have evidence that you're a Werebear!"
 SPN_I_CANNOT_BLACKMAIL_ANOTHER_LYCAN:0 "I cannot blackmail another [GetTrait('spn_known_werewolf').GetName( CHARACTER.Self )] for being a Werebear"
 SecretDescription_spn_werewolf:0 "is a Werebear"
 SecretDescription_spn_werewolf_first_person:0 "am a Werebear"
 spn_secret_exposed_notification_effect_message_lycan:0 "[owner.GetTitledFirstNamePossessive] Ursanthropy was exposed by [secret_exposer.GetTitledFirstName]!"
 spn_secret_exposed_notification_effect_message_lycan.i_exposed:0 "I have exposed [owner.GetTitledFirstNamePossessive] Ursanthropy!"
 spn_secrets.0003.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has denounced me as an ungodly abomination! People now label me a Werebear, and an enemy of [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.0004.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of being a Werebear! [owner.GetWomanMan|U] is a vile creature! Surely they are a creation of [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] save us from these creatures!"
 spn_secrets.0004.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has publicly accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of Ursanthropy!"
 spn_secrets.0004.worried.desc:0 "\n\nI should show them all the power Ursanthropy offers! But... I fear they would turn on me next..."
 spn_secrets.0004.dislikes_negative:0 "Slay the Werebear!"
 spn_secrets.0004.b:0 "The Werebear will pay!"
 spn_spymaster_task.0002.t:0 "Espionage: Ursanthropy"
 spn_spymaster_task.0002.spn_secret_werewolf.shared:0 "\n\nIt seems that [secret_holder.GetSheHe] is also a Werebear. Oh the things [secret_holder.GetSheHe] must have experienced... If only we could be open about our immortality."
 spn_spymaster_task.0002.spn_secret_werewolf:0 "\n\nThere is evidence that [secret_holder.GetSheHe] may have the ability to transform into a bear like creature. What other explanation would there be for something like that? They must be a Werebear!"
 supernatural_werewolf:0 "Werebear"
