 spn_hide_silverback_desc:0 "An old grey bear skin that smells of smoke and cedar. It is heavier than it looks. It is Silverback, one of the six hides. A hide does not make a bear. It answers one.\n\nSilverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_silverback_desc_christopher:0 "An old grey bear skin that smells of smoke and cedar. It is heavier than it looks. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nSilverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 spn_hide_timber_desc:0 "A brown bear skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. It is Timber, one of the six hides. A hide does not make a bear. It answers one.\n\nTimber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_timber_desc_christopher:0 "A brown bear skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nTimber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 spn_hide_tundra_desc:0 "A white bear skin, cold to the touch in any weather. It is Tundra, one of the six hides. A hide does not make a bear. It answers one.\n\nTundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_tundra_desc_christopher:0 "A white bear skin, cold to the touch in any weather. The monks keep it as the cloak of Saint Christopher, whom the Greeks paint with a dog's head. They do not let anyone wear it.\n\nTundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 spn_hide_graybeard_desc:0 "An ash-grey bear skin crossed with old scars that never closed. It is Graybeard, one of the six hides. A hide does not make a bear. It answers one.\n\nGraybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
