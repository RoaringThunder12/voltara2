 trait_spn_champion_timber_desc:0 "Chosen by Timber, one of the six hides. Its spirit lives in this character, and when they take the bear's shape, the bear is Timber's - brown as bark.\n\nThe loner. Alone in the woods it is at its strongest, and it is hard to find."
