 trait_spn_champion_silverback_desc:0 "Chosen by Silverback, one of the six hides. Its spirit lives in this character, and when they take the bear's shape, the bear is Silverback's - grey as smoke.\n\nThe strongest of the six. It stands between the weak and what would hurt them."
