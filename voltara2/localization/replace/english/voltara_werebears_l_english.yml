 spn_hide_midnight_desc:0 "A black bear skin. It is warm before anyone touches it. It is Midnight, one of the six hides. A hide does not make a bear. It answers one.\n\nMidnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
