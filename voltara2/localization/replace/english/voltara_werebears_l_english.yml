 trait_supernatural_werewolf_desc:0 "This character is a Werebear.\nThis is a genetic trait and can be improved."
 trait_track_lycanthropy:0 "Ursanthropy"
 trait_track_lycanthropy_desc:0 "A person who turns into a bear and devours animals, people, or corpses but returns to human."
 trait_track_wolf_pack:0 "Lodge Standing"
 trait_track_wolf_pack_desc:0 "Your place among bears. It rises with years in a [spn_pack|E], with a [werewolf_gathering|E] well kept and with a Challenge won, and falls when you leave a lodge, or lose or refuse a Challenge. It decides who may found a lodge, who stands Second, and who may Challenge the alpha."
 trait_ww_infected_wound_desc:0 "A festering wound left by a werebear's claws. The body wages a long, brutal war against the change - over one to three years it either takes hold and they turn, or it overwhelms them."
 trait_spn_werewolf_3_confer_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Werebear.\nThis is a genetic trait and cannot be improved. There is a chance for children to inherit improved versions of these traits.\n\n#high Clawed By: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_conferred_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_both_parents_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Werebear.\nThis is a genetic trait and cannot be improved. There is a chance for children to inherit improved versions of these traits.\n\n#high Mother: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!\n#high Father: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_mother_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Werebear.\nThis is a genetic trait and cannot be improved. There is a chance for children to inherit improved versions of these traits.\n\n#high Mother: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_mother_sire').GetCharacter.GetName] #!"
 trait_spn_werewolf_3_father_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Werebear.\nThis is a genetic trait and cannot be improved. There is a chance for children to inherit improved versions of these traits.\n\n#high Father: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_father_sire').GetCharacter.GetName] #!"
 trait_spn_true_werewolf:0 "True Werebear"
 trait_spn_true_werewolf_desc:0 "This is a powerful Werebear who has great strength."
 trait_spn_known_werewolf:0 "Known Werebear"
 trait_spn_known_werewolf_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is known to be a Werebear."
 trait_track_hybrid_lycanthropy:0 "Ursanthropy"
 trait_track_hybrid_lycanthropy_desc:0 "A person who turns into a bear and devours animals, people, or corpses but returns to human."
 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.38#!\nUpdated for CK3 1.20. To support the mod, search #high "Dlonem"#! on YouTube\nand subscribe. Questions about the mod? Read the wiki:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.38 – The Hermetic Order of the Blue Rose:#!\n$BULLET_WITH_TAB$The Order of the Blue Rose: six temples of Mages.\n$BULLET_WITH_TAB$A letter comes. Pass its test, rise to Temple Magus.\n$BULLET_WITH_TAB$Temples follow Silence, Subservience or Observance.\n$BULLET_WITH_TAB$The Gnostic Council and its Grand Magus lead it.\n$BULLET_WITH_TAB$When the chair falls empty, a Conclave picks again.\n$BULLET_WITH_TAB$Eight relics to pledge to your temple or lend out.\n$BULLET_WITH_TAB$Seize Their Relics: a war for a rival's magic hoard.\n$BULLET_WITH_TAB$The Vade Maecum Infernal: four pages, one dark book.\n$BULLET_WITH_TAB$Zecchia, a demon thief, answers some summonings.\n$BULLET_WITH_TAB$Covens get their own panel and can join the Order.\n$BULLET_WITH_TAB$Friendly spells now sit in the Supernatural menu.\n$BULLET_WITH_TAB$Two new game rules: the Order, and the Vade Maecum.\n\n#high 2.38 – Balance:#!\n$BULLET_WITH_TAB$One capstone: Mage, Warlock or True Witch, not two.\n$BULLET_WITH_TAB$The AI picks its path, and necromancy, by nature.\n$BULLET_WITH_TAB$Magic artifacts reach courtiers and adventurers.\n$BULLET_WITH_TAB$The werebear trait gives less Martial.\n$BULLET_WITH_TAB$Bear tiers: Seasoned and Elder replace Feral, Primal.\n$BULLET_WITH_TAB$Champions who practice magic regain power every year.\n$BULLET_WITH_TAB$Lodges invite lone bears they know.\n$BULLET_WITH_TAB$The Order favors young heirs to great titles.\n$BULLET_WITH_TAB$New temples start in the West on the vanilla map.\n$BULLET_WITH_TAB$True Witches appear again beside the Order's Mages.\n\n#high 2.38 – Fixes:#!\n$BULLET_WITH_TAB$Healing no longer takes the Horned God's Claws.\n$BULLET_WITH_TAB$Renouncing necromancy takes its skeleton troops too.\n$BULLET_WITH_TAB$Demand Submission converts the target properly.\n$BULLET_WITH_TAB$Creature lifestyle experience shows in tooltips.\n$BULLET_WITH_TAB$Thousands of script errors removed.\n\n#high 2.37 – The Six Hides:#!\n$BULLET_WITH_TAB$Six ancient bear hides, each with a will of its own.\n$BULLET_WITH_TAB$A hide chooses a bear who fits it as its Champion.\n$BULLET_WITH_TAB$Champions are stronger, hear magic, never grow frail.\n$BULLET_WITH_TAB$The Hide Bond deepens every year the hide is worn.\n$BULLET_WITH_TAB$Most hides start as relics in shrines at holy sites.\n$BULLET_WITH_TAB$Take one by holding the county, siege or pilgrimage.\n$BULLET_WITH_TAB$Or pay to Send for a Hide, however far away it is.\n$BULLET_WITH_TAB$A hide an AI leaves idle for ten years slips away.\n$BULLET_WITH_TAB$Werebears and hybrids can found and join lodges.\n$BULLET_WITH_TAB$Lodge Standing rises with years and Challenges won.\n$BULLET_WITH_TAB$Beat the alpha in a Challenge and the lodge is yours.\n$BULLET_WITH_TAB$AI bears challenge an alpha only for a reason.\n$BULLET_WITH_TAB$A new activity: the Werebear Gathering.\n$BULLET_WITH_TAB$A slain Champion gives a hunter double prestige.\n$BULLET_WITH_TAB$Two new game rules: The Six Hides, and Lodges.\n$BULLET_WITH_TAB$Works on a running save. Hides appear within a year.\n\n#high 2.37 – Fixes:#!\n$BULLET_WITH_TAB$Supernatural death reasons read as sentences now.\n$BULLET_WITH_TAB$The refused-the-blood death no longer shows an error.\n$BULLET_WITH_TAB$They Stopped Coming has its icon.\n$BULLET_WITH_TAB$A broken link in Invoke the Bond is fixed.\n$BULLET_WITH_TAB$He, she and his start sentences with a capital.\n$BULLET_WITH_TAB$Demons can have children with werebears and hybrids.\n\n#high 2.36 – Crusader Kings III 1.20:#!\n$BULLET_WITH_TAB$New games no longer crash on loading in.\n$BULLET_WITH_TAB$Creature doctrines sit on every rite, new ones included.\n$BULLET_WITH_TAB$Known creatures are sins or virtues of a rite, like witches.\n$BULLET_WITH_TAB$Supernatural choices count toward Spiritual Fulfillment.\n$BULLET_WITH_TAB$Your rite judges your feeding, killing and turning others.\n$BULLET_WITH_TAB$It only condemns them once you are known for what you are.\n$BULLET_WITH_TAB$The zealous feel it more. Cynics are never punished for it.\n$BULLET_WITH_TAB$A feed only leaves a trail when somebody talks about it.\n$BULLET_WITH_TAB$Crimes, shunning and the witch war follow the rite.\n$BULLET_WITH_TAB$Characters the mod creates or converts keep the right rite.\n$BULLET_WITH_TAB$The Seekers camp purpose is back.\n$BULLET_WITH_TAB$Scholar is now Erudite, and keeps its magic bonus.\n$BULLET_WITH_TAB$Activity art, event icons and load tips fixed for 1.20.\n\n#high 2.35a – Fixes:#!\n$BULLET_WITH_TAB$Turning down a witch hunt no longer kills the witch.\n$BULLET_WITH_TAB$Your own witches stop vanishing after you marry them away.\n$BULLET_WITH_TAB$Frequent witch and monster sightings are for hunters again.\n$BULLET_WITH_TAB$Far fewer hunters and creatures appear on their own.\n$BULLET_WITH_TAB$Monster Sighting could fire on anyone. It has a gate now.\n$BULLET_WITH_TAB$A plain assassination no longer reads as a creature's kill.\n\n#high 2.35 – The Hunt:#!\n$BULLET_WITH_TAB$A new activity: ride out and hunt what is killing people.\n$BULLET_WITH_TAB$Kills and prowling leave trails on the counties they happen in.\n$BULLET_WITH_TAB$Trails escalate. Three incidents and the lord hears about it.\n$BULLET_WITH_TAB$He can look himself, set his spymaster on it, post a bounty,\n$BULLET_WITH_TAB$or send for a named hunter and pay him when it is done.\n$BULLET_WITH_TAB$A new court position, the Trailsman, reads the countryside.\n$BULLET_WITH_TAB$Hunt a creature or hunt a witch, with their own trails and beats.\n$BULLET_WITH_TAB$Bring silver, stakes, dogs or men, and the door goes differently.\n$BULLET_WITH_TAB$Take an apprentice along and he graduates in the field.\n$BULLET_WITH_TAB$The creature gets the other half of the scene, and real answers:\n$BULLET_WITH_TAB$stand and fight, go to ground, compel him, send your progeny,\n$BULLET_WITH_TAB$let the bear out, or talk him onto somebody worse.\n$BULLET_WITH_TAB$Get away and you can warn your sire and your get – or sell them.\n$BULLET_WITH_TAB$Demons argue instead of running, and may offer a bargain.\n$BULLET_WITH_TAB$Hunters and creatures earn names the world starts using.\n$BULLET_WITH_TAB$A county that turns three hunters away stops attracting any.\n$BULLET_WITH_TAB$Cover your own kills: pay it off, frame someone, or hide the body.\n$BULLET_WITH_TAB$Compel a whole town and the holes start to line up.\n$BULLET_WITH_TAB$Hunters ride at bad odds far less often, and can turn back.\n\n#high 2.35 – Fixes:#!\n$BULLET_WITH_TAB$Witch hunts were impossible to reach. They work now.\n$BULLET_WITH_TAB$Two files never loaded, so no trail was ever written.\n$BULLET_WITH_TAB$The hunter migration layer never ran. It runs.\n$BULLET_WITH_TAB$Hunters are told about witches and monsters far more often.\n$BULLET_WITH_TAB$Secret witches leave trails, not only openly known ones.\n$BULLET_WITH_TAB$Compelling someone for their secrets no longer errors.\n$BULLET_WITH_TAB$Thousands of script errors a session removed.\n$BULLET_WITH_TAB$Hunter regiments now need the Hunter Academies perk.\n\n#high 2.34a – Fixes:#!\n$BULLET_WITH_TAB$Your spymaster stops finding secrets you already know.\n$BULLET_WITH_TAB$Makers, sires, trainers and parents know what they made.\n$BULLET_WITH_TAB$Existing saves are repaired once on load.\n\n#high 2.34 – The blood remembers who:#!\n$BULLET_WITH_TAB$Turnings are remembered, and name your maker.\n$BULLET_WITH_TAB$Makers, clawers and trainers remember you too.\n$BULLET_WITH_TAB$Six one-off events grow out of those memories.\n$BULLET_WITH_TAB$A maxed vampire can compel a hunter to go home.\n$BULLET_WITH_TAB$Invoke the Bond shows its costs and gains four orders.\n$BULLET_WITH_TAB$True Witch Hunter and True Monster Hunter capstones.\n$BULLET_WITH_TAB$Witch hunts open on the track, not the capstone.\n$BULLET_WITH_TAB$Vampires can feed on tribal holdings.\n$BULLET_WITH_TAB$Demons no longer catch diseases.\n\n#high 2.34 – Fixes:#!\n$BULLET_WITH_TAB$Magic capstone traits are granted again.\n$BULLET_WITH_TAB$The Bond's Marry me and You Owe Me buttons work.\n$BULLET_WITH_TAB$Refusing the Bond finally has a cost.\n$BULLET_WITH_TAB$Fallen hunters lose the whole hunter identity.\n$BULLET_WITH_TAB$Witches are no longer randomly turned.\n$BULLET_WITH_TAB$The witch-hunter quest makes a real hunter.\n$BULLET_WITH_TAB$Supernaturals can open other lifestyles again.\n$BULLET_WITH_TAB$AI supernaturals pick their own focus more.\n$BULLET_WITH_TAB$Protection Runes and Combat Spells do something.\n\n#high 2.33 – The blood remembers:#!\n$BULLET_WITH_TAB$Fall in battle with vampire blood in you and rise.\n$BULLET_WITH_TAB$Weeks of hunger, then feed or refuse for good.\n$BULLET_WITH_TAB$Drain a dying captain, a knight, or a stranger.\n$BULLET_WITH_TAB$If the one who gave you the blood is there, ask them.\n$BULLET_WITH_TAB$Whoever gave you the blood becomes your maker.\n$BULLET_WITH_TAB$Stubborn and zealous characters refuse more often.\n$BULLET_WITH_TAB$Works landed or landless, and needs no patch.\n\n#high 2.33 – Fixes:#!\n$BULLET_WITH_TAB$Maker and Progeny are set on every way you turn.\n\n#high 2.32 – Content:#!\n$BULLET_WITH_TAB$Feed in foreign cities, not just your own realm.\n$BULLET_WITH_TAB$Victims come from the local court, not yours.\n$BULLET_WITH_TAB$Vampires have their Satiate Thirst decision back.\n$BULLET_WITH_TAB$Two new vampire branches: the road, and paid blood.\n$BULLET_WITH_TAB$Two new werebear branches: the border, and a rival.\n$BULLET_WITH_TAB$Surviving a hunter now makes you stronger.\n$BULLET_WITH_TAB$Werebears are named by tier, like vampires.\n$BULLET_WITH_TAB$Your sire and progeny can always invite you.\n$BULLET_WITH_TAB$A maxed track feeds your lifestyle instead of nothing.\n\n#high 2.32 – Fixes:#!\n$BULLET_WITH_TAB$The stalked victim is one person, not three.\n$BULLET_WITH_TAB$The success bar and its tooltip finally agree.\n$BULLET_WITH_TAB$Guests no longer inflate that bar to its ceiling.\n$BULLET_WITH_TAB$Over a third of AI feeding events never fired.\n$BULLET_WITH_TAB$The werebear kill branch grants XP, like the vampire.\n$BULLET_WITH_TAB$Hybrids no longer die to a werebear-only death.\n$BULLET_WITH_TAB$Curing ursanthropy removes the perks it granted.\n$BULLET_WITH_TAB$The AI climbs your perk trees instead of stalling.\n$BULLET_WITH_TAB$31 portraits used animations that did not exist.\n$BULLET_WITH_TAB$Landless adventurers can finish every branch.\n\n#high 2.31c – Fixes:#!\n$BULLET_WITH_TAB$Dragons can no longer be turned, compelled or cursed.\n$BULLET_WITH_TAB$Wights, Others and the Night King are excluded too.\n$BULLET_WITH_TAB$Spymasters can uncover every secret type again, not 4.\n$BULLET_WITH_TAB$Perk point alerts work for the four creature focuses.\n$BULLET_WITH_TAB$The Magic Council's host arrives at full strength.\n$BULLET_WITH_TAB$Dark temples no longer error for landless casters.\n$BULLET_WITH_TAB$130 spell tooltips showed a raw key. They read now.\n$BULLET_WITH_TAB$The eight Originals use AGOT's current portrait genes.\n$BULLET_WITH_TAB$Supernaturals keep modern hair, and never go bald.\n\n#high 2.31c – Changes:#!\n$BULLET_WITH_TAB$Yearly NPC sweeps no longer walk everyone at once.\n$BULLET_WITH_TAB$A duplicate on_action warning at load is gone.\n\n#high 2.31a – Fixes:#!\n$BULLET_WITH_TAB$Master of Shadows and Vampire Nest can be clicked.\n$BULLET_WITH_TAB$Two hunter perks had the same fault and are fixed too.\n$BULLET_WITH_TAB$A quarter of NPC werebears were spawning as vampires.\n$BULLET_WITH_TAB$Scholarly education returns its 2 lost domain slots.\n$BULLET_WITH_TAB$Pregnancy no longer drops to 5% after one child.\n$BULLET_WITH_TAB$Demon-blooded children grow into demons in their 20s.\n$BULLET_WITH_TAB$All ten vanilla secret descriptions load again.\n$BULLET_WITH_TAB$Set Visual Age no longer resets on your next birthday.\n$BULLET_WITH_TAB$Werebears in glabro form are detected properly again.\n$BULLET_WITH_TAB$Vampires, werebears and hybrids resist disease again.\n$BULLET_WITH_TAB$Consumption is cured on turning, like every illness.\n\n#high 2.31a – Changes:#!\n$BULLET_WITH_TAB$A werebear bite festers one to three years first.\n$BULLET_WITH_TAB$Survive a Lycan and a Hunter may spare you.\n$BULLET_WITH_TAB$The peddler's elixir no longer says what you become.\n$BULLET_WITH_TAB$Feeding invites only reach those who could know.\n$BULLET_WITH_TAB$Map-wide character sweeps replaced with cheap ones.\n\n#high Reported by:#!\nCleverPolarBear, Lord Zymeth, Noa3, ТоЬЬыэЯ, Omni,\nAngel DeStaar, Explode_Toad, manic_Mage, AZTRAGOS,\nvaldijan72, Dr. Baphomet, Plato in the Cave.\n\n#high Load order with AGOT:#!\nAGOT, AGOT submods, The Long Night & Azor Ahai (optional),\nSupernatural, then the Compatibility Patch – always last.\n\n#high Thanks for the support,#!\nDlonem"
