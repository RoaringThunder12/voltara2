 spn_call_the_packs_decision:0 "Call the Lodges"
 spn_call_the_packs_decision_desc:0 "Alpha wants the scattered lodges called together. For a year, every alpha within reach will hear you, and those who come owe you."
 spn_call_the_packs_decision_tooltip:0 "Call every lodge within reach to a Werebear Gathering."
 spn_found_pack_decision:0 "Found a Lodge"
 spn_found_pack_decision_desc:0 "Gather the bears who will follow you and lead them as their alpha."
 spn_found_pack_standing_tt:0 "You are a [spn_champion|E], or your [spn_pack_standing|E] is 50 (40 with Lodge Leader, or for a bear born a bear; 25 when another bear at your court could run with you)"
 spn_leave_pack_decision:0 "Leave the Lodge"
 spn_leave_pack_decision_desc:0 "Walk away from your lodge. It will cost you [spn_pack_standing|E], and your alpha will not like it."
 spn_disband_pack_decision:0 "Disband the Lodge"
 spn_disband_pack_decision_desc:0 "Send every bear in your lodge its own way. No bear loses anything by it."
 spn_invite_to_pack_interaction:0 "Invite to the Lodge"
 spn_invite_to_pack_interaction_desc:0 "Invite this bear to run with your [spn_pack|E]."
 spn_invite_to_pack_interaction_notification:0 "[actor.GetShortUIName|U] invites you to run with [actor.GetHerHis] lodge."
 spn_challenge_interaction_desc:0 "Settle it the old way: a brawl between bears, no swords. The loser is hurt and loses [spn_pack_standing|E]. Beat your alpha and the lodge is yours."
 spn_ask_to_run_with_interaction:0 "Ask to Run With Their Lodge"
 spn_ask_to_run_with_interaction_notification:0 "[actor.GetShortUIName|U] asks to run with your lodge."
 spn_lure_away_interaction_desc:0 "Invite one of another lodge's bears to run with yours instead. Their alpha will not forgive it."
 spn_lure_away_interaction_notification:0 "[actor.GetShortUIName|U] asks you to leave your lodge and run with [actor.GetHerHis]."
 spn_pack_full_tt:0 "The lodge has room"
 spn_invite_recently_tt:0 "You have not invited this bear in the last two years"
 spn_ai_pack_standing:0 "Standing among bears"
 spn_ai_pack_friend_inside:0 "A friend or lover in the lodge"
 spn_ai_pack_small:0 "A small lodge needs bears"
 spn_unification_too_many_tt:0 "Together your lodges would be no more than 25 bears"
 spn_unification_no_elder_tt:0 "A third bear is here to stand as elder"
 setting_spn_hides_lost_desc:0 "All six hides are lost when the game begins. Each wakes in its own time and goes looking for a bear."
 setting_spn_hides_scattered_desc:0 "Alpha is lost. One hide is worn by a werebear who fits it, if one exists; the rest are kept in shrines as holy relics."
 setting_spn_hides_awakened_desc:0 "Every hide but Alpha starts on a werebear who fits it."
 rule_spn_packs_rule:0 "Supernatural: Lodges"
 setting_spn_packs_on_desc:0 "Bears can found and join lodges, rise in Lodge Standing, and feud between lodges."
 setting_spn_packs_off_desc:0 "No lodges. The Werebear Gathering still runs, with a smaller council."
 game_concept_spn_six_hides_desc:0 "Six ancient bear hides, each with a spirit and a will of its own: Silverback, Timber, Tundra, Graybeard, Midnight and Alpha. A hide chooses its [spn_champion|E] and goes into them. Put one on and it decides within days: it will take a bear who has one of the traits it looks for and more of those than of the traits it turns from, or a bear deep enough in the blood. The lodges call them the First Six; the faithful keep them as relics; the witches say they are six souls sewn into skins.\n\nA hide does not make a bear. It answers one."
 game_concept_spn_champion_desc:0 "A bear a hide has chosen. The hide's spirit is in them: they are stronger, they live longer, old age cannot break them, they hear magic, and when they take the bear's shape the bear is the hide's. Only death, a mage's unbinding or losing the bear's blood can take a hide from its champion.\n\nA champion who practices magic, as a Mage, a True Witch or one born with the Source, regains power every year. A Mage among them also grows in Combat Magic."
 game_concept_spn_pack:0 "Lodge"
 game_concept_spn_pack_desc:0 "Bears who run together under an alpha. Every bear in a lodge is stronger for its size, and gains [spn_pack_standing|E] each year."
 game_concept_spn_pack_standing:0 "Lodge Standing"
 game_concept_spn_pack_standing_desc:0 "A bear's place among bears. It rises with years in a [spn_pack|E], a [werewolf_gathering|E] well kept and a Challenge won, and falls when a bear leaves a lodge, or loses or refuses a Challenge."
 game_concept_spn_alpha_desc:0 "The bear who leads a [spn_pack|E]. Beat your own alpha in a Challenge and the lodge is yours."
 game_concept_spn_second_desc:0 "The bear who stands highest in a [spn_pack|E] after the alpha. Within the lodge only the Second may challenge the alpha, and only at [spn_pack_standing|E] 50. Once the alpha beats the Second, any bear of the lodge at 50 may, for two years."
 game_concept_spn_omega_desc:0 "A bear with no [spn_pack|E]."
 game_concept_spn_unification_desc:0 "An old rite that joins two lodges whose alphas are married. It works only if there are no secrets between them. Every bear in the joined lodge is [spn_evolved|E]."
 game_concept_spn_evolved_desc:0 "A bear whose [spn_pack|E] was joined by the Unification. They fight as if in the bear's shape even when they are not."
 game_concept_spn_hide_feud_desc:0 "Bad blood between two lodges over a hide that passed from one to the other."
 game_concept_werewolf_gathering:0 "Werebear Gathering"
 game_concept_werewolf_gathering_desc:0 "Bears come together to run, and to sit in council around a fire. Hides choose there, and news travels."
 game_concept_spn_hide_silverback_desc:0 "An old grey bear skin that smells of smoke and cedar. It is heavier than it looks. The strongest of the six. It stands between the weak and what would hurt them. Silverback looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('honest').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]."
 game_concept_spn_hide_timber_desc:0 "A brown bear skin, stiff, smelling of pine pitch. It feels lighter when nobody is near. The loner. Alone in the woods it is at its strongest, and it is hard to find. Timber looks for a champion who is [GetTrait('shy').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] or [GetTrait('wrathful').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('gregarious').GetName( GetNullCharacter )] or [GetTrait('trusting').GetName( GetNullCharacter )]."
 game_concept_spn_hide_tundra_desc:0 "A white bear skin, cold to the touch in any weather. The patient one. Its champions talk their way out of what others fight. Tundra looks for a champion who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )] or [GetTrait('patient').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('honest').GetName( GetNullCharacter )] or [GetTrait('impatient').GetName( GetNullCharacter )]."
 game_concept_spn_hide_graybeard_desc:0 "An ash-grey bear skin crossed with old scars that never closed. The most fearless. Its champions do not step back, and their soldiers do not either. Graybeard looks for a champion who is [GetTrait('brave').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )] or [GetTrait('strong').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('craven').GetName( GetNullCharacter )] or [GetTrait('paranoid').GetName( GetNullCharacter )]."
 game_concept_spn_hide_midnight_desc:0 "A black bear skin. It is warm before anyone touches it. The most savage. The world can feel what its champion is. Midnight looks for a champion who is [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('brave').GetName( GetNullCharacter )] or [GetTrait('sadistic').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )] or [GetTrait('compassionate').GetName( GetNullCharacter )]."
 game_concept_spn_hide_alpha_desc:0 "A great red-brown bear skin. Dogs lie down when it is carried past. The leader's hide, lost for decades. It takes only a leader, and the leader's lodge grows faster for it. Alpha looks for a champion who is [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('just').GetName( GetNullCharacter )] or [GetTrait('arrogant').GetName( GetNullCharacter )]. It turns from anyone who is [GetTrait('lazy').GetName( GetNullCharacter )], [GetTrait('content').GetName( GetNullCharacter )] or [GetTrait('craven').GetName( GetNullCharacter )]."
 game_concept_spn_packs:0 "Lodges"
 spn_pack_mate:0 "Lodge Mate"
 spn_rel_pack_scent:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] lead lodges that run the same woods."
 spn_rel_young_wolves_fought:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] fought as young bears and came out of it friends."
 spn_rel_kindred:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] found each other in the woods, though they run with different lodges."
 house_relation_reason_spn_unified_desc:0 "[char.GetShortUINameNotMe|U] took [target_char.GetShortUINamePossessiveNotMy] people into [char.GetHerHis] own lodge"
 spn_wound_incubation.9000.f.tt:0 "The hide pulls you through. You become a werebear, you gain [GetTrait('strong').GetName( GetNullCharacter )], and you come out of the fever as strong as it can make you."
 spn_the_prowl_pack_tt:0 "You can Challenge any werebear or hybrid you know, in your own [spn_pack|E] or outside it."
 spn_wolf_challenge_pack_tt:0 "You can Challenge any werebear or hybrid you know, in your own [spn_pack|E] or outside it."
 spn_pack_mentality_pack_tt:0 "Your lodge's strength in numbers counts half again for you."
 spn_wolf_politics_pack_tt:0 "Leaving a lodge costs you half the usual [spn_pack_standing|E], and, as an alpha, you can Lure Away bears from other lodges."
 spn_debug_events.0304.t:0 "Debug: Found a Lodge"
 spn_debug_events.0304.desc:0 "Found a lodge with three new werebears at your court."
 spn_debug_events.0305.t:0 "Debug: Werebear Gathering"
 spn_debug_events.0305.desc:0 "Open the Werebear Gathering planner."
 spn_wound_incubation.9000.g:0 "Let the lodge carry me."
 spn_wound_incubation.9000.g.tt:0 "The bears who sat with you see you through: you are likelier to come out a bear and less likely to die. If you turn and [ROOT.Char.MakeScope.Var('spn_pack_carried_by').Char.GetShortUIName] runs with a [spn_pack|E] that has room, you wake in it."
 spn_debug_events.0307.desc:0 "Start the phase your Werebear Gathering is waiting for."
 spn_debug_events.0306.t:0 "Debug: Give a Bear a Hide"
 spn_debug_events.0306.desc:0 "Give the nearest AI bear a hide that does not exist yet."
 spn_challenge_why_cruel:0 " 'The lodge deserves a better alpha than you.'"
 spn_challenge_why_climb:0 " 'Let us see which of us the lodge follows.'"
 spn_became_werewolf_memory_desc:0 "[clawer.GetTitledFirstName] opened my arm with [clawer.GetHerHis] claws, and I let [clawer.GetHerHim]. The wound closed. The bear did not"
 spn_became_werewolf_memory_desc_second_perspective:0 "[clawer.GetTitledFirstName] opened your arm with [clawer.GetHerHis] claws, and you let [clawer.GetHerHim]. The wound closed. The bear did not"
 spn_became_werewolf_memory_desc_third_perspective:0 "[clawer.GetTitledFirstName] opened [owner.GetNamePossessive] arm with [clawer.GetHerHis] claws, and [owner.GetSheHe] let [clawer.GetHerHim]. The wound closed. The bear did not"
 spn_became_werewolf_memory_desc_forced:0 "[clawer.GetTitledFirstName] pinned me and opened my arm with [clawer.GetHerHis] claws. I fought. It did not matter. The wound closed. The bear did not"
 spn_became_werewolf_memory_desc_forced_second_perspective:0 "[clawer.GetTitledFirstName] pinned you and opened your arm with [clawer.GetHerHis] claws. You fought. It did not matter. The wound closed. The bear did not"
 spn_became_werewolf_memory_desc_forced_third_perspective:0 "[clawer.GetTitledFirstName] pinned [owner.GetName] and opened [owner.GetHerHis] arm with [clawer.GetHerHis] claws. [owner.GetSheHe|U] fought. It did not matter. The wound closed. The bear did not"
 spn_woke_a_werewolf_memory:0 "the bear woke"
 spn_woke_a_werewolf_memory_desc_born:0 "I was born with the bear already in my blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_born_second_perspective:0 "you were born with the bear already in your blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_born_third_perspective:0 "[owner.GetName] was born with the bear already in [owner.GetHerHis] blood. There was never a night it was not there"
 spn_woke_a_werewolf_memory_desc_1:0 "the bear woke in me one night, and I never learned who put it there"
 spn_woke_a_werewolf_memory_desc_1_second_perspective:0 "the bear woke in you one night, and you never learned who put it there"
 spn_woke_a_werewolf_memory_desc_1_third_perspective:0 "the bear woke in [owner.GetName] one night, and [owner.GetSheHe] never learned who put it there"
 spn_became_hybrid_memory_desc:0 "[maker.GetTitledFirstName] gave me [maker.GetHerHis] blood while the bear was still in me. I died with both, and I rose with both"
 spn_became_hybrid_memory_desc_second_perspective:0 "[maker.GetTitledFirstName] gave you [maker.GetHerHis] blood while the bear was still in you. You died with both, and you rose with both"
 spn_became_hybrid_memory_desc_third_perspective:0 "[maker.GetTitledFirstName] gave [owner.GetName] blood while the bear was still in [owner.GetHerHim]. [owner.GetSheHe|U] died with both, and rose with both"
 spn_became_hybrid_memory_desc_forced:0 "[maker.GetTitledFirstName] held something over me, and I drank with the bear still in me. I died with both, and I rose with both"
 spn_became_hybrid_memory_desc_forced_second_perspective:0 "[maker.GetTitledFirstName] held something over you, and you drank with the bear still in you. You died with both, and you rose with both"
 spn_became_hybrid_memory_desc_forced_third_perspective:0 "[maker.GetTitledFirstName] held something over [owner.GetName], and [owner.GetSheHe] drank with the bear still in [owner.GetHerHim]. [owner.GetSheHe|U] died with both, and rose with both"
 spn_woke_a_hybrid_memory_desc_1:0 "I died with the bear in me and something else besides, and I woke with both. I never learned whose blood it was"
 spn_woke_a_hybrid_memory_desc_2:0 "the bear should have died with me. It did not, and neither did I, and there was a new thirst beside it"
 spn_woke_a_hybrid_memory_desc_3:0 "I woke with my heart stopped and the bear still pacing inside me. Whoever gave me the blood did not stay to explain"
 spn_woke_a_hybrid_memory_desc_1_second_perspective:0 "you died with the bear in you and something else besides, and you woke with both. You never learned whose blood it was"
 spn_woke_a_hybrid_memory_desc_2_second_perspective:0 "the bear should have died with you. It did not, and neither did you, and there was a new thirst beside it"
 spn_woke_a_hybrid_memory_desc_3_second_perspective:0 "you woke with your heart stopped and the bear still pacing inside you. Whoever gave you the blood did not stay to explain"
 spn_woke_a_hybrid_memory_desc_1_third_perspective:0 "[owner.GetName] died with the bear in [owner.GetHerHim] and something else besides, and woke with both. [owner.GetSheHe|U] never learned whose blood it was"
 spn_woke_a_hybrid_memory_desc_2_third_perspective:0 "the bear should have died with [owner.GetName]. It did not, and neither did [owner.GetSheHe], and there was a new thirst beside it"
 spn_woke_a_hybrid_memory_desc_3_third_perspective:0 "[owner.GetName] woke with [owner.GetHerHis] heart stopped and the bear still pacing inside [owner.GetHerHim]. Whoever gave [owner.GetHerHim] the blood did not stay to explain"
 spn_clawed_someone_memory_desc:0 "I put my claws into [turned.GetTitledFirstName], and the bear took. [turned.GetSheHe|U] carries it now because of me"
 spn_clawed_someone_memory_desc_second_perspective:0 "you put your claws into [turned.GetTitledFirstName], and the bear took. [turned.GetSheHe|U] carries it now because of you"
 spn_clawed_someone_memory_desc_third_perspective:0 "[owner.GetName] put [owner.GetHerHis] claws into [turned.GetTitledFirstName], and the bear took. [turned.GetSheHe|U] carries it now because of [owner.GetHerHim]"
 spn_memory.0003.desc:0 "You watch [spn_born_child.GetTitledFirstName] from across the garden. [spn_born_child.GetSheHe|U] stops mid-step and turns [spn_born_child.GetHerHis] head toward a sound no one else hears. You know that look. You wear it.\n\nSomeone put the bear into you with their claws. Nobody put it into [spn_born_child.GetHerHim]. [spn_born_child.GetSheHe|U] was born with it, and [spn_born_child.GetSheHe] chose nothing.\n\n[spn_born_child.GetSheHe|U] does not know what you are. Not yet."
 spn_memory.0004.desc.blood_ahead:0 "The blood has had its way for years now. The thirst is sharp and practised and answers when you call it. The bear is thin. It paces somewhere far back, half-starved, and some nights you forget it is there at all.\n\nYou were made both. You have been living as one."
 spn_memory.0004.desc.wolf_ahead:0 "The bear has had its way for years now. It is strong and close and answers when you call it. The thirst is thin. It scratches somewhere far back, half-starved, and some nights you forget it is there at all.\n\nYou were made both. You have been living as one."
 spn_debug_events.0414.desc:0 "Kills one of the five who carry your illness. The killer is a bear at your court if there is one, else you."
 spn_relic_blade_modifier_desc:0 "It cuts a bear like silver does."
 spn_relic_blade_desc:0 "A plain-looking dagger that cuts a bear as silver does. Hunters have wanted it for a long time."
 spn_vade_page_4_desc:0 "A page of the [spn_vade_maecum|E]. For years it was hidden in a bear's hide, and it still smells of one."
 spn_hud_pack_tt:0 "Your Lodge\nOpens your Situations, where your lodge is listed."
 spn_hunt.0100.desc_demon:0 "You have seen a house a bear went through. You have seen a room a vampire worked in. This is neither.\n\nThe man is on his own floor with his hands at his sides. No wound. Nothing missing. The fire is out, the milk has turned, and the dog will not come in off the step.\n\nHis wife says he sat down halfway through a sentence and did not finish it."
 spn_hunt.0160.desc:0 "Four now, in three weeks, and you still cannot say what you are looking at.\n\nA vampire's work is missing something. A bear's is torn. These are whole, and cold, and every one was found somewhere they had no reason to be.\n\nThe cooper's wife walked into her own well. The reeve held his hand in the fire. Nobody screamed. The neighbours keep saying that as though it helps."
 spn_hunt.0162.desc:0 "There is a man in the county asking questions. By the third day you have his name, his trade, and the inn he is at.\n\nA bear would be in the next valley by now. A vampire would be thinking about cellars. You find you are thinking about him: what he is owed, what he is short of, what nobody has ever offered him.\n\nEverybody wants something."
 spn_hide.0010.desc_timber:0 "The hide is brown and stiff and smells of pine pitch. You put it on and the room goes very quiet.\n\nSomething slips into you the way a bear slips between trees - no sound, no hurry. For a moment you can hear every breath in the hall, and you do not like any of them. Then the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Timber, one of the six hides. It chose you. It does not share."
 spn_hide.0010.desc_alpha:0 "The hide is red-brown and heavy, and the dogs in the yard begin to roar. You put it on and every head in the hall turns to you.\n\nSomething goes into you and stands up straight. You know where each of your people is without looking, and what each of them is for. Then the skin on your shoulders is only a skin. What was in it is in you now.\n\nIt is Alpha, the lost hide, the one that leads. It chose you. It expects to be followed."
 spn_hide.0010.a.tt:0 "You become its [spn_champion|E]. Its spirit is in you now: when you take the bear's shape, the bear is this hide's. You speak every tongue it took from the champions before you."
 spn_hide.0011.desc_silverback:0 "You wear the grey hide for days and nothing happens. It is only a skin, and it smells of someone else's fire.\n\nYou dream of a bear standing between a child and the dark. It looks at you a long time, and then it looks away."
 spn_hide.0011.desc_timber:0 "You wear the brown hide for days and nothing happens. It is stiff and smells of pine pitch, and that is all it is.\n\nYou dream of a bear on a ridge, watching your fire. It never comes closer."
 spn_hide.0011.desc_tundra:0 "You wear the white hide for days and nothing happens. It stays cold on your shoulders, colder each morning.\n\nYou dream of a white bear in the snow. It walks away before morning."
 spn_hide.0011.desc_graybeard:0 "You wear the grey hide for days and nothing happens. The old cuts in it never close, and it hangs off your back like a dead thing.\n\nYou dream of a grey bear that will not look at you."
 spn_hide.0011.desc_midnight:0 "You wear the black hide for days and nothing happens. It stays warm on your shoulders, and it waits, and nothing comes.\n\nYou dream of a black bear pacing past your fire. It does not come in."
 spn_hide.0011.desc_alpha:0 "You wear the red hide for days and nothing happens. Nobody looks at you any differently. The dogs do not even lift their heads.\n\nYou dream of a red bear on a hill. It does not call you."
 spn_hide.0011.why_none:0 " It found none of that in you, and the bear in you does not yet run deep enough to make up for it."
 spn_hide.0011.why_leader:0 " And it takes only a leader: the alpha of a lodge, or a duke or higher."
 spn_hide.0011.why_leader_nopacks:0 " And it takes only a leader: a duke or higher, a True Werebear, or a bear whose ursanthropy is full."
 spn_hide.0012.t:0 "Two Bears"
 spn_hide.0012.desc:0 "There are two of them in you now, and they will not share.\n\n[spn_kept_hide.GetName] has been yours for years. It knows your hands and your temper, and it is angry. [spn_offered_hide.GetName] is new, and it is already pulling at you, sure of itself, asking to be let in.\n\nOne body. One bear. You have to choose, and the one you put aside will not ask again for a long time."
 spn_hide.0014.desc_tundra:0 "You put the hide away. It lasts a week.\n\nYour hands are cold all the time now. On the seventh morning there is frost on the inside of the window, in the shape of a bear lying down.\n\nTundra can wait longer than you can. It is letting you know."
 spn_hide.0101.desc_alpha:0 "Alpha shows you a death. A grey bear at the head of a great lodge, old and slow, turning to face the young one who would replace it. It did not run. When it was over, the lodge followed the young one home."
 spn_hide.0102.desc_silverback:0 "Silverback wants something of you. There are people in your care who cannot keep themselves safe, and it wants you to stand over them. It does not care whether they are kin or strangers, only that they are yours.\n\nIt shows you how. A bear at the door. Nothing gets past."
 spn_hide.0102.desc_midnight:0 "Midnight wants something of you. In a battle you hold the bear back, and it hates you for it. It wants, just once, to be let all the way out. It promises you will not remember much of it afterwards.\n\nIt shows you what that would look like."
 spn_hide.0102.desc_alpha:0 "Alpha wants something of you. There are other lodges out there, scattered and small. It wants them called together. A bear alone is hunted one at a time, and it remembers when bears were not alone.\n\nIt shows you how to call."
 spn_hide.0103.desc_timber:0 "Timber tells you, grudgingly, that there are others like it. Six hides. It does not care for any of them, and there are some it has not seen in a hundred years and would happily make it two.\n\nIt wants you to know where they are anyway. A loner keeps track of the lodge."
 spn_hide.0103.desc_alpha:0 "Alpha tells you there were six, and that it was first among them. The others were its lodge once. They scattered when it was lost, the way a lodge does when its leader falls, and none of them has led since.\n\nIt wants them gathered again."
 spn_hide.0104.desc_alpha:0 "On the longest night of the year the hide grows heavy, and you hear them - voices giving orders to lodges long scattered.\n\nEach of them wore Alpha to the end, and each left something of themselves in it. You have been leading with their words without knowing it.\n\nThere is room for one more. It has your tongue already. Leave your mark, and whoever wears it next starts with half the bond you built."
 spn_hide.0105.t:0 "One Bear"
 spn_hide.0105.desc_alpha:0 "One morning you walk into your hall and every living thing in it turns toward you, and you understand that it was always going to be this way. Bears you have never met will know your name before the year is out.\n\nAlpha is not in you. Alpha is you."
 spn_hide.0105.a:0 "One bear."
 spn_hide.0200.t:0 "The Bear and the War"
 spn_hide.0200.c.tt:0 "You will not be asked at the start of a war again. Let the Bear Run and Hold the Bear Back stay in your decisions."
 spn_hide.0202.t:0 "Two Bears on One Field"
 spn_hide.0300.desc:0 "Your huntsmen come back pale. There is a bear in your woods, white as bone and bigger than a pony, and it does not run from dogs. Two of the dogs did not come back.\n\nOne of the huntsmen swears it stopped on a ridge and looked straight at your hall. The others call him a fool, and none of them will go back in without you."
 spn_hide.0300.a.tt:0 "A legendary bear has been sighted. Hold a legendary hunt to chase it down."
 spn_hide.0302.desc:0 "The white bear got away again. Your huntsmen found its tracks going up into the hills, unhurried. Where it had stopped to look back, the grass was pressed flat in a ring, as if it had lain there a long time waiting for you.\n\nIt will be back. It came here for a reason."
 spn_hide.0303.desc:0 "A bear walked out of the trees today, white and enormous, and lay down in front of you as if it had come a very long way.\n\nWhen you reached for it there was no bear. There was only a hide on the ground, warm, and the feeling of being looked at. The horses will not come near it."
 spn_hide.0304.desc:0 "In the middle of the hunt, with the dogs baying ahead, you stop. There is something on the wind that is not deer and not boar. The dogs have gone quiet, and every one of them is looking the same way.\n\nIt smells like you do when you are in the bear's shape. Something old is out there, and it is lost."
 spn_hide.0305.t:0 "The Bear That Was More Than a Bear"
 spn_hide.0305.desc:0 "The white bear is dead. Your huntsmen cheer, and then they stop, because the body on the ground is changing.\n\nWhen it is done there is a carcass for your hall and something else beside it: a hide, folded, warm, older than any of you. It does not belong to the bear. The bear belonged to it.\n\nIt has already decided about you."
 spn_hide.0305.a.tt:0 "The hide is yours, and if you are a bear it takes you as its [spn_champion|E]."
 spn_hide.0320.a.tt:0 "A trophy no other hunter has. While you hold it, tracking bears is easier."
 spn_hide.0330.desc:0 "[spn_unbinder.GetShortUIName] puts both hands on your chest and pulls, and something tears loose that was never meant to.\n\nYou are on the floor. The hide lies beside you, an old skin again. The bear in you is still there - it was always yours - but it is smaller now, and alone."
 spn_long_count.0001.desc_wolf:0 "You worked it out on a road you have walked a hundred times, over something that was not important.\n\nA century of moons. The child who held your horse the week it happened has been dead sixty years, and so has the child who held his. You have buried people who were born long after you stopped being able to die of anything ordinary.\n\nThe bear does not count. You did not either, until now."
 spn_order.0829.t:0 "The Bears Have Teeth"
 spn_order.0829.desc:0 "A bear killed one of the five who carried a ritual of your temple. The [spn_order_transference|E] is undone."
 spn_order.0829.desc_member:0 "A bear killed one of your temple. The [spn_order|E] and the lodges have been at war before."
 spn_pack.0010.t:0 "You Lead a Lodge"
 spn_pack.0010.desc:0 "You have a lodge now. It is small, and it is yours.\n\nWolves who run with you will be stronger for it, and they will look to you when something goes wrong. The one who stands highest after you is your Second, and the first to try your strength.\n\nKeep them fed and keep them hidden, and they will keep you."
 spn_pack.0011.desc:0 "The one who made you has a lodge, and [spn_inv_alpha.GetShortUIName] leads it. A message comes, plain and short: there is a place for you. The first years are the hardest, it says, and most who spend them alone do not see many more.\n\nYou are new to this. You do not have to be new to it alone."
 spn_pack.0011.desc_recruit:0 "[spn_inv_alpha.GetShortUIName] leads a lodge, and knows what you are. A message comes, plain and short: there is a place for you, if you want it. No one watches the back of a bear who runs alone, it says, and the years are long.\n\nYou have managed alone so far. You do not have to keep doing it."
 spn_pack.0012.desc:0 "[spn_rem_who.GetShortUIName] has left the lodge. No fight, no word. Just gone. [spn_rem_who.GetHerHis|U] scent is already going stale on the trails you used to run together.\n\nThe others noticed. They are watching to see what you do about it."
 spn_pack.0015.t:0 "You Wake Among Bears"
 spn_pack.0015.desc:0 "When the fever breaks, the first thing you smell is wet fur and woodsmoke. They are all around you, the bears from the Gathering, and by the look of them they have been there for days. Someone has kept the fire going. Someone has been bringing water.\n\nYou are one of them now."
 spn_pack.0013.desc:0 "The lodge has a new alpha: [spn_sa_new.GetShortUIName]. Every bear in it felt the change the moment it happened, like a shift in the wind.\n\nSome of them are glad. Some of them are already counting the days until they can try [spn_sa_new.GetHerHim]."
 spn_pack.0013.desc_me:0 "The lodge is yours now. Every bear in it felt the change the moment it happened, and every one of them is looking at you.\n\nSome of them are glad. Some of them are already wondering how long you will last."
 spn_pack.0013.desc_joined:0 "Your lodge and [spn_sa_new.GetShortUIName]'s are one lodge now, joined at a Gathering by the old rite."
 spn_pack.0020.desc_won:0 "You called [spn_ch_b.GetShortUIName] out and it was quick - teeth and weight and no swords. [spn_ch_b.GetSheHe|U] is on the ground. You are not.\n\nThe others saw it. By morning every bear for miles will know, and some of them will look at you differently."
 spn_pack.0020.desc_lost:0 "You called [spn_ch_b.GetShortUIName] out and it was quick - teeth and weight and no swords. You are on the ground. [spn_ch_b.GetSheHe|U] is not.\n\nThe others saw it. By morning every bear for miles will know, and some of them will look at you differently."
 spn_pack.0021.desc_won:0 "[spn_ch_a.GetShortUIName] called you out. It was quick - teeth and weight and no swords. [spn_ch_a.GetSheHe|U] is on the ground. You are not.\n\nThe others saw it. By morning every bear for miles will know, and some of them will look at you differently."
 spn_pack.0021.desc_lost:0 "[spn_ch_a.GetShortUIName] called you out. It was quick - teeth and weight and no swords. You are on the ground. [spn_ch_a.GetSheHe|U] is not.\n\nThe others saw it. By morning every bear for miles will know, and some of them will look at you differently."
 spn_pack.0100.t:0 "Another Lodge's Scent"
 spn_pack.0100.desc:0 "Your bears come back from the edge of your country uneasy. Another lodge has been running there - [spn_mo_other.GetShortUIName]'s.\n\nThey did not cross anything. They did not need to. They left their scent where you would find it. Your youngest bears want to go and answer it tonight."
 spn_pack.0101.t:0 "A Bear Asks to Run With You"
 spn_pack.0101.desc:0 "[spn_mo_asker.GetShortUIName] runs with [spn_mo_other.GetShortUIName]'s lodge. Tonight [spn_mo_asker.GetSheHe] came to yours instead and asked to stay. [spn_mo_asker.GetSheHe|U] says [spn_mo_other.GetShortUIName] runs that lodge hard and gives little back. That may even be true.\n\nIf you say yes, [spn_mo_other.GetShortUIName] will not thank you."
 spn_pack.0101.a.tt:0 "[spn_mo_asker.GetShortUIName] joins your lodge. [spn_mo_other.GetShortUIName] takes it badly."
 spn_pack.0102.t:0 "Young Bears Fight"
 spn_pack.0102.desc_won:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young bears at the edge of the woods, and they fought the way young bears do. Yours came home first, bloody and limping a little and very pleased with [spn_mo_ours.GetHerHim]self."
 spn_pack.0102.desc_lost:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young bears at the edge of the woods, and they fought the way young bears do. Yours came home limping. The other one will be telling the story all over [spn_mo_other.GetShortUIName]'s lodge by now."
 spn_pack.0102.desc_friends:0 "[spn_mo_ours.GetShortUIName] met one of [spn_mo_other.GetShortUIName]'s young bears at the edge of the woods, and they fought the way young bears do. Then they sat down together and licked their wounds, and now they are friends."
 spn_pack.0102.a:0 "Young bears."
 spn_pack.0103.desc_friends:0 "You and [spn_kin_other.GetShortUIName] run with different lodges. It does not seem to matter. You found each other in the woods and something in you both said: this one. Neither of your lodges knows what to make of it."
 spn_pack.0103.desc_lovers:0 "You and [spn_kin_other.GetShortUIName] run with different lodges. It did not matter. You found each other in the woods one night, and in the morning neither of you wanted to go home. Both lodges know by now, and neither is pleased."
 spn_pack.0104.desc:0 "One of your bears came back from a long run with news. It came from a traveller, a drunk, and an old woman who would not give her name, and all three told it the same way."
 spn_pack.0104.true_alpha:0 "\n\nThere is a bear with red eyes, [spn_waf_ta.GetShortUIName], who became an alpha without killing anyone for it. The old ones say that has not happened in a hundred years."
 spn_pack.0200.desc:0 "A hide has passed between your lodge and [spn_feud_other.GetShortUIName]'s, and it did not pass kindly. Whoever had it wants it back, and whoever has it now will not give it up.\n\nNobody has said the word feud yet. Everybody is thinking it. Nobody runs the border alone any more."
 spn_pack.0300.desc:0 "Nobody fought you for it. Nobody died. You woke this morning and the lodge was already looking at you, and your eyes in the water were red.\n\nIt happens without a killing, the old ones say, to a bear who has earned it by what it is. It has not happened in a hundred years.\n\n[spn_ta_old_alpha.GetShortUIName] leads this lodge. Does [spn_ta_old_alpha.GetSheHe], still?"
 spn_pack.0300.a:0 "I will lead this lodge."
 spn_pack.0300.a.tt:0 "You become this lodge's alpha. [spn_ta_old_alpha.GetShortUIName] keeps [spn_ta_old_alpha.GetHerHis] standing and bears you no grudge."
 spn_pack.0300.b.tt:0 "You leave and found a lodge of your own. Some of this one may follow you."
 spn_pack.0301.t:0 "A Bear with Red Eyes"
 spn_pack.0301.desc:0 "Every bear for a hundred miles felt it last night. Somewhere out there an alpha rose without a fight, and [spn_ta.GetHerHis] eyes are red.\n\n[spn_ta.GetHerHis|U] name is [spn_ta.GetShortUIName]. You will hear it again. The old bears you know have gone quiet about it, and that is how you know they are worried."
 game_concept_spn_menace_desc:0 "A county remembers what a creature did to it. Every kill by a vampire or a werebear leaves a mark, and so does a feed somebody talks about: the county's [county_control|E] falls (a werebear's kill also costs [development|E]), the modifier #high Something Stalks Here#! stands for five years, and on the third incident the county's lord is told. A [spn_hunter|E] can hold a [supernatural_hunt|E] wherever a trail is warm, and a slain creature gives back part of what it took."
 spn_hunt_prep_stakes_desc:0 "Ash, sharpened. And a sprig of something the old women swear by.\n\n#positive_value +15 Confrontation#! against a vampire, and it cannot look you in the eye.\n#negative_value −10 Confrontation#! against a bear.\nEither way against a hybrid."
 spn_hunt_prep_silver_desc:0 "Blades and arrowheads that cost more than they should. You have heard why.\n\n#positive_value +15 Confrontation#! against a werebear.\n#negative_value −10 Confrontation#! against a vampire, and one that finds you carrying the wrong kit may look you in the eye.\nEither way against a hybrid."
 spn_hunt.0001.desc_werewolf:0 "The priest of [spn_menace_county.GetName] will not say what is killing people. You do not need him to. Three bodies, torn the way no bear tears, and herds missing from the pastures the way no bear takes them. You have hunted this before. The county has started locking its doors at dusk, and it is right to."
 spn_hunt.0100.desc_werewolf:0 "[spn_hunt_county.GetName] has been burying people, and the people know it. The gravedigger does not need to describe the bodies for you to know what did this: torn the way no bear tears, and the herds thinned the way no bear thins them. A werebear. You brought what you brought.\n\nThree weeks to find out who."
 spn_hunt.0102.desc_werewolf:0 "The gravedigger lets you look. You have seen it before: the wounds no bear leaves, the strength it took to make them. A werebear, and one that does not fear being found."
 spn_hunt.0110.b.tt:0 "#positive_value +15 Confrontation#! if the creature is a vampire.\nNothing if it is a bear.\nThe creature answers."
 spn_trailsman_court_position_desc:0 "The $spn_trailsman_court_position$ walks your counties and reads what has been left in them. Bodies found at the edge of a village, herds taken in a way no bear takes them, a road nobody will use after dark - he goes and looks, and he comes back and tells you where. A good one comes back with a name."
 spn_hunt.0400.desc_werewolf:0 "[spn_trailsman.GetTitledFirstName] has been gone eleven days and comes back muddy to the knee. He does not sit down. \"[spn_menace_county.GetName],\" he says. \"Sheep gone out of a closed fold. A man torn open in the road and not eaten.\" He calls it a bad winter for bears. You have seen what a bear does to a fold, and it does not look like that."
 spn_vade.0110.desc_graybeard:0 "A page of the [spn_vade_maecum|E] has come into your hands. Graybeard wants you to stand over it like a bear over a kill, and dare anyone to come for it."
 spn_vade.0110.desc_alpha:0 "A page of the [spn_vade_maecum|E] has come into your hands. Alpha wants the lodge to guard it, all of them, until it is safe."
 spn_vade.0400.desc:0 "You put the [spn_vade_maecum|E] on the table and take out a knife. It took four pages to make this book. It will take four to unmake it.\n\nOne page could go to a bear who will guard it. The rest will scatter."
 werewolf_gathering:0 "Werebear Gathering"
 werewolf_gathering_desc:0 "Call the bears you know to run together, and to sit in council around a fire."
 werewolf_gathering_host_desc:0 "$BULLET_WITH_TAB$Bears gain [spn_pack_standing|E] and ursanthropy\n$BULLET_WITH_TAB$A hide brought to the circle may choose one of you\n$BULLET_WITH_TAB$News of the hides travels around the fire\n"
 werewolf_gathering_guest_desc:0 "$BULLET_WITH_TAB$Bears gain [spn_pack_standing|E] and ursanthropy\n$BULLET_WITH_TAB$A hide brought to the circle may choose one of you\n$BULLET_WITH_TAB$News of the hides travels around the fire\n"
 werewolf_gathering_selection_tooltip:0 "Run with the bears you know, and sit with them in council."
 werewolf_gathering_predicted_cost:0 "Feeding a lodge for a month is not cheap."
 werewolf_gathering_guest_help_text:0 "Bears who come earn their place in the lodge."
 werewolf_gathering_host_an_a:0 "a Werebear"
 spn_gathering_calling_phase_desc:0 "The bears arrive and take each other's measure."
 spn_gathering_run_phase_desc:0 "The lodge runs together. The county will notice."
 spn_lead_the_pack_intent:0 "Lead the Lodge"
 spn_lead_the_pack_intent_desc:0 "Run at the head of the lodge and remind every bear who leads it."
 spn_run_a_rivals_land_intent_desc:0 "Hold the Gathering in someone else's realm and let your lodge run there. Pays only abroad: in your own realm it earns nothing more."
 spn_seek_the_old_ways_intent_desc:0 "Sit with the oldest bears and listen. They may tell you of a lost hide that would take you, or where the hide that suits you best is kept."
 spn_hold_the_unification_intent_desc:0 "Bring your spouse's lodge into yours in the old rite, if there are no secrets between you."
 spn_challenge_the_alpha_intent_desc:0 "Come to test the one who leads. Only for a bear of the host's own [spn_pack|E] who is its [spn_second|E], or any of them once the Second has lost to the alpha."
 spn_seek_another_pack_intent:0 "Seek Another Lodge"
 spn_seek_another_pack_intent_desc:0 "Look for a lodge that will take you, and ask to run with the host's."
 spn_hold_the_unification_spouse_tt:0 "Your spouse leads another lodge"
 activity_invite_rule_werewolves:0 "Werebears"
 activity_invite_rule_werewolves_desc:0 "Werebears you could plausibly know for what they are: those who carry it openly, those whose secret you keep, your family, and those you clawed or who clawed you."
 activity_invite_rule_pack:0 "The Lodge"
 activity_invite_rule_pack_desc:0 "The bears of your own lodge, and the alphas of lodges near you that you know of."
 activity_invite_rule_fevered_desc:0 "People still in the wound's fever whom you know: those you or your lodge gave it to, your close family and your court."
 spn_gathering.0001.desc:0 "You have called the bears to run together. Some will come because they know you. Some will come because they are curious. A few will come because they mean to test you. Every bear who comes could be yours, if the week goes well.\n\nThe woods will be loud for a while."
 spn_gathering.0110.t:0 "The Lodge Bows"
 spn_gathering.0110.desc:0 "[spn_bow_champ.GetShortUIName] walks into the clearing and every bear there goes still. Nobody told them what [spn_bow_champ.GetSheHe] wears. Nobody needed to.\n\nOne by one, without being asked, they lower their heads. Even the old ones, who have not bowed to anyone in years."
 spn_gathering.0200.desc:0 "Tonight you run with all of them at once - through the trees, over the river, up the long hill and down. For a few hours there is nothing to decide and nothing to hide. The lodge moves like one animal, and you are part of it.\n\nIt is the best you have felt in years."
 spn_gathering.0201.desc:0 "The lodge comes out of the trees above a farm with its sheep penned for the night. The farmer is asleep. The dogs are not, and they are terrified. It would be easy. It would also be talked about for a year.\n\nEvery bear is looking at you."
 spn_gathering.0202.desc:0 "A hound has followed the lodge for two nights, keeping its distance, baying. Somewhere behind it there will be a man with a crossbow.\n\nKill the dog and he will know something killed it. Let it go and it may lead him straight to you."
 spn_gathering.0203.t:0 "A Young Bear Who Will Not Stop"
 spn_gathering.0203.desc:0 "[spn_young_wolf.GetShortUIName] is young and has never run with this many bears before. [spn_young_wolf.GetSheHe|U] will not stop - snapping at the old ones, racing ahead, roaring at nothing.\n\nThe others are waiting to see if you will put [spn_young_wolf.GetHerHim] in [spn_young_wolf.GetHerHis] place."
 spn_gathering.0204.desc:0 "The lodge has found a man alone on the road at night. Nobody will miss him for a day or two. He has a bundle on his back and a lantern he has not lit, and he has not seen you yet.\n\nThe bears wait for you."
 spn_gathering.0205.desc:0 "You stop at a lake to drink and the whole lodge stops with you. The moon is on the water, and for a while nobody moves. Even the young ones are still. Somewhere across the water another bear roars, and none of yours answer.\n\nIt is very old, this. Older than any of you."
 spn_gathering.0206.desc:0 "Below the ridge there is a camp: three tents, a fire burned down to embers, dogs asleep in a heap. Crossbows stacked against a cart. Somebody in this county is paying men to look for bears.\n\nThe lodge is already spreading out along the ridge, waiting for you."
 spn_gathering.0207.t:0 "The Old Bear"
 spn_gathering.0207.desc:0 "Halfway up the long hill the oldest bear in the lodge slows, then stops. The others look back at it, and then at you.\n\nIt was running with lodges before your grandfather was born. It will not make the top of the hill tonight."
 spn_gathering.0207.b:0 "The lodge does not wait."
 spn_gathering.0208.t:0 "Another Lodge's Ground"
 spn_gathering.0208.desc:0 "At the river the scent changes. Another lodge runs on this side of the water: old marks on the trees, fresh ones on the stones.\n\nThey are not here tonight. They will know you were."
 spn_gathering.0209.desc:0 "A shepherd's girl is sitting on the wall of her father's fold, wide awake, watching the whole lodge go by in the moonlight. She does not scream. She does not run.\n\nIn the morning she will tell someone what she saw."
 spn_gathering.0210.t:0 "Only Bears"
 spn_gathering.0210.desc:0 "A lodge of ordinary bears comes out of the dark and runs alongside you for a while, grey shapes keeping pace at the edge of the trees. They do not come close. They do not leave either.\n\nThey know what you are. They seem to think it an honour."
 spn_gathering.0211.desc:0 "There is no moon tonight. Without it the lodge is restless, snapping at each other and starting at every sound. Two of the young ones are already at each other's throats.\n\nThey are waiting to see whether you can hold them together in the dark."
 spn_gathering.0212.desc:0 "Deep in the woods the lodge comes on a ring of standing stones, half sunk in moss. Every bear stops at the edge of it. Bears met here once, a long time ago. You can smell it in the stones.\n\nNobody wants to go in first."
 spn_gathering.0213.desc:0 "Two bears have brought down the same deer, and neither will give it up. They are circling the carcass with their hackles up, and the rest of the lodge has drawn back to watch.\n\nIt is your kill to give."
 spn_gathering.0301.true_alpha:0 "\n\nThere is a bear with red eyes, [spn_waf_ta.GetShortUIName], who became an alpha without killing anyone for it. The old ones say that has not happened in a hundred years."
 spn_gathering.0302.t:0 "Two Lodges, One Fire"
 spn_gathering.0302.desc:0 "[spn_tp_other.GetShortUIName] brought a lodge to your fire, and the two lodges have spent the week circling each other. There have been two fights already, both broken up before anyone was badly hurt.\n\nTonight [spn_tp_other.GetShortUIName] sits down across the flames from you. Everybody else goes quiet."
 spn_gathering.0303.desc_silverback:0 "The oldest bear at the fire tells a story nobody else remembers - about Silverback, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.desc_timber:0 "The oldest bear at the fire tells a story nobody else remembers - about Timber, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.desc_tundra:0 "The oldest bear at the fire tells a story nobody else remembers - about Tundra, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.desc_graybeard:0 "The oldest bear at the fire tells a story nobody else remembers - about Graybeard, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.desc_midnight:0 "The oldest bear at the fire tells a story nobody else remembers - about Midnight, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.desc_alpha:0 "The oldest bear at the fire tells a story nobody else remembers - about Alpha, and where it went, and what it is waiting for. Half the bears here have heard a piece of it before. Nobody has heard all of it.\n\nWhen the story is done the old bear looks straight at you."
 spn_gathering.0303.t:0 "The Old Bear's Tale"
 spn_gathering.0308.desc:0 "[spn_gc_challenger.GetShortUIName|U] stands up in the firelight and says your name, loud enough for every bear in the circle to hear. It is a challenge, the old way: no swords. "
 spn_gathering.0308.desc_cruel:0 "'This lodge deserves a better alpha than you,' [spn_gc_challenger.GetSheHe] says."
 spn_gathering.0308.desc_end:0 "\n\nEvery bear at the fire is watching to see what you do."
 spn_gathering.0309.t:0 "A Bear at Your Fire"
 spn_gathering.0309.desc_lone:0 "[spn_seek_ask.GetShortUIName|U] has come to your fire alone. Before the night is out [spn_seek_ask.GetSheHe] comes to you and asks to run with your lodge."
 spn_gathering.0309.desc_pack:0 "[spn_seek_ask.GetShortUIName|U] runs with another lodge, but before the night is out [spn_seek_ask.GetSheHe] comes to you at the fire and asks to run with yours instead."
 spn_gathering.0401.desc:0 "You came to the Gathering sick with the wound, and the bears knew it the moment you walked in. They let you run as far as you could. When you could not, they stayed with you.\n\nThe fever is not finished with you. When it comes to its end, they mean to be there."
 spn_gathering.0401.a.tt:0 "When the fever comes to its end you can let the lodge carry you through it: you are likelier to come out a bear and less likely to die. If you turn and [spn_gc_host.GetShortUIName] runs with a [spn_pack|E] that has room, you wake in it."
 spn_gathering.0307.desc:0 "Late, when the fire is low, the oldest bear at the circle sits down beside you. He has been watching you all night.\n\nHe tells you that [spn_tale_shrine_hide.GetName] is in [spn_tale_shrine_county.GetName]. The people there keep it as a holy thing and have no idea what it is."
 spn_gathering.0305.desc:0 "[spn_un_elder.GetShortUIName] binds your hand to [spn_un_spouse.GetShortUIName]'s with a strip of hide and speaks the old words over you both.\n\nTwo alphas. Two lodges. If there are no secrets between you, they will be one, and every bear in them will be more than it was."
 spn_gathering.0305.a:0 "We are one lodge."
 spn_gathering.0305.a.tt:0 "[spn_un_spouse.GetShortUIName]'s lodge joins yours and [spn_un_spouse.GetSheHe] leads it beside you. Every bear in it is [spn_evolved|E]."
 spn_gathering.0400.desc:0 "The bears go home in twos and threes, tired and quieter than they came. Some leave with new friends, and a few with new grudges. For a day or two after, the dogs in the villages will not stop barking."
 werewolf_lifestyle_name:0 "Werebear"
 werewolf_lifestyle_desc:0 "A cursed human forced to turn into a bear upon the full moon. The heart of the beast lies within."
