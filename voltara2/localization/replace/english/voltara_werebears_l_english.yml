 trait_spn_champion_alpha_desc:0 "Chosen by Alpha, one of the six hides. Its spirit lives in this character, and when they take the bear's shape, the bear is Alpha's - red-brown and huge.\n\nThe leader's hide, lost for decades. It takes only a leader, and the leader's lodge grows faster for it."
