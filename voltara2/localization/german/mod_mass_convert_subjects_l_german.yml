 mdc_chance_filter_80:0 "≥ 80 %"
 mdc_chance_filter_100:0 "100 %"
 mdc_chance_filter_scope_note:0 "Gilt nur für direkte/indirekte Vasallen und Tributpflichtige. Höflinge und Hausmitglieder bleiben unverändert."
 mdc_chance_filter_tooltip:0 "$mdc_chance_filter_scope_note$\n\nFiltert die berechnete unmittelbare Annahmechance. Spätere Verhandlungen und abgeschlossene Konvertierungen werden nicht berücksichtigt. 100 % verspricht keine abgeschlossene Konvertierung. Die Zahlen zählen geeignete Anfragen; Ziele werden vor dem Versand erneut geprüft."
