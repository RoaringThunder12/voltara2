 mdc_convert_tributaries_100_loc:0 "Данники ([SCOPE.ScriptValue('mdc_convert_tributaries_100_number')])"
 mdc_convert_tributaries_100_tooltip:0 "$mod_convert_tributaries_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"

