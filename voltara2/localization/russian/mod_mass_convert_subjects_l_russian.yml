 # Immediate acceptance filter; no persistent player preference.
 mdc_chance_filter_heading:0 "Согласие:"
 mdc_chance_filter_none:0 "Без фильтра"
 mdc_chance_filter_80:0 "≥ 80 %"
 mdc_chance_filter_100:0 "100 %"
 mdc_chance_filter_scope_note:0 "Только для прямых/косвенных вассалов и данников. Придворные и члены дома остаются без изменений."
 mdc_chance_filter_tooltip:0 "$mdc_chance_filter_scope_note$\n\nФильтр рассчитанной вероятности немедленного согласия. Последующие переговоры и завершённые обращения не учитываются. 100 % не гарантирует завершённого обращения. Числа означают подходящие запросы; перед отправкой цели проверяются повторно."
