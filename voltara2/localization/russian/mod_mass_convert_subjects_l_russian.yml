 mdc_convert_indirect_vassals_80_loc:0 "Косвенные вассалы ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_80_number')])"
 mdc_convert_indirect_vassals_80_tooltip:0 "$mod_convert_indirect_vassals_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_indirect_vassals_100_loc:0 "Косвенные вассалы ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_100_number')])"
