l_russian:
great_empire_victory_desc:0 "All [vassals|e] of both realms will be called to arms to preserve their [empire|E].  This is a total war and cannot end in a white peace.\n\n[defender.GetPrimaryTitle.GetName|U] is completely shattered, every title in the realm is destroyed, and the devastated regions of its former empire transition to a period of anarchy."
great_empire_victory_desc_attacker:0 "All [vassals|e] of both realms will be called to arms to preserve their [empire|E].  This is a total war and cannot end in a white peace.\n\n[defender.GetPrimaryTitle.GetName|U] is completely shattered, every title in the realm is destroyed, and the devastated regions of its former empire transition to a period of anarchy."
