rule_improved_civil_wars_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Civil Wars"
setting_improved_civil_wars_enabled:0 "Enabled"
setting_improved_civil_wars_enabled_desc:0 "At the start of a [civil_war|E], all [vassals|E] will choose to side with the loyalists and defend their [liege|e], join the rebels and their [faction|e], or remain neutral based on their #E Loyalty#!."
setting_improved_civil_wars_disabled:0 "Disabled"
setting_improved_civil_wars_disabled_desc:0 ""
rule_miv_debug_mode_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Debug Mode"
setting_miv_debug_mode_disabled:0 "Disabled"
setting_miv_debug_mode_disabled_desc:0 ""
setting_miv_debug_mode_enabled:0 "Enabled"
setting_miv_debug_mode_enabled_desc:0 "#E Debug Mode#! is enabled for all #E Players#!, allowing the use of #E Console Commands#! and #E Debug Character Interactions#! while this game rule is enabled."
rule_civil_war_distance_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Civil Wars Distance"
setting_civil_war_distance_disabled:0 "Disabled"
setting_civil_war_distance_disabled_desc:0 ""
setting_civil_war_distance_entire_realm:0 "Entire Realm"
setting_civil_war_distance_entire_realm_desc:0 "Every eligible [vassal|E] can pick a side in a [civil_war|E], regardless of their distance from the [faction|E] #E Leader#!."
setting_civil_war_distance_massive:0 "2 Holy Roman Empires"
setting_civil_war_distance_massive_desc:0 "Only [vassals|e] within 2 #E Holy Roman Empires#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_almost_massive:0 "1.5 Holy Roman Empires"
setting_civil_war_distance_almost_massive_desc:0 "Only [vassals|e] within 1.5 #E Holy Roman Empires#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_huge:0 "Holy Roman Empire"
setting_civil_war_distance_huge_desc:0 "Only [vassals|e] within a #E Holy Roman Empire#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_large:0 "France"
setting_civil_war_distance_large_desc:0 "Only [vassals|e] within a #E France#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_major:0 "England"
setting_civil_war_distance_major_desc:0 "Only [vassals|e] within an #E England#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_medium:0 "Ireland"
setting_civil_war_distance_medium_desc:0 "Only [vassals|e] within an #E Ireland#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_small:0 "Wales"
setting_civil_war_distance_small_desc:0 "Only [vassals|e] within a #E Wales#! distance to the [faction|E] #E Leader#! can pick a side in a [civil_war|E]."
setting_civil_war_distance_land:0 "Bordering by Land"
setting_civil_war_distance_land_desc:0 "Only [vassals|E] that border the [faction|E] #E Leader#! by land can pick a side in a [civil_war|E]."
setting_civil_war_distance_land_or_sea:0 "Bordering by Land or Sea"
setting_civil_war_distance_land_or_sea_desc:0 "Only [vassals|E] that border the [faction|E] #E Leader#! by land or sea can pick a side in a [civil_war|E]."
rule_call_allied_vassals_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Vassal Alliances"
setting_call_allied_vassals_enabled:0 "Enabled"
setting_call_allied_vassals_enabled_desc:0 "When a [liege|E] is allied with their [vassal|E], they can both call each other into their own internal and external [wars|e]."
setting_call_allied_vassals_disabled:0 "Disabled"
setting_call_allied_vassals_disabled_desc:0 ""
rule_miv_loyalist_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Loyalist Faction"
setting_miv_loyalist_enabled:0 "Enabled"
setting_miv_loyalist_enabled_desc:0 "[vassals|E] can form a #E Crown Loyalist#! [faction|E] to help stabilize the [realm|E] and protect their [liege|E] from internal threats."
setting_miv_loyalist_disabled:0 "Disabled"
setting_miv_loyalist_disabled_desc:0 ""
rule_miv_loyalist_frequency_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Loyalist Frequency"
setting_miv_loyalist_frequency_disabled:0 "Disabled"
setting_miv_loyalist_frequency_disabled_desc:0 ""
setting_miv_loyalist_frequency_rare:0 "Rare"
setting_miv_loyalist_frequency_rare_desc:0 "[vassals|E] are less likely to join the #E Crown Loyalist#! [faction|E]."
setting_miv_loyalist_frequency_normal:0 "Normal"
setting_miv_loyalist_frequency_normal_desc:0 "[vassals|E] join the #E Crown Loyalist#! [faction|E] based on their [personality|E], #E Loyalty#!, and [opinion|e] of their [liege|E]."
setting_miv_loyalist_frequency_common:0 "Common"
setting_miv_loyalist_frequency_common_desc:0 "[vassals|E] are more likely to join the #E Crown Loyalist#! [faction|E]."
setting_miv_loyalist_frequency_very_common:0 "Very Common"
setting_miv_loyalist_frequency_very_common_desc:0 "[vassals|E] are much more likely to join the #E Crown Loyalist#! [faction|E]."
rule_miv_realm_size_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Realm Size"
setting_miv_realm_size_disabled:0 "Disabled"
setting_miv_realm_size_disabled_desc:0 ""
setting_miv_realm_size_easy:0 "Easy"
setting_miv_realm_size_easy_desc:0 "[realm_size|E] penalties are softer, making large [realms|E] easier to maintain."
setting_miv_realm_size_normal:0 "Normal"
setting_miv_realm_size_normal_desc:0 "[realm_size|E] applies a scaling #E Loyalty Penalty#! to all [vassals|E], making large [realms|E] harder to maintain. This can be mitigated with high [vassal|E] [opinion|E] or an [alliance|e]."
setting_miv_realm_size_hard:0 "Hard"
setting_miv_realm_size_hard_desc:0 "[realm_size|E] penalties are harsher, making large [realms|E] even harder to maintain."
setting_miv_realm_size_very_hard:0 "Very Hard"
setting_miv_realm_size_very_hard_desc:0 "[realm_size|E] penalties are extremely harsh, making large [realms|E] significantly harder to maintain."
rule_vassals_join_claims_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Claimants"
setting_vassals_join_claims_enabled:0 "Enabled"
setting_vassals_join_claims_enabled_desc:0 "When a [liege|E] presses one of their [vassal|E]#E 's#! [claims|E] on a [title|E], they will be called to arms on the attacking side."
setting_vassals_join_claims_disabled:0 "Disabled"
setting_vassals_join_claims_disabled_desc:0 ""
rule_traitor_vassals_miv_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Treacherous Vassals" 
setting_traitor_vassals_miv_enabled:0 "Enabled"
setting_traitor_vassals_miv_enabled_desc:0 "When allied with the opposing side, [vassals|E] can be called to [war|E] against their [liege|E], but risk becoming #clickable [oathbreakers]#!."
setting_traitor_vassals_miv_disabled:0 "Disabled"
setting_traitor_vassals_miv_disabled_desc:0 ""
rule_challenging_ai_game_rules:0 "#clickable #Bold More Interactive Vassals#!#!: Challenging AI" 
setting_challenging_ai_enabled:0 "Enabled"
setting_challenging_ai_enabled_desc:0 "#E AI#! [rulers|E] will be more stable, receive reasonable buffs, and establish powerful [realms|E] across the map."
setting_challenging_ai_disabled:0 "Disabled"
setting_challenging_ai_disabled_desc:0 ""
