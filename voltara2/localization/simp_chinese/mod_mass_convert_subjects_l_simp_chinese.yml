 mdc_chance_filter_tooltip:0 "$mdc_chance_filter_scope_note$\n\n按计算出的立即接受概率筛选。不包括后续谈判和已完成的改信。100%不保证完成改信。数量表示符合条件的请求；发送前会再次检查目标。"
 mdc_convert_direct_vassals_80_loc:0 "$game_concept_direct_vassals$ ([SCOPE.ScriptValue('mdc_convert_direct_vassals_80_number')])"
 mdc_convert_direct_vassals_80_tooltip:0 "$mod_convert_direct_vassals_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_direct_vassals_100_loc:0 "$game_concept_direct_vassals$ ([SCOPE.ScriptValue('mdc_convert_direct_vassals_100_number')])"
 mdc_convert_direct_vassals_100_tooltip:0 "$mod_convert_direct_vassals_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"
 mdc_convert_indirect_vassals_80_loc:0 "非直属$game_concept_vassals$ ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_80_number')])"
 mdc_convert_indirect_vassals_80_tooltip:0 "$mod_convert_indirect_vassals_tooltip$\n$mdc_chance_filter_80$\n$mdc_chance_filter_tooltip$"
 mdc_convert_indirect_vassals_100_loc:0 "非直属$game_concept_vassals$ ([SCOPE.ScriptValue('mdc_convert_indirect_vassals_100_number')])"
 mdc_convert_indirect_vassals_100_tooltip:0 "$mod_convert_indirect_vassals_tooltip$\n$mdc_chance_filter_100$\n$mdc_chance_filter_tooltip$"
 mdc_convert_tributaries_80_loc:0 "朝贡国 ([SCOPE.ScriptValue('mdc_convert_tributaries_80_number')])"
