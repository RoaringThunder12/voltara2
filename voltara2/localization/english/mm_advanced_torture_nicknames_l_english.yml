l_english:
 advanced_torture.2001.t:0 "A New Name"
 advanced_torture.2001.desc:0 "Stories spread through corridors, courtyards, and halls. Those who speak of you no longer mention only your titles. Now they whisper another name with fear: the Torturer."
 advanced_torture.2001.a:0 "Let them whisper it in fear."

 advanced_torture.2002.t:0 "The Eye-Taker"
 advanced_torture.2002.desc:0 "They say your enemies avert their eyes before they even see you. The eyes lost by your command have become warning enough."
 advanced_torture.2002.a:0 "Looking upon me will be a privilege."

 advanced_torture.2003.t:0 "The Bone Breaker"
 advanced_torture.2003.desc:0 "Not all your prisoners die, but many are marked by pains that never fully fade. From those stories, a name has been born: the Bone Breaker."
 advanced_torture.2003.a:0 "Bones remember."

 advanced_torture.2004.t:0 "The Disfigurer"
 advanced_torture.2004.desc:0 "Faces ruined by your will speak even in silence. When those scars are seen, no one needs to ask where the order came from."
 advanced_torture.2004.a:0 "Beauty can be punished too."

 advanced_torture.2005.t:0 "The Maimer"
 advanced_torture.2005.desc:0 "Some punishments do not end when the cell door closes. Your victims carry your sentence in every movement, every fall, and every horrified look."
 advanced_torture.2005.a:0 "Mercy leaves too many bodies intact."

 advanced_torture.2006.t:0 "The Blinder"
 advanced_torture.2006.desc:0 "Those who speak of you remember the darkened eyes of your enemies. Some say you prefer to take sight rather than life, so fear may last longer."
 advanced_torture.2006.a:0 "They do not need to see in order to obey."

 advanced_torture.2007.t:0 "The Patient Tormentor"
 advanced_torture.2007.desc:0 "You do not always resort to the cruelest blow. Sometimes waiting, cold, discomfort, and the certainty that pain will come when you decide are enough."
 advanced_torture.2007.a:0 "Patience can cause pain too."

 advanced_torture.2008.t:0 "The Crimson Questioner"
 advanced_torture.2008.desc:0 "Secrets begin to surface under your shadow. Some fear what you do to the body; others fear what you can tear from the soul."
 advanced_torture.2008.a:0 "Every truth has a price."

 advanced_torture.2009.t:0 "The Red Hand"
 advanced_torture.2009.desc:0 "Your reputation is no longer an isolated rumor. Wherever your justice is discussed, someone remembers blood, iron, and a hand that never trembles."
 advanced_torture.2009.a:0 "Clean hands are not fit to rule."

 advanced_torture.2010.t:0 "The Truthbreaker"
 advanced_torture.2010.desc:0 "Secrets do not survive long in your dungeons. Under your gaze, lies crack and truth eventually crawls into the light."
 advanced_torture.2010.a:0 "Truth always finds a way out."

 advanced_torture.2011.t:0 "The Butcher of Cells"
 advanced_torture.2011.desc:0 "Dungeons have their own language: chains, damp stone, slow footsteps, and screams that take too long to fade. In that language, your name means butchery."
 advanced_torture.2011.a:0 "My cells teach obedience."

