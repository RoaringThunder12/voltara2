l_english:
 voltara_aeluinist:0 "Aeluinist"
 voltara_aeluinist_adj:0 "Aeluinist"
 voltara_aeluinist_adherent:0 "Aeluinist"
 voltara_aeluinist_adherent_plural:0 "Aeluinist adherents"
 voltara_aeluinist_desc:0 "The worship of Aeliun, goddess of Order. Her struggle with Khaos belongs to the creation of the universe; her mortal worshippers differ over whether order requires rejecting Chaos or acknowledging its place in creation."
 voltara_khaotism:0 "Khaotism"
 voltara_khaotism_adj:0 "Khaotism"
 voltara_khaotism_adherent:0 "Khaotism"
 voltara_khaotism_adherent_plural:0 "Khaotism adherents"
 voltara_khaotism_desc:0 "The worship of Khaos, male god of Chaos, whose struggle with Aeliun gives rise to the universe. His power stands at the heart of the later story of the Withering Hand."
 voltara_khaotism_rite:0 "Khaotism"
 voltara_khaotism_rite_adj:0 "Khaotism"
 voltara_khaotism_rite_adherent:0 "Khaotism"
 voltara_khaotism_rite_adherent_plural:0 "Khaotism adherents"
 voltara_khaotism_rite_desc:0 "The worship of Khaos, the god of Chaos, in a world shaped by his struggle with Aeliun."
