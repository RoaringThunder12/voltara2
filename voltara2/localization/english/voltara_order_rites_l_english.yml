 voltara_khaos_religion_desc:0 "The worship of Khaos."
 voltara_order_rite_22:0 "Ordered Traditionalism"
 voltara_order_rite_22_adj:0 "Ordered Traditionalism"
 voltara_order_rite_22_adherent:0 "Ordered Traditionalism"
 voltara_order_rite_22_adherent_plural:0 "Ordered Traditionalism adherents"
 voltara_order_rite_22_desc:0 "Ordered Traditionalism preserves the names of both Aeliun and Khaos in its divine tradition, remembering the two powers bound to the beginning of creation."
 voltara_order_rite_23:0 "Ordered Absolutism"
 voltara_order_rite_23_adj:0 "Ordered Absolutism"
 voltara_order_rite_23_adherent:0 "Ordered Absolutism"
 voltara_order_rite_23_adherent_plural:0 "Ordered Absolutism adherents"
 voltara_order_rite_23_desc:0 "Ordered Absolutism exalts Aeliun, goddess of Order, and shuns Khaos. Its certainty gives rulers a language of authority, while leaving the meaning of just rule a question for mortals."
