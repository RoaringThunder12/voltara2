l_english:
 trait_voltara_lifespan_1:0 "Weave Longevity 1"
 trait_voltara_lifespan_1_desc:0 "An inherited lifespan sustained by the Weave. This bloodline grants 60 additional years of natural life expectancy, with slower fertility and experience gain. Descendants inherit longevity from their biological parents. This longevity protects against age-related infirmity, clouded eyes, a faltering heart, a withering mind and fragile bones."
