 advanced_torture.cultural.drakkar_stocks: "Drakkar Stocks"
 advanced_torture.scene.cultural.drakkar_stocks.t: "Drakkar Stocks"
 advanced_torture.scene.cultural.drakkar_stocks.desc: "They prepare Drakkar Stocks for [advanced_torture_prisoner.GetTitledFirstName]. It is not an execution, but a culturally marked torture: each implement is arranged with deliberate care, turning pressure, pain, and public humiliation into a punishment that everyone present recognizes as belonging to a particular tradition."
 advanced_torture_result_cultural_drakkar_stocks_01_desc: "Drakkar Stocks leaves [advanced_torture_prisoner.GetTitledFirstName] shaking, dignity broken by a method those present recognize as belonging to its people."
 advanced_torture_result_cultural_drakkar_stocks_02_desc: "When Drakkar Stocks ends, the silence in the chamber weighs as much as the wounds. [advanced_torture_prisoner.GetTitledFirstName] has learned that pain can speak in the language of a culture."
 advanced_torture_result_cultural_drakkar_stocks_03_desc: "The implements of Drakkar Stocks are removed with deliberate calm. Marks remain, breath falters, and the humiliation has been carefully ritualized."
