l_english:
 voltara_slavery_laws:0 "Slavery"
 voltara_slavery_banned:0 "Slavery Forbidden"
 voltara_slavery_legal:0 "Slavery Permitted"
 voltara_slavery_banned_effects:0 "Enslavement and slave sales are forbidden throughout the realm. Enacting this law frees all enslaved courtiers in the realm."
 voltara_slavery_legal_effects:0 "The top liege’s law determines legality throughout the realm. Permitting slavery against that law is a crime and gives the liege an imprisonment reason."
 voltara_illegal_slavery_opinion:0 "Defied the Realm’s Slavery Ban"
 trait_voltara_slave:0 "Slave"
 trait_voltara_slave_desc:0 "Bound to a court and denied freedom. Enslavement damages health, prevents new marriages and bars inheritance."
 trait_voltara_former_slave:0 "Former Slave"
 trait_voltara_former_slave_desc:0 "Once enslaved, this person is now free to leave, marry and inherit."
 trait_voltara_slaver:0 "Slaver"
 trait_voltara_slaver_desc:0 "This character has enslaved people or traded in their captivity. First-time enslavements grant 10 experience; tiers at 25, 50 and 100 grant increasing stewardship, dread gain and domain-tax benefits."
 trait_voltara_liberator:0 "Liberator"
 trait_voltara_liberator_desc:0 "Earns experience by freeing enslaved people and killing slavers. Each newly liberated person grants 5 experience; killing a slaver grants 10. Freeing someone you enslaved grants no experience."
 trait_track_voltara_liberator:0 "Liberation"
 trait_track_voltara_liberator_desc:0 "Free enslaved people and defeat slavers to build a reputation as a liberator."
 voltara_enslave_prisoner_interaction:0 "Enslave Prisoner"
 voltara_enslave_prisoner_interaction_desc:0 "Recruit this unlanded prisoner into your court as a slave. You gain the Slaver trait."
 voltara_free_slave_interaction:0 "Free Slave"
 voltara_free_slave_interaction_desc:0 "End this courtier’s enslavement. They gain Former Slave and may leave your court and marry freely."
 voltara_sell_slave_interaction:0 "Sell Enslaved Courtier"
 voltara_sell_slave_interaction_desc:0 "Choose an enslaved courtier to offer to this ruler for 30 gold. Both realms must permit slavery. Payment and transfer occur only if the offer is accepted."
