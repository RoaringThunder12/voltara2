 building_voltara_ancient_dwarven_keep_1_01:0 "Khaz Barun"
 building_type_voltara_ancient_dwarven_keep_1_01:0 "Khaz Barun"
 building_voltara_ancient_dwarven_keep_1_01_desc:0 "Khaz Barun was cut into the mountain by the ancient Stoneborn. Its deep cisterns, narrow gates, and vaulted granaries were built to shelter generations through siege and winter. The surviving keep remains a place of ancestral oaths and an anchor for the clans of the Stone Creed."
