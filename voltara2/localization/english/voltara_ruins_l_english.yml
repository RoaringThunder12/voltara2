l_english:
 voltara_ruins_open:0 "Wastelands & Ruins"
 voltara_ruins_help:0 "Select a county, duchy, kingdom or empire. Add titles below, then choose how to abandon their counties. Player capitals are protected."
 voltara_ruins_select:0 "Select / Deselect Title"
 voltara_ruins_apply:0 "Set Wasteland / Create Ruins"
 voltara_ruins_clear:0 "Clear Selection"
 voltara_ruins_expedition:0 "Begin Settlement Expedition"
 voltara_ruins_costs:0 "Settlement: 250 gold for a 90-day survey, 300 gold for a one-year outpost, then 500 gold and two years to rebuild. Open a ruined county bordering your realm, or one you formerly held."
 voltara_set_wasteland:0 "Set Wasteland"
 voltara_create_ruins:0 "Create Ruins"
 voltara_ruins_cancel:0 "Cancel"
 voltara_ruins_survey:0 "Fund the survey: 250 gold"
 voltara_ruins_establish:0 "Establish the outpost: 300 gold"
 voltara_ruins_rebuild:0 "Rebuild the holdings: 500 gold"
 voltara_ruins_wait:0 "Wait another year."
 voltara_ruins_abandon:0 "Abandon the expedition."
 voltara_ruins_done:0 "The work is concluded."
 voltara_ruins.1.t:0 "Abandon the Selected Lands"
 voltara_ruins.1.desc:0 "This converts the selected titles’ counties into abandoned land and transfers them to a neutral ruins keeper. Development is lost. Wasteland clears outlying holdings; ruins retain ruined sites for rebuilding. Player capitals are excluded. These changes persist in your save."
 voltara_ruins.10.t:0 "Survey the Ruins"
 voltara_ruins.10.desc:0 "Surveyors and guards need ninety days to chart safe routes and identify a viable settlement site. The expedition costs 250 gold."
 voltara_ruins.11.t:0 "A Foothold Among the Ruins"
 voltara_ruins.11.desc:0 "The survey is complete. A 300-gold outpost can secure this county for your realm. Its first year will be spent building shelter and clearing access routes."
 voltara_ruins.12.t:0 "Reclaiming the Settlement"
 voltara_ruins.12.desc:0 "The outpost is ready for permanent reconstruction. Funding the work costs 500 gold and takes two years. If funds are scarce, the outpost can wait."
 voltara_ruins.13.t:0 "The Reconstruction Concludes"
 voltara_ruins.13.desc:0 "If the county remains under your authority, its ruined holdings are restored to working settlements. Cleared wasteland sites still require new construction."
 voltara_ruins_realm:0 "Abandoned Lands"
 voltara_ruins_keeper:0 "Ruins Keeper"
 voltara_ruins_keeper_desc:0 "A neutral placeholder for abandoned land, not an ordinary ruler."
 voltara_ruins_government:0 "Abandoned Lands"
 voltara_ruins_government_adjective:0 "Abandoned"
 voltara_ruins_government_desc:0 "Neutral abandoned holdings awaiting settlement."
 voltara_abandoned_county:0 "Abandoned Land"
 voltara_abandoned_county_desc:0 "No functioning tax base or levies remain."
 voltara_settlement_county:0 "Reconstruction Outpost"
 voltara_settlement_county_desc:0 "A small settlement is reclaiming the surrounding ruins."
 voltara_ruin_holding:0 "Ruins"
 building_type_voltara_ruin_01:0 "Ruins"
 building_voltara_ruin_01:0 "Ruins"
