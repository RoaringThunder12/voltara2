l_english:
 innovation_zweihanders:0 "Hold Greatswords"
 innovation_zweihanders_desc:0 "Great two-handed blades give disciplined mountain warriors the reach and force to break an enemy line."
 innovation_adaptive_militia:0 "Free Militia"
 innovation_adaptive_militia_desc:0 "Communities equip flexible militia formations to meet threats without relying entirely on noble retinues."
 innovation_valets:0 "Household Retinues"
 innovation_valets_desc:0 "Noble households maintain trained retainers who can take the field at short notice."
 innovation_pike_columns:0 "Passguard Pike Columns"
 innovation_pike_columns_desc:0 "Ranks of long pikes hold narrow approaches and resist mounted charges."
 innovation_legionnaires:0 "Severosi Legions"
 innovation_legionnaires_desc:0 "The Severosi legion organizes professional infantry into disciplined formations with a shared chain of command."
 innovation_desert_tactics:0 "Southron Desert Tactics"
 innovation_desert_tactics_desc:0 "Experienced camel riders exploit dry terrain and conserve supplies on long campaigns."
 innovation_caballeros:0 "Noble Riders"
 innovation_caballeros_desc:0 "Noble riding households furnish trained cavalry for regional warlords."
 innovation_hobbies:0 "Border Riders"
 innovation_hobbies_desc:0 "Lightly equipped border riders scout rough country and pursue scattered enemies."
 innovation_rectilinear_schiltron:0 "Shielded Pike Squares"
 innovation_rectilinear_schiltron_desc:0 "Closely ordered pike squares protect infantry against mounted attacks."
 innovation_bamboo_bows:0 "Weavewood Bows"
 innovation_bamboo_bows_desc:0 "Flexible woodland bowstaves let skilled archers deliver sustained fire."
 innovation_sahel_horsemen:0 "Southron Horsemen"
 innovation_sahel_horsemen_desc:0 "Southron horsemen combine mobility with endurance on open, dry ground."
 innovation_sarawit:0 "Warhost Musters"
 innovation_sarawit_desc:0 "Permanent warhost musters gather experienced fighters into dependable military companies."
 innovation_repeating_crossbow:0 "Deep-Hall Repeating Crossbows"
 innovation_repeating_crossbow_desc:0 "Lever-driven crossbows devised in the deep halls deliver repeated bolts against advancing enemies."
 innovation_pole_vault:0 "Ravine Leaping"
 innovation_pole_vault_desc:0 "Long poles help scouts cross ravines and broken ground beyond ordinary marching routes."
 innovation_reconquista:0 "Frontier Reclamation"
 innovation_reconquista_desc:0 "Frontier commanders organize the recovery and settlement of contested land."
 innovation_stem_duchies:0 "Ancestral Clans"
 innovation_stem_duchies_desc:0 "Ancestral clan territories provide a durable framework for regional authority."
 innovation_ghilman:0 "Bonded Military Households"
 innovation_ghilman_desc:0 "Military households train bonded recruits for service in their masters' armies."
 innovation_east_settling:0 "Frontier Settlement"
 innovation_east_settling_desc:0 "Organized settlement extends farms and fortified communities into the frontier."
 innovation_seigneurialism:0 "Landed Stewardship"
 innovation_seigneurialism_desc:0 "Landed stewards coordinate the obligations and improvements of agricultural estates."
 innovation_muladi:0 "Shared Customs"
 innovation_muladi_desc:0 "Shared civic customs ease cooperation among communities of different faiths."
 innovation_french_peerage:0 "Severosi Peerage"
 innovation_french_peerage_desc:0 "A recognized hierarchy of noble peers strengthens the administration of the Severosi realm."
 innovation_wierdijks:0 "Marsh Dikes"
 innovation_wierdijks_desc:0 "Dikes and drainage works protect low-lying settlements and productive land from flooding."
 innovation_condottieri:0 "Mercenary Contracts"
 innovation_condottieri_desc:0 "Written contracts establish the obligations of hired soldiers and their employers."
 innovation_deccan_unity:0 "Regional Administration"
 innovation_deccan_unity_desc:0 "Regional administration brings distant holdings into a more coherent realm."
 innovation_table_of_princes:0 "Council of Elders"
 innovation_table_of_princes_desc:0 "Councils of senior dynasts preserve succession within the ruling house."
 innovation_longboats:0 "Strait Longships"
 innovation_longboats_desc:0 "Shallow-draft longships carry raiders and traders along coasts and navigable rivers."
 innovation_elephantry:0 "Southern War Elephants"
 innovation_elephantry_desc:0 "Trained war elephants give southern armies a formidable shock force."
 innovation_war_camels:0 "Desert Camel Riders"
 innovation_war_camels_desc:0 "Camel-mounted warriors travel and fight effectively in arid country."
 innovation_wootz_steel:0 "Deep-Forge Steel"
 innovation_wootz_steel_desc:0 "Careful control of heat and carbon produces the prized steel of the deep forges."
 innovation_african_canoes:0 "Shallow-Draft Canoes"
 innovation_african_canoes_desc:0 "Light river craft connect marsh settlements and carry supplies through shallow channels."
 innovation_varangian_adventurers:0 "Seaborne Adventurers"
 innovation_varangian_adventurers_desc:0 "Seaborne warbands seek fortunes and new homes beyond their native shores."
 innovation_all_things:0 "Clan Assemblies"
 innovation_all_things_desc:0 "Clan assemblies provide a recognized place to settle disputes and affirm common obligations."
 innovation_sanitation:0 "Civic Sanitation"
 innovation_sanitation_desc:0 "Drains, clean water and organized waste removal reduce the spread of disease in crowded settlements."
 innovation_fire_medicine:0 "Alchemical Fire"
 innovation_fire_medicine_desc:0 "Alchemists refine combustible mixtures for military and practical applications."
 innovation_champa_rice:0 "Swamp Rice"
 innovation_champa_rice_desc:0 "Hardy rice varieties and careful water management improve the productivity of cultivated wetlands."
 innovation_rocket_cart:0 "Forge Rocket Carts"
 innovation_rocket_cart_desc:0 "Forge-built carts launch volleys of incendiary rockets at enemy formations."
 innovation_sericulture:0 "Silk Weaving"
 innovation_sericulture_desc:0 "Cultivated silkworms and skilled weaving sustain the production of fine silk."
 innovation_compass:0 "Lodestone Navigation"
 innovation_compass_desc:0 "Lodestone instruments help navigators hold their course beyond sight of familiar shores."
 innovation_dragon_kiln:0 "Great Kilns"
 innovation_dragon_kiln_desc:0 "Large, carefully managed kilns improve the firing of durable ceramics."
 innovation_block_printing:0 "Block Printing"
 innovation_block_printing_desc:0 "Carved printing blocks reproduce texts and designs more reliably than repeated copying."
 innovation_grenades:0 "Alchemical Grenades"
 innovation_grenades_desc:0 "Sealed vessels of alchemical compounds turn a thrown charge into a dangerous battlefield weapon."
 innovation_cupellation:0 "Silver Refining"
 innovation_cupellation_desc:0 "Controlled refining separates precious silver from base metals."
 innovation_lacquered_armor:0 "Lacquered Armor"
 innovation_lacquered_armor_desc:0 "Protective lacquer strengthens armor against wear and damp conditions."
 innovation_double_entry_bookkeeping:0 "Double-Entry Ledgers"
 innovation_double_entry_bookkeeping_desc:0 "Paired ledger entries make complex accounts easier to reconcile and audit."
 innovation_bulkheads:0 "Watertight Bulkheads"
 innovation_bulkheads_desc:0 "Internal watertight divisions keep a damaged hull from flooding throughout."
 innovation_coking:0 "Deep-Forge Coke"
 innovation_coking_desc:0 "Refined furnace fuel supports hotter and more efficient metalworking."
 innovation_composite_crossbow:0 "Composite Crossbows"
 innovation_composite_crossbow_desc:0 "Layered materials produce compact, powerful crossbow limbs."
 innovation_pharmacopoeia:0 "Herbal Compendia"
 innovation_pharmacopoeia_desc:0 "Collected remedies preserve tested knowledge of herbs, preparations and treatment."
 innovation_waterworks:0 "Engineered Waterworks"
 innovation_waterworks_desc:0 "Engineered channels and reservoirs support cultivation and growing settlements."
 innovation_tiefutu:0 "Armored Warhost"
 innovation_tiefutu_desc:0 "Heavily armored formations furnish a powerful core for the warhost."
