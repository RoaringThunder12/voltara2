l_english:
 advanced_torture.1001.t:0 "The Torture Ends"
 advanced_torture.1001.desc:0 "The torment is over. [advanced_torture_prisoner.GetShortUIName] falls silent, weakened by pain and marked by fear."
 advanced_torture.1001.a:0 "Let this lesson be remembered."

 advanced_torture.1002.t:0 "The Mark Is Made"
 advanced_torture.1002.desc:0 "The iron has left its sign. [advanced_torture_prisoner.GetShortUIName] will carry the mark of your punishment long after the pain fades."
 advanced_torture.1002.a:0 "A mark speaks louder than a thousand threats."

 advanced_torture.1004.t:0 "An Eye Taken"
 advanced_torture.1004.desc:0 "[advanced_torture_prisoner.GetShortUIName] has lost an eye by your command. The pain will pass, but the mutilation will remain."
 advanced_torture.1004.a:0 "Let them see less, but remember more."

 advanced_torture.1007.t:0 "The Body Is Broken"
 advanced_torture.1007.desc:0 "The torture has left [advanced_torture_prisoner.GetShortUIName] with a broken body and a weakened will."
 advanced_torture.1007.a:0 "The body obeys as well."

 advanced_torture.1008.t:0 "The Torture Ends in Death"
 advanced_torture.1008.desc:0 "The body of [advanced_torture_prisoner.GetShortUIName] has not withstood the torment. Between wounds, exhaustion, and fear, life slips away before anyone can stop it."
 advanced_torture.1008.a:0 "So ends their resistance."

 advanced_torture_result_simple_whipping_01_desc:0 "The guards bind [advanced_torture_prisoner.GetShortUIName] against a damp post in the dungeon. The whip falls again and again, not with the fury of an execution, but with the patience of a calculated punishment. Each blow makes way for the next, until the prisoner's breathing becomes a mixture of rage, shame, and restrained pleading."
 advanced_torture_result_simple_whipping_02_desc:0 "The leather whistles through the air before striking [advanced_torture_prisoner.GetShortUIName]'s back. At first, the prisoner tries to stand firm, gritting their teeth and refusing to cry out, but repetition does its work in the end. When the guards release them, their legs barely bear the weight of pride already humbled."
 advanced_torture_result_simple_whipping_03_desc:0 "You order the punishment to be measured, visible, and remembered. [advanced_torture_prisoner.GetShortUIName] receives the lashes beneath the jailers' cold gaze, while the echo of each blow fades through the stone corridors. It is not a mutilation, but it is a warning written upon the skin."

 advanced_torture_result_branding_iron_01_desc:0 "The red-hot iron draws near slowly until [advanced_torture_prisoner.GetShortUIName] understands that this is no threat. The guards hold the prisoner fast, the metal touches flesh, and the cell fills with a bitter smell and a scream impossible to contain. When they pull the iron away, the mark remains there, dark, red, and final."
 advanced_torture_result_branding_iron_02_desc:0 "The brazier lights the dungeon with a cruel glow. [advanced_torture_prisoner.GetShortUIName] tries to pull away, but the chains allow no space. The iron descends, the skin yields to the heat, and the punishment becomes a symbol. From now on, even in silence, the body will tell what happened."
 advanced_torture_result_branding_iron_03_desc:0 "You need few words. It is enough to lift the iron from the fire and let [advanced_torture_prisoner.GetShortUIName] see the orange glow before contact. Fear comes first; pain, after. The mark is sealed like a signature of authority upon defeated skin."

 advanced_torture_result_stocks_01_desc:0 "The feet of [advanced_torture_prisoner.GetShortUIName] are trapped in the stocks, motionless, twisted by discomfort and exposed to the cold of the stone. There is no blood and no knives, but there are hours of dull pain, cramps, and humiliation. Every attempt to move only reminds the prisoner that even their posture now depends on your will."
 advanced_torture_result_stocks_02_desc:0 "The stocks close with a dry thud. [advanced_torture_prisoner.GetShortUIName] is reduced to an awkward and defeated figure, forced to endure stares, mockery, and the slow punishment of an unmoving body. The torture does not break bones, but it wears down dignity with effective patience."
 advanced_torture_result_stocks_03_desc:0 "The jailers adjust the stocks until [advanced_torture_prisoner.GetShortUIName] stops struggling. The hours pass slowly: ankles ache, the back goes numb, and shame weighs heavier than chains. When the prisoner is finally released, they walk as though part of their pride has been left behind in the wood."

 advanced_torture_result_walk_of_shame_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] is taken from the cell under guard, filthy, exhausted, and forced to walk before those who delight in the prisoner's fall. There are no deep wounds, but every gaze weighs like a slap. Shame becomes public punishment, and the prisoner learns that fear can also take the shape of a crowd."
 advanced_torture_result_walk_of_shame_02_desc:0 "The guards shove [advanced_torture_prisoner.GetShortUIName] across the courtyard, where the murmur grows into mockery. Each step seems longer than the last. Humiliation leaves no clean scars, but it leaves a bitter memory that burns whenever someone remembers the prisoner's name."
 advanced_torture_result_walk_of_shame_03_desc:0 "The door opens, and [advanced_torture_prisoner.GetShortUIName] understands that the punishment will not take place in shadow. The prisoner is forced to show themselves, to endure laughter, insults, and satisfied stares. When they return to the cell, they do not bleed, but something in their pride has been exposed and trampled."

 advanced_torture_result_bastinado_01_desc:0 "The feet of [advanced_torture_prisoner.GetShortUIName] are immobilized while the guards prepare the rods. The first blow seems bearable; the tenth already tears away composure. The soles of the feet become a map of pain, and every future movement will remind the prisoner that even walking can be a punishment."
 advanced_torture_result_bastinado_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] tries not to scream when the rods begin to fall upon bare feet. The torture seems simple, almost humble, but each impact drives into nerves that cannot protect themselves. When it ends, the prisoner does not know whether to fear the next blow more, or the first step they will have to take."
 advanced_torture_result_bastinado_03_desc:0 "You order the bastinado with an almost administrative coldness. The guards obey, blow after blow, until [advanced_torture_prisoner.GetShortUIName] stops tensing and only breathes through spasms. There is no great spectacle, only one certainty: pain can hide in the humblest part of the body."

 advanced_torture_result_water_torment_01_desc:0 "The wet cloth covers [advanced_torture_prisoner.GetShortUIName]'s face while water falls little by little. At first, the prisoner tries to breathe between pauses; then panic takes control. They do not drown completely, but the body does not understand the difference. Each poured jug feels like a small death, repeated without ever quite ending."
 advanced_torture_result_water_torment_02_desc:0 "The jailers hold [advanced_torture_prisoner.GetShortUIName] down while the water soaks the cloth and steals the air. Hands clench, chains jingle, and fear breaks any attempt at pride. When they finally pull the cloth away, the prisoner breathes as though returning from a liquid tomb."
 advanced_torture_result_water_torment_03_desc:0 "There are no blades, but the water torment turns every breath into a battle. [advanced_torture_prisoner.GetShortUIName] thrashes beneath the cloth, swallowing terror, water, and pleas. When the session ends, the prisoner still opens their mouth in search of air, unable to trust that the punishment is over."

 advanced_torture_result_compression_cords_01_desc:0 "The cords are wound around the fingers and limbs of [advanced_torture_prisoner.GetShortUIName]. When tightened, the pain comes first as pressure and then as fire. Nothing needs to be broken at once; it is enough to tighten slowly, let the body hear its own limits, and wait for the will to begin to yield."
 advanced_torture_result_compression_cords_02_desc:0 "The guards work the cords with cruel precision. Each turn seems small, but together they turn the flesh of [advanced_torture_prisoner.GetShortUIName] into a prison narrower than the walls. The pressure rises, hands tremble, and the prisoner's voice loses strength with every knot."
 advanced_torture_result_compression_cords_03_desc:0 "[advanced_torture_prisoner.GetShortUIName] looks at the cords before understanding their true threat. After that, the prisoner only feels how they sink in, how they cut off circulation, and how they turn waiting into pain. When they are removed, the marks remain like dark rings of forced obedience."

 advanced_torture_result_strappado_01_desc:0 "The hands of [advanced_torture_prisoner.GetShortUIName] are tied behind the back before the prisoner is slowly hoisted up. The body rises, the shoulders protest, and the whole weight falls where it should not. For an instant, the prisoner tries to hold back; then pain tears the voice free. The rope creaks, and every span of height seems to bring them closer to breaking."
 advanced_torture_result_strappado_02_desc:0 "The mechanism pulls the rope, and [advanced_torture_prisoner.GetShortUIName] is left suspended with arms forced behind the body. There is no need to strike: the prisoner's own weight does the work. The shoulders tremble, the breath breaks, and the cell hears a plea that takes far too long to come."
 advanced_torture_result_strappado_03_desc:0 "You order the prisoner raised. [advanced_torture_prisoner.GetShortUIName] leaves the floor behind and discovers that even air can be a tool of torture. Joints burn, the body stretches unnaturally, and the guards wait until pride falls before the prisoner does."

 advanced_torture_result_thumbscrew_01_desc:0 "The thumbs of [advanced_torture_prisoner.GetShortUIName] are trapped between the plates of the instrument. The screw turns slowly, almost delicately, until the pain becomes impossible to ignore. Each turn is small but final, and the prisoner learns that a tiny torture can fill an entire cell."
 advanced_torture_result_thumbscrew_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] looks at the thumbscrew with contempt until the metal begins to close. Then the expression changes. The pressure rises, bones protest, and the voice cracks into a low gasp. There is no grand spectacle, only unbearable precision."
 advanced_torture_result_thumbscrew_03_desc:0 "The screw advances little by little. [advanced_torture_prisoner.GetShortUIName] tries to pull their hands away, but the guards hold them firm. The pain gathers in a point so small that it seems impossible for it to rule the whole body, and yet it does."

 advanced_torture_result_short_stretching_bench_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] is laid upon the short stretching bench and bound with rough straps. There is no room for the solemnity of the rack, only direct, close, brutal pressure. The guards pull until the body arches, the joints complain, and the prisoner understands that no great machine is needed to break resistance."
 advanced_torture_result_short_stretching_bench_02_desc:0 "The straps bite into the wrists and ankles of [advanced_torture_prisoner.GetShortUIName]. The bench seems too simple to inspire fear, until the stretching begins. The body tightens, pain runs down the back, and every order to stop comes too late to sound dignified."
 advanced_torture_result_short_stretching_bench_03_desc:0 "The short stretching bench lets the jailers work up close. [advanced_torture_prisoner.GetShortUIName] feels every pull, every adjustment, and every calculated pause. When the prisoner is untied, there is no true relief: only a trembling body that no longer trusts its own limbs."

 advanced_torture_result_rack_01_desc:0 "[advanced_torture_prisoner.GetShortUIName] is placed upon the rack and bound by wrists and ankles. At first, there is only tension, creaking wood, and held breath; then the gears begin to turn. The body stretches against its nature, the joints protest, and the prisoner discovers that pain can grow slowly, without haste, until it occupies everything."
 advanced_torture_result_rack_02_desc:0 "The jailers adjust the rack's straps with a calm that seems worse than violence. [advanced_torture_prisoner.GetShortUIName] tries to resist, but each turn of the mechanism tears out a different sound: first rage, then fear, then pleading. When the torment stops, there is no victory left in the prisoner's gaze."
 advanced_torture_result_rack_03_desc:0 "You order the rack to be tightened little by little. The room is ruled by the groan of wood, the rasp of ropes, and the broken voice of [advanced_torture_prisoner.GetShortUIName]. There is no sudden blow, only constant pressure that turns every second into the threat of rupture."

 advanced_torture_result_wedged_boot_01_desc:0 "The wedged boot closes around the leg of [advanced_torture_prisoner.GetShortUIName]. The first blows upon the wedges seem dry and controlled, but the pain soon rises from bone to throat. The prisoner tries to pull away, though wood and iron have already decided for them."
 advanced_torture_result_wedged_boot_02_desc:0 "The guards place the leg of [advanced_torture_prisoner.GetShortUIName] inside the instrument and begin driving in the wedges. Each blow sinks the pressure deeper, each pause allows what comes next to be understood. When it is over, even silence seems to walk with a limp."
 advanced_torture_result_wedged_boot_03_desc:0 "The boot needs no speed. It feeds on waiting, on pressure, and on the sound of the wedge entering where it should not. [advanced_torture_prisoner.GetShortUIName] grits their teeth until they can no longer do so, and the cell learns the sound of resistance breaking from below."

 advanced_torture_result_rats_01_desc:0 "The jailers prepare the vessel with repulsive calm. [advanced_torture_prisoner.GetShortUIName] understands too late what is stirring inside. Fear arrives before pain: an animal, desperate fear that makes any pride useless. When the torment ends, the prisoner no longer looks at the shadows of the cell in the same way."
 advanced_torture_result_rats_02_desc:0 "The rat torture turns imagination into part of the punishment. [advanced_torture_prisoner.GetShortUIName] twists against the bonds while the jailers bring the heat closer and panic grows inside the vessel. Nothing needs to be explained; the body understands the threat before the mind."
 advanced_torture_result_rats_03_desc:0 "The cell fills with scratching, broken breathing, and stumbling pleas. [advanced_torture_prisoner.GetShortUIName] stops pretending to be brave when the movement beneath the vessel grows frantic. In the end, the torture leaves visible wounds, but the true damage remains in every later startle."

 advanced_torture_result_enucleation_01_desc:0 "The guards hold the head of [advanced_torture_prisoner.GetShortUIName] while the instruments are prepared beneath the dungeon's cold light. The prisoner understands what they are about to lose before feeling it, and that instant of understanding weighs more than any threat. When it is over, the world has been reduced forever."
 advanced_torture_result_enucleation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] tries to turn their face away, but the jailers' hands hold them motionless. The order is carried out with terrible precision. The scream that follows does not belong to ordinary fear, but to the certainty that something irreplaceable has been torn from life."
 advanced_torture_result_enucleation_03_desc:0 "There is no clean way to obey such an order. The cell falls still while [advanced_torture_prisoner.GetShortUIName] loses an eye by your command. When the guards step back, the prisoner no longer looks with defiance; they look with pain, confusion, and a memory that will not heal."

 advanced_torture_result_leg_amputation_01_desc:0 "The amputation does not come as a swift punishment, but as a sentence against the future of [advanced_torture_prisoner.GetShortUIName]. The guards immobilize the prisoner, the instruments are arranged, and the cell fills with a heavy silence. When it is all over, the prisoner still lives, but a part of their life has been left behind forever."
 advanced_torture_result_leg_amputation_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] struggles until the straps steal every chance of escape. The order is carried out amid screams, stained cloths, and the jailers' curt commands. Afterward, only a trembling body remains, and a brutal certainty: the prisoner will never walk the same way again."
 advanced_torture_result_leg_amputation_03_desc:0 "The cell becomes a room of punishment and mutilation. [advanced_torture_prisoner.GetShortUIName] understands that the pain will end someday, but the absence will not. When the guards finish, the prisoner is left exhausted, defeated, and bound to a loss they will carry to the grave."

 advanced_torture_result_nail_cleaner_01_desc:0 "The stilettos seem small, almost insignificant instruments, until they draw near the nails of [advanced_torture_prisoner.GetShortUIName]. The pain comes in fine, precise lines, impossible to ignore. There is no grandeur in this torment, only a cruel intimacy that makes the bones tremble."
 advanced_torture_result_nail_cleaner_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] watches the jailers' hands and begins to plead before the metal does its work. Each movement is slow, deliberate, designed to give fear time to grow. When it ends, the fingers are still there, but they seem to belong to another body."
 advanced_torture_result_nail_cleaner_03_desc:0 "The nail cleaner turns a tiny part of the body into the center of the world. [advanced_torture_prisoner.GetShortUIName] shudders with every pressure of the stiletto, unable to pull their hands away. Torture needs no great machines: precision, patience, and a victim who cannot turn aside are enough."

 advanced_torture_result_phalaris_bull_01_desc:0 "The bronze bull waits like an unmoving beast. When [advanced_torture_prisoner.GetShortUIName] is locked inside, the metal is still cold, but fear is already burning. Then the braziers are stoked, the prison begins to heat, and the sounds coming from the hollow figure seem less human with every passing instant."
 advanced_torture_result_phalaris_bull_02_desc:0 "You order the bull prepared. The guards obey with a mixture of fear and fascination, for even among executioners there are methods that seem too cruel. [advanced_torture_prisoner.GetShortUIName] vanishes inside the bronze, and soon the chamber hears an agony distorted by metal."
 advanced_torture_result_phalaris_bull_03_desc:0 "The torture of the bull does not merely punish [advanced_torture_prisoner.GetShortUIName]; it also turns suffering into spectacle. The bronze heats, the walls amplify the screams, and those who listen look away, though none dare stop the order."

 advanced_torture_result_judas_cradle_01_desc:0 "The Judas cradle rises in the center of the cell like a simple and obscene threat. [advanced_torture_prisoner.GetShortUIName] is slowly raised, held by ropes that grant far too much time to understand. The descent is controlled, cruel, and each pause lets fear perform its own torture."
 advanced_torture_result_judas_cradle_02_desc:0 "The guards handle the ropes while [advanced_torture_prisoner.GetShortUIName] hangs suspended above the instrument. There is no blow, no hurry, only gravity and obedience. The prisoner pleads before touching it, and when the torment begins, the words fall apart into broken sounds."
 advanced_torture_result_judas_cradle_03_desc:0 "The Judas cradle punishes with slowness. [advanced_torture_prisoner.GetShortUIName] feels how every finger's length of released rope worsens their fate. The cell fills with tension, moans, and brief orders, until the body can no longer distinguish between pain, shame, and terror."

 advanced_torture_result_pear_of_anguish_01_desc:0 "The pear of anguish is shown to [advanced_torture_prisoner.GetShortUIName] before it is used, because part of the torment lies in understanding it. The metal is set, the mechanism responds, and the prisoner loses all composure. This is not a torture of brute force, but of invasion, control, and absolute fear."
 advanced_torture_result_pear_of_anguish_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] tries to resist when the jailers bring the instrument closer, but the chains allow no dignity. The torture advances in small, mechanical movements, each one worse than the last. When it ends, the prisoner's silence seems deeper than any scream."
 advanced_torture_result_pear_of_anguish_03_desc:0 "The instrument opens by command, slowly, with an almost ceremonial cruelty. [advanced_torture_prisoner.GetShortUIName] stops cursing and begins to plead when the prisoner understands that the pain does not come from a blow, but from an internal and unavoidable pressure."

 advanced_torture_result_iron_spider_01_desc:0 "The iron spider is heated until it takes on a dark, threatening glow. When it touches [advanced_torture_prisoner.GetShortUIName], the punishment arrives as pressure, burning, and controlled tearing. The guards work without enthusiasm, as though even they would rather not look for too long."
 advanced_torture_result_iron_spider_02_desc:0 "[advanced_torture_prisoner.GetShortUIName] retreats until the chains pull tight. The spider draws near, its points ready to turn skin into warning. The pain draws an immediate reaction, but the true horror lies in the pause between each application."
 advanced_torture_result_iron_spider_03_desc:0 "The spider's metal leaves marks that do not seem human. [advanced_torture_prisoner.GetShortUIName] trembles beneath the jailers' hands while the instrument bites, withdraws, and returns. When it ends, the cell smells of iron, fear, and forced obedience."

 advanced_torture_result_torture_chair_01_desc:0 "The chair of nails receives [advanced_torture_prisoner.GetShortUIName] without needing to move. It is enough to force the prisoner to sit, tighten the straps, and let the body's weight do the rest. Every attempt to ease the pain only finds another point, another pressure, another reason to remain still."
 advanced_torture_result_torture_chair_02_desc:0 "The guards push [advanced_torture_prisoner.GetShortUIName] into the chair and tighten the restraints hard. The torment does not advance: it remains. That is its cruelty. The prisoner can find no posture, rest, or hope, only constant pain that turns time into punishment."
 advanced_torture_result_torture_chair_03_desc:0 "The chair seems to wait patiently for its victim. [advanced_torture_prisoner.GetShortUIName] understands that they will not be tortured by blows, but by duration. The nails press, the straps immobilize, and every breath recalls that even sitting can become torment."

 advanced_torture_result_skull_crusher_01_desc:0 "The skull crusher is placed with terrible precision. [advanced_torture_prisoner.GetShortUIName] tries to pull away, but the iron already surrounds the head. The screw turns slowly, and each turn brings a deeper, darker pressure, as though the whole world were closing around a single point of pain."
 advanced_torture_result_skull_crusher_02_desc:0 "You do not order speed. You order control. The jailers turn the mechanism while [advanced_torture_prisoner.GetShortUIName] loses the ability to defy, then to insult, then almost to speak. Pressure turns courage into panic, and panic into a barely recognizable plea."
 advanced_torture_result_skull_crusher_03_desc:0 "The instrument seems too simple to cause so much fear: iron, screw, and patience. [advanced_torture_prisoner.GetShortUIName] soon discovers that it needs nothing more. Each turn concentrates pain behind the eyes, in the jaw, in the breath. When it ends, no one in the room confuses silence with resistance."