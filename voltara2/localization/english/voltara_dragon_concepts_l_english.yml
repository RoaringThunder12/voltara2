l_english:
 game_concept_dragonpit:0 "Dragonpit"
 game_concept_dragonpit_desc:0 "A fortified enclosure that houses dragons. Its owner controls access through dragonpit laws. Confined dragons grow more slowly and must be released before deployment."
 game_concept_dragons_plural:0 "Dragons"
 game_concept_dragons_plural_desc:0 "Long-lived creatures that can hatch from eggs, form exclusive rider bonds, and fight in wars."
 game_concept_temperament:0 "Temperament"
 game_concept_temperament_desc:0 "A dragon’s disposition, affected by its personality and physical traits."
 game_concept_draconic_dread:0 "Draconic Dread"
 game_concept_draconic_dread_desc:0 "The fear inspired by a dragon’s nature and appearance."