 voltara_lore.1.o8:0 "Close the chronicle."
 voltara_lore.2.t:0 "Before the First Crown"
 voltara_lore.2.desc:0 "Aeliun, goddess of Order, and Khaos, god of Chaos, contend at the beginning of creation. Their struggle brings the universe into being. Voltara's faiths disagree over what mortals owe these powers: some preserve the memory of both, while Ordered Absolutism exalts Aeliun and shuns Khaos. The Sundering remains a dividing line in the world's remembered past."
 voltara_lore.2.o0:0 "Return to the contents."
 voltara_lore.2.o1:0 "Close the chronicle."
 voltara_lore.3.t:0 "Titus and the Serpent's Tongue"
 voltara_lore.3.desc:0 "Born in Alu'tor to a fishmonger's life, Titus rose through naval service and crossed the sea. His landing in 3109 PS, later reckoned as the first year of his era, led to the founding of Titania on the Serpent's Tongue. Justice, his Astral Steel warhammer, and his emerald ring became emblems of House Severos."
 voltara_lore.3.o0:0 "Return to the contents."
 voltara_lore.3.o1:0 "Close the chronicle."
 voltara_lore.4.t:0 "Vivian and the Twelve"
 voltara_lore.4.desc:0 "Titus and Princess Vivian are the parents of twelve children: the twins Tyland and Gerold; then Shara, Hera, Titus, Aerion, Corin, Maximus, Merlyn, Lucy, Barbara and Harold. Vivian is remembered for extraordinary beauty. Tyland's son Nolan belongs to the later succession."
 voltara_lore.4.o0:0 "Return to the contents."
 voltara_lore.4.o1:0 "Close the chronicle."
 voltara_lore.5.t:0 "The Gate of Kartholos"
 voltara_lore.5.desc:0 "The works associated with Conlan Kartholos bind canal, bridge and northern wall into a single strategic crossing. Karthalon is the capital of the Keepers of Kartholos. Whoever commands these defenses must provision the watch as well as hold stone walls: traffic through the channel and passage across the bridge make this a meeting point of trade and war."
 voltara_lore.5.o0:0 "Return to the contents."
 voltara_lore.5.o1:0 "Close the chronicle."
 voltara_lore.6.t:0 "Talia and the Sixth Invasion"
 voltara_lore.6.desc:0 "Talia the Uniter leads the Sixth Southron Invasion Kingdom from Baleran. Southron vassals, Orc and Giant lords, and tributary kingdoms give her power several foundations. The compact is a coalition rather than a single people. Holding these alliances together is a task that conquest alone cannot finish."
 voltara_lore.6.o0:0 "Return to the contents."
 voltara_lore.6.o1:0 "Close the chronicle."
 voltara_lore.7.t:0 "Later Chronicles: House Severos"
 voltara_lore.7.desc:0 "Beyond this campaign lies the later Severosi succession: Tyland and Nolan, a long peace, Garian's tragedy, a succession crisis and a restored line. In that later line, Lucian and Aveline Ashford are parents of Marcus. Marcus and Rayna Ursa are parents of Cassian and Octavian. Cassian and Adriana Bryndale have Leon and Nora. These names belong to later chapters of the Severosi saga."
 voltara_lore.7.o0:0 "Return to the contents."
 voltara_lore.7.o1:0 "Close the chronicle."
 voltara_lore.8.t:0 "Later Chronicles: The Withering Hand"
 voltara_lore.8.desc:0 "Thorne Virell teaches in the Citadel and Rotunda. His wife Lyssan suffers a wasting loss of memory; their daughter Elira challenges slavery and the exclusion of women. The later struggle around Cassian and Octavian destroys the family and turns the scholar toward the path of the Withering Hand, bound to Khaos. Loss transforms the man who once trusted that reform could proceed through reason and law."
 voltara_lore.8.o0:0 "Return to the contents."
 voltara_lore.8.o1:0 "Close the chronicle."
 voltara_lore.9.t:0 "Dragons and Astral Steel"
 voltara_lore.9.desc:0 "Later tradition connects Titus's completed conquest with the death of the Last Dragon and the recovery of four eggs. Those deeds stand beyond the opening of his conquest. Justice and the emerald ring survive as emblems of the dynasty, while the eggs carry the possibility of a very different inheritance."
 voltara_lore.9.o0:0 "Return to the contents."
 voltara_lore.9.o1:0 "Close the chronicle."
 voltara_lore.20.t:0 "The Weight of Justice"
 voltara_lore.20.desc:0 "The name of Titus's hammer is also a question asked of every ruler of House Severos. Does justice live in a subject's trust, or in the certainty that defiance will be answered? I can make that choice visible in the conduct of my court."
 voltara_lore.20.o0:0 "Let my subjects see mercy."
 voltara_lore.20.o1:0 "Let them see that authority has weight."
