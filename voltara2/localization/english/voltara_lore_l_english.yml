 vl_justice_name:0 "Justice"
 vl_justice_desc:0 "Titus Severos's immense Astral Steel warhammer. To its admirers, Justice embodies the conqueror's authority; to those beneath it, that authority has a terrible weight. Possession of the hammer alone cannot make a ruler worthy of it."
 vl_ring_name:0 "The Emerald Ring of Severos"
 vl_ring_desc:0 "An emerald set in Astral Steel, associated with Titus and the succession of House Severos. Its endurance is a reminder that a dynasty must outlast the hands that bear its seal."
 building_type_voltara_titania_01:0 "Titania on the Serpent's Tongue"
 building_type_voltara_titania_01_desc:0 "Founded by Titus after his arrival from Alu'tor, Titania anchors the Severosi conquest. Ships, provisions and petitioners gather here, where a seaborne venture grows into an imperial capital."
 building_voltara_titania_01:0 "Harbours of Titania"
 building_voltara_titania_01_desc:0 "$building_type_voltara_titania_01_desc$"
 building_type_voltara_kartholos_01:0 "The Defenses of Kartholos"
 building_type_voltara_kartholos_01_desc:0 "The canal, bridge and connected walls form a single defensive system protecting the northern approach. From Karthalon, the Keepers maintain the crossing and the works associated with Conlan Kartholos."
 building_voltara_kartholos_01:0 "Karthalon and the Canal Watch"
 building_voltara_kartholos_01_desc:0 "$building_type_voltara_kartholos_01_desc$"
