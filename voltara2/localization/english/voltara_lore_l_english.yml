 voltara_lore.1.t:0 "The Chronicles of Voltara"
 voltara_lore.1.desc:0 "Choose a volume. The year is 3116 PS. The year opens in Aeliunar and closes in Khaosar; between them lie months dedicated to Eris, Kalthia, Lethara and the Cold God. Founding lore and later-era stories are collected separately."
 voltara_lore.1.o0:0 "Before the First Crown"
 voltara_lore.1.o1:0 "Titus and the Serpent's Tongue"
 voltara_lore.1.o2:0 "Vivian and the Twelve"
 voltara_lore.1.o3:0 "The Gate of Kartholos"
