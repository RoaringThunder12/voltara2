 trait_dragon_accepting_character_desc:0 "Curiously relaxed around people, [ROOT.Char.GetFirstNameNoTooltip] has shown a tendency toward riders and following directions."
 trait_dragon_aerodynamic:0 "Aerodynamic"
 trait_dragon_aerodynamic_character_desc:0 "With a sleek form and effortless grace in flight, [ROOT.Char.GetFirstNameNoTooltip] seems born to rule the skies, moving with minimal resistance and unmatched speed."
 trait_dragon_aerodynamic_desc:0 "Though massive in size, dragons vary greatly in how they move through the skies. Some are clumsy, but others cut the wind like an arrow."
 trait_dragon_aggressive_character_desc:0 "Quick to lash out at any creature, in any situation, [ROOT.Char.GetFirstNameNoTooltip] is notoriously known for anger."
 trait_dragon_agile:0 "Agile"
 trait_dragon_agile_character_desc:0 "With an almost energetic presence in every step, [ROOT.Char.GetFirstNameNoTooltip] is astonishingly lively for a dragon, a trait that brings a host of benefits."
 trait_dragon_agile_desc:0 "No one denies that dragons have a brain, and just so, like in other creatures, dragons can both be clever or dumber."
 trait_dragon_blind_character_desc:0 "Either through injury or misfortune at birth, [ROOT.Char.GetFirstNameNoTooltip] is unable to see."
 trait_dragon_blind_character_desc_laenas_wyrm:0 "Either through injury or misfortune at birth, [ROOT.Char.GetNicknameNoTooltip] is unable to see."
 trait_dragon_bloodthirsty_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] craves bloody conflict and is noticeably in [ROOT.Char.Custom('GetDragonHerHis')] element as the cause of death or destruction."
 trait_dragon_bound:0 "Bound Dragon"
 trait_dragon_burned_character_desc:0 "Exposed to a truly great heat, [ROOT.Char.GetFirstNameNoTooltip] has been burned across large sections of [ROOT.Char.Custom('GetDragonHerHis')] body."
 trait_dragon_calculating_character_desc:0 "A patient beast, [ROOT.Char.GetFirstNameNoTooltip] prefers to battle with [ROOT.Char.Custom('GetDragonHerHis')] moves well-planned and focused."
 trait_dragon_cannibal_character_desc:0 "Far from simply battling over territory or in war, [ROOT.Char.GetFirstNameNoTooltip] is known to cannibalize other dragons to simply sate [ROOT.Char.Custom('GetDragonHerHis')] appetite."
 trait_dragon_character_desc:0 "Whether made by bloodmagic, fire-made-flesh, a piece of the moon, or a divine body on earth, none can deny that [ROOT.Char.GetNameNoTooltip] is a member of one the most impressive species in the world, a [dragon|El] of old the ancient dragon realms."
 trait_dragon_cooperative_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is a pack animal through and through. [ROOT.Char.Custom('GetDragonSheHe')|U] excels with peers at [ROOT.Char.Custom('GetDragonHerHis')] side."
 trait_dragon_defiant_character_desc:0 "Reviling submission to any man, [ROOT.Char.GetFirstNameNoTooltip] is likely to reject riders, orders, or chains."
 trait_dragon_depressed_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has suffered a great emotional loss after [ROOT.Char.Custom('GetDragonHerHis')] previous rider passed away. As a result, [ROOT.Char.Custom('GetDragonSheHe')] has begun to shun human interaction and remain alone, seeking solace in isolation."
 trait_dragon_destined_character_desc:0 "The wheels of fate turn ever onward, and such has seen [ROOT.GetCharacter.GetFirstNameNoTooltip] marked as the implement of destiny."
 trait_dragon_dreams:0 "Dragon Dreams"
 trait_dragon_dreams_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is haunted by premonitions and visions of possible futures."
 trait_dragon_dreams_desc:0 "This character is haunted by premonitions and visions of possible futures."
 trait_dragon_fertile_character_desc:0 "The fertility of dragons is a fickle thing, but [ROOT.GetCharacter.GetFirstNameNoTooltip] is known to be fruitful and fertile."
 trait_dragon_friendly_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is surprisingly peaceful and considerate with most creatures, and can often be calm or even playful."
 trait_dragon_generic:0 "Dragon"
 trait_dragon_glowing_scales:0 "Glowing Scales"
 trait_dragon_glowing_scales_character_desc:0 "Born with unnaturally thick, glass-like scales, [ROOT.Char.GetFirstNameNoTooltip] reflects light with a dazzling intensity, shining like a living jewel."
 trait_dragon_glowing_scales_desc:0 "Yet another rare birth defect, yet noted as a positive one, some dragons can appear to have a glass like reflection to their scales."
 trait_dragon_ill_character_desc:0 "Though dragons rarely get ill, [ROOT.Char.GetFirstNameNoTooltip] has been struck sick by some unseen malaise or bad meal."
 trait_dragon_imperious_character_desc:0 "There is something almost regal about the interactions between [ROOT.Char.GetFirstNameNoTooltip] and other dragons. [ROOT.Char.Custom('GetDragonSheHe')|U] expects all, dragon and man, to submit to [ROOT.Char.Custom('GetDragonHerHim')]."
 trait_dragon_impulsive_character_desc:0 "Attacking with reckless abandon, [ROOT.Char.GetFirstNameNoTooltip] will often engage enemies immediately."
 trait_dragon_large_wingspan:0 "Large Wingspan"
 trait_dragon_large_wingspan_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is known for their immense wingspan in flight, shaping the air with every slow, heavy beat of their wings."
 trait_dragon_large_wingspan_desc:0 "Some dragons are just born with a heavier wingspan, they are able to mold the air around them. They can both dive and fly faster than others."
 trait_dragon_majestic_character_desc:0 "Awe-inspiring in [ROOT.Char.Custom('GetDragonHerHis')] presence, [ROOT.Char.GetFirstNameNoTooltip] is known for [ROOT.Char.Custom('GetDragonHerHis')] sheer majesty and grandeur, scales gleaming in the sun like polished metal."
 trait_dragon_name_dragon_alive:0 "[ROOT.Var('current_dragon').Char.GetNamePossessive|U] Rider"
 trait_dragon_obtuse:0 "Obtuse"
 trait_dragon_obtuse_character_desc:0 "Defiantly passive and sluggish in action. [ROOT.Char.GetFirstNameNoTooltip] follows orders only when it suits them and is almost deliberately lackadaisical. "
 trait_dragon_obtuse_desc:0 "No one denies that dragons have a brain, and just so, like in other creatures, dragons can both be clever or dumber."
 trait_dragon_owned:0 "Owned Dragon"
 trait_dragon_physique_bad:0 "Bad Dragon Physique"
 trait_dragon_physique_bad_1_character_desc:0 "With slightly malformed wings and patches of misshapen scales, the presence [ROOT.Char.GetFirstNameNoTooltip] would typically command as a dragon is somewhat lessened."
 trait_dragon_physique_bad_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is visibly the lesser of [ROOT.Char.Custom('GetDragonHerHis')] peers; disjoined limbs set out at awkward angles, and [ROOT.Char.Custom('GetDragonHerHis')] movements are awkward and stilted."
 trait_dragon_physique_bad_3_character_desc:0 "From tip to tail there is no part of [ROOT.Char.GetFirstNameNoTooltip] that looks right. Misshapen eyes set awkwardly in an asymmetric skull. The wings are too small, and the back too large. Far from terror, this creature incites pity."
 trait_dragon_physique_bad_4:0 "Misshaped hatchling"
 trait_dragon_physique_bad_4_character_desc:0 "From the day [ROOT.Char.GetFirstNameNoTooltip] broke from the egg, the dragon has looked wrong, and even now it is barely able to move around, often lying in a pit of sorrow."
 trait_dragon_physique_bad_4_desc:0 "Born with a horrible misshaped body, the dragon struggles to breath, the wings barely able to move."
 trait_dragon_physique_good:0 "Good Dragon Physique"
 trait_dragon_physique_good_1_character_desc:0 "With powerful wings, a heavy frame, and a titanic bite, when one looks at [ROOT.Char.GetFirstNameNoTooltip] one can see the power of old the ancient dragon realms."
 trait_dragon_physique_good_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is a stunning specimen of dragon kind. [ROOT.Char.Custom('GetDragonHerHis')] perfect scales ripple with the strength of fire made flesh."
 trait_dragon_physique_good_3_character_desc:0 "Everyone from Asshai to the Wall knows of the sheer physical majesty of [ROOT.Char.GetFirstNameNoTooltip]. To be in [ROOT.Char.Custom('GetDragonHerHis')] presence is to be in the presence of death incarnate."
 trait_dragon_physique_good_4:0 "Astronomical Beast"
 trait_dragon_physique_good_4_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is growing beyond anyone’s imagination. Its awe-inspiring size destined to echo through the ages."
 trait_dragon_physique_good_4_desc:0 "Legends often embellish, but every so often... a true legend is born." 
 trait_dragon_picky_eater:0 "Picky Eater"
 trait_dragon_picky_eater_character_desc:0 "With a temper quick to flare when displeased, [ROOT.Char.GetFirstNameNoTooltip] is notoriously picky at what it consumes."
 trait_dragon_picky_eater_desc:0 "Dragons eat meat, but not all meat is treated equal. Some dragons develop particular habits, rejecting anything less than their preferred prey."
 trait_dragon_restrained_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] eats less than would be expected for a dragon of [ROOT.Char.Custom('GetDragonHerHis')] size, preserving valuable resources."
 trait_dragon_skittish_character_desc:0 "With a tendency to run from conflict, [ROOT.Char.GetFirstNameNoTooltip] seems terribly unaware of [ROOT.Char.Custom('GetDragonHerHis')] power within..."
 trait_dragon_slow_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is slow and lumbering, unable to keep up with peers of the same size and age."
 trait_dragon_small_wingspan:0 "Small Wingspan"
 trait_dragon_small_wingspan_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is known for their small, rapid wingbeats, which hinder proper lift-off and make them appear unstable in the air."
 trait_dragon_small_wingspan_desc:0 "Some suspect genetics play a part in the reason why some dragons have smaller and more rapid wingspans, these dragons appear unstable in the air and generally struggle more."
 trait_dragon_solitary_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is at [ROOT.Char.Custom('GetDragonHerHis')] most effective when free from distractions and other dragons."
 trait_dragon_spindly_character_desc:0 "With elongated limbs and a thin frame, [ROOT.Char.GetFirstNameNoTooltip] is known for an unnerving spindly appearance causing [ROOT.Char.Custom('GetDragonHerHim')] to be both smaller and more agile than [ROOT.Char.Custom('GetDragonHerHis')] peers."
 trait_dragon_supporting_character_desc:0 "It seems [ROOT.Char.GetFirstNameNoTooltip] would be happiest as one of many working henchmen. [ROOT.Char.Custom('GetDragonSheHe')|U] values being loyal over being in control."
 trait_dragon_swift_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is known for [ROOT.Char.Custom('GetDragonHerHis')] speed and agility, able to outmaneuver peers of the same size and age."
 trait_dragon_tamed:0 "Tamed Dragon"
 trait_dragon_thick_scales:0 "Thick Scales"
 trait_dragon_thick_scales_character_desc:0 "On a closer look [ROOT.Char.GetFirstNameNoTooltip]'s scales are incredibly thick, some would even say as thick as a castle wall. [ROOT.Char.GetFirstNameNoTooltip] would be difficult to shoot down."
 trait_dragon_thick_scales_desc:0 "Just like in us, dragons appear to be born with a varied range of scale size and thickness, thick scales on a dragon prevents them from rot and manmade weapons."
 trait_dragon_thin_scales:0 "Thin Scales"
 trait_dragon_thin_scales_character_desc:0 "Riddled with infection and teeming with insects nestled between its frail scales, [ROOT.Char.GetFirstNameNoTooltip] is a vulnerable creature - susceptible to both disease and warfare."
 trait_dragon_thin_scales_desc:0 "Just like in us, dragons appear to be born with a varied range of scale size and thickness, thin scales on a dragon opens the possibility of infections and other serious dangers."
 trait_dragon_too_old:0 "Too Old"
 trait_dragon_too_old_character_desc:0 "The passage of time has taken its toll on this dragon. It is gigantic, but it is slow, it has a hard time taking flight and its years of life have made it stubborn."
 trait_dragon_too_old_desc:0 "Any creature grows old over time, and it happens even to the largest and most fierce monsters too."
 trait_dragon_toothless:0 "Wasting"
 trait_dragon_toothless_character_desc:0 "A great sickness has taken hold within [ROOT.Char.GetFirstNameNoTooltip], and the dragon now struggles to fly, breath, and eat."
 trait_dragon_toothless_desc:0 "A wasting sickness, known to corrupt even the mightest beast."
 trait_dragon_ugly_character_desc:0 "With dull scales and a face only a mother could love, [ROOT.Char.GetFirstNameNoTooltip] is cursed to be an ugly dragon."
 trait_dragon_voracious_character_desc:0 "With an insatiable appetite, [ROOT.Char.GetFirstNameNoTooltip] is known to feed in excess."
 trait_dragon_wild:0 "Wild Dragon"
 trait_dragon_withered_wings:0 "Withered Wings"
 trait_dragon_withered_wings_character_desc:0 "Cursed with absurdly delicate wings, [ROOT.Char.GetFirstNameNoTooltip] can barely take to the skies, rendering them nearly useless in all other regards."
 trait_dragon_withered_wings_desc:0 "Whenever by a damaged egg, or other causes, some dragons can be born utterly thin and fragile."
 trait_dragon_wounded:0 "Wounded"
 trait_dragon_wounded_1_character_desc:0 "Whether through a minor accident or a very one-sided combat, [ROOT.Char.GetFirstNameNoTooltip] has been lightly wounded."
 trait_dragon_wounded_2_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has suffered a wound — surprising for a creature of [ROOT.Char.Custom('GetDragonHerHis')] stature."
 trait_dragon_wounded_3_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has suffered some great wound and will require much rest to recover fully."
 trait_dragon_wounded_4_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has suffered a truly grievous wound — a wound of this size can only have been inflicted by something great and terrible."
 trait_dragon_wounded_5_character_desc:0 "Against all probability for a creature of [ROOT.Char.Custom('GetDragonHerHis')] stature, [ROOT.Char.GetFirstNameNoTooltip] has been wounded so badly as to be near death."
 witness_hatch_dragon_intent:0 "Witness a Dragon Hatching"
 witness_hatch_dragon_intent_desc:0 "You are here to witness a once-in-a-generation event:  the return of [dragons_plural|El] to the world."
 voltara_head_dragonkeeper:0 "Head Dragonkeeper"
 voltara_head_dragonkeeper_desc:0 "Oversees the care and provisioning of dragons housed in the ruler’s dragonpit."
 dragonpit_laws:0 "Dragonpit Access"
 dragonpit_close_family_law:0 "Close Family Only"
 dragonpit_house_law:0 "Members of My House"
 dragonpit_dynasty_law:0 "Members of My Dynasty"
 dragonpit_everyone_law:0 "Open Access"
 dragonpit_close_family_law_desc:0 "Only the owner and close family may approach unclaimed dragons housed in the pit."
 dragonpit_house_law_desc:0 "Members of the owner’s house may approach unclaimed dragons housed in the pit."
 dragonpit_dynasty_law_desc:0 "Members of the owner’s dynasty may approach unclaimed dragons housed in the pit."
 dragonpit_everyone_law_desc:0 "Any eligible character may approach unclaimed dragons housed in the pit."
