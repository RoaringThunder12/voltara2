 dragon_egg_green_2:0 "Beryl Dragon Egg"
 dragon_egg_green_2_desc:0 "$dragon_egg_gen_desc$ A deep green intermingled with bronze, the scales of this egg are more than beautiful."
 dragon_egg_greengrey:0 "Emerald Dragon Egg"
 dragon_egg_greengrey_desc:0 "$dragon_egg_gen_desc$ The pale green surface of this egg is adorned with delicate grey swirls, creating a serene and mesmerizing pattern."
 dragon_egg_greenorange:0 "Unakite Dragon Egg"
 dragon_egg_greenorange_desc:0 "$dragon_egg_gen_desc$ This egg displays a lively contrast of vivid green and vibrant orange, evoking a sense of energy and brightness."
 dragon_egg_greyBlue:0 "Slate Dragon Egg"
 dragon_egg_greyBlue_desc:0 "$dragon_egg_gen_desc$ The shell glows with a cold steel hue, where misty blue fades into stormy grey like waves against stone."
 dragon_egg_grey_1:0 "Grey Dragon Egg"
 dragon_egg_grey_1_desc:0 "$dragon_egg_gen_desc$ The smoky hue of this egg matches that of volcanic ash."
 dragon_egg_grey_2:0 "Slate Dragon Egg"
 dragon_egg_grey_2_desc:0 "$dragon_egg_gen_desc$ The smoky hue of this egg matches that of volcanic ash."
 dragon_egg_greygreenyellow:0 "Andalusite Dragon Egg"
 dragon_egg_greygreenyellow_desc:0 "$dragon_egg_gen_desc$ This egg's pattern mimics nature's palette, seamlessly blending earthy greens, browns, and tans into a harmonious appearance."
 dragon_egg_icefire:0 "Ice and Fire Dragon Egg"
