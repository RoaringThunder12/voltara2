 dragon_egg_black_desc:0 "$dragon_egg_gen_desc$ The obsidian sheen of this egg is reminiscent of the darkest, moonless nights."
 dragon_egg_blackdarkred:0 "Obsidian Dragon Egg"
 dragon_egg_blackdarkred_desc:0 "$dragon_egg_gen_desc$ The black scales of this egg are rippled and swirled with deep scarlet."
 dragon_egg_blackgreen:0 "Wildfire Dragon Egg"
 dragon_egg_blackgreen_desc:0 "$dragon_egg_gen_desc$ This egg is steeped in the sinister swirls of ominous blacks and eerie greens, hinting at madness and danger within its depths."
 dragon_egg_blackred:0 "Bloodstone Dragon Egg"
 dragon_egg_blackred_desc:0 "$dragon_egg_gen_desc$ This egg is predominantly black, adorned with scattered, vivid red spots that gleam like spilled blood against the dark backdrop."
 dragon_egg_blackyellow:0 "Serpentine Dragon Egg"
 dragon_egg_blackyellow_desc:0 "$dragon_egg_gen_desc$ This egg is adorned with striking black and yellow tones, creating a bold and eye-catching contrast reminiscent of honeybees flying amidst a dream of spring."
 dragon_egg_blue:0 "Blue Dragon Egg"
 dragon_egg_blue_desc:0 "$dragon_egg_gen_desc$ Shimmering a cobalt blue, this egg is certainly mesmerizing."
 dragon_egg_bluebronze:0 "Apatite Dragon Egg"
 dragon_egg_bluebronze_desc:0 "$dragon_egg_gen_desc$ This egg showcases a harmonious blend of deep blue and rich bronze, creating a regal and striking appearance."
 dragon_egg_bronze:0 "Bronze Dragon Egg"
 dragon_egg_bronze_desc:0 "$dragon_egg_gen_desc$ This egg is a gleaming bronze, its surface reflecting a warm, rich hue reminiscent of aged metal."
 dragon_egg_brown:0 "Brown Dragon Egg"
 dragon_egg_brown_desc:0 "$dragon_egg_gen_desc$ The deep brown scales of this egg throw off shimmers of gold and bronze in the light."
 dragon_egg_brownspots:0 "Enstatite Dragon Egg"
 dragon_egg_brownspots_desc:0 "$dragon_egg_gen_desc$ The surface of this brown egg is adorned with charming brown spots, resembling the natural patterns found on aged tree bark."
 dragon_egg_darkblue:0 "Cobalt Dragon Egg"
 dragon_egg_darkblue_desc:0 "$dragon_egg_gen_desc$ The deep blue surface of this egg shimmers like the depths of the ocean, exuding a sense of mystery and tranquility."
 dragon_egg_darkpurple:0 "Violet Dragon Egg"
 dragon_egg_darkpurple_desc:0 "$dragon_egg_gen_desc$ The deep and dark shades of purple give this egg a rich hue and capture the essence of nightfall."
 dragon_egg_darkred:0 "Carmine Dragon Egg"
 dragon_egg_darkred_desc:0 "$dragon_egg_gen_desc$ The surface of this egg is a deep, intense red, resembling freshly spilled blood, with a dark and ominous allure."
 dragon_egg_flame:0 "Flame Dragon Egg"
 dragon_egg_flame_desc:0 "$dragon_egg_gen_desc$ The surface of this egg flickers with fiery hues, resembling swirling flames that dance and lick the air with vibrant orange, red, and yellow tones."
 dragon_egg_frost:0 "Frost Dragon Egg"
 dragon_egg_frost_desc:0 "$dragon_egg_gen_desc$ The egg is a striking blend of icy white and frosty blue, its surface radiating a cold, wintry chill."
 dragon_egg_gen_desc:0 "A petrified dragon egg. The ages have turned it to stone, yet it still burns bright with beauty."
 dragon_egg_gold:0 "Gold Dragon Egg"
 dragon_egg_gold_desc:0 "$dragon_egg_gen_desc$ Adorned with enchanting golden scales that glimmer in the light, this egg is a beauty."
 dragon_egg_goldpink:0 "Triphane Dragon Egg"
 dragon_egg_goldpink_desc:0 "$dragon_egg_gen_desc$ This egg gleams with a lustrous golden hue, delicately kissed by shades of soft pink, exuding an aura of elegance and warmth."
 dragon_egg_green_1:0 "Green Dragon Egg"
