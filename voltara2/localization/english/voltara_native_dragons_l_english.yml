 activity_dragon_hatching:0 "Dragon Egg Hatching"
 activity_dragon_hatching_conclusion_desc:0 "The [GetActivityType( 'activity_dragon_hatching' ).GetName] has concluded"
 activity_dragon_hatching_desc:0 "The time has come to try and hatch your dragon egg. A ceremony shall be held in order to witness this grand moment."
 activity_dragon_hatching_destination_selection:0 "You can only host a #V Dragon Egg Hatching#! in your [capital|E], in a [dragonpit|E], or at a #V special location#!."
 activity_dragon_hatching_guest_desc:0 "Attendees"
 activity_dragon_hatching_guest_help_text:0 "Choose who you will invite to witness the hatching of your dragon egg."
 activity_dragon_hatching_host_an_a:0 "$host_activity_a$"
 activity_dragon_hatching_no_dlc:0 "$activity_dragon_hatching$"
 activity_dragon_hatching_no_dlc_conclusion_desc:0 "$activity_dragon_hatching_conclusion_desc$"
 activity_dragon_hatching_no_dlc_desc:0 "$activity_dragon_hatching_desc$"
 activity_dragon_hatching_no_dlc_destination_selection:0 "$activity_dragon_hatching_destination_selection$"
 activity_dragon_hatching_no_dlc_guest_desc:0 "$activity_dragon_hatching_guest_desc$"
 activity_dragon_hatching_no_dlc_guest_help_text:0 "$activity_dragon_hatching_guest_help_text$"
 activity_dragon_hatching_no_dlc_predicted_cost:0 "$activity_dragon_hatching_predicted_cost$"
 activity_dragon_hatching_no_dlc_selection_tooltip:0 "$activity_dragon_hatching_selection_tooltip$"
 activity_dragon_hatching_predicted_cost:0 "The precise cost of your dragon hatching will depend on the style of hatching chosen and your choices during the ceremony."
 activity_dragon_hatching_selection_tooltip:0 "Attempt to hatch your dragon egg and usher in a new age.\n\nAnticipated rewards:\n$agot_host_hatching_potential_reward$"
