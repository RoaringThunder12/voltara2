 voltara_cassian_desc:0 "Cassian commands the Keepers of Kartholos. Guard the channel, provision the watch, and hold the crossing as rival powers contest the lands around you."
 voltara_talia_desc:0 "Talia the Uniter leads the Sixth Southorion Invasion. Keep the Unbound Path coalition together and turn its many rulers into a lasting imperial power."
 voltara_jerion_desc:0 "Jerion rules the Triarchy of Alu’Tor, the land from which Titus began his journey. Preserve the triarchy’s independence as new empires rise across the sea."
