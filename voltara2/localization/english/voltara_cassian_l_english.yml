 vc_bookmark_cassian_subheading:0 "The Reforming Emperor"
 vc_bookmark_cassian_desc:0 "Cassian seeks to reform Severos without tearing it apart. His feudal nobles guard their inherited rights, his brother challenges his authority, and his children depend upon the survival of his settlement."
 vc_bookmark_octavian_subheading:0 "The Imperial Brother"
 vc_bookmark_octavian_desc:0 "Marcus and Rayna's younger son commands influence in the Ironwood. Officers favor his certainty; reformers fear what his ambitions could mean for Severos."
 vc_bookmark_aldren_subheading:0 "The Bryndale Settlement"
 vc_bookmark_aldren_desc:0 "King Aldren rules Bryndale beneath the imperial crown. His daughter Adriana is empress, and his grandchildren Leon and Nora bind the fate of his house to Cassian."
 vc_bookmark_marques_subheading:0 "A House Raised by Reform"
 vc_bookmark_marques_desc:0 "Orion Trevelyan was the first Southorion noble raised by Cassian. His son Marques inherits the burden of proving that imperial reform can outlive court prejudice."
