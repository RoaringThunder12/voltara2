 trait_vt_ek_necromancer:0 "Necromancer"
 trait_vt_ek_necromancer_desc:0 "This character is known to defile the corpses of the dead, manipulating their souls and raising their bodies to do their bidding.\n\n#I Picking this trait in the Ruler Designer will trigger an event at game start, allowing you to start the game as a secret necromancer.#!"
 trait_vt_ek_necromancer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is known to defile the corpses of the dead, manipulating their souls and raising their bodies to do [ROOT.GetCharacter.GetHerHis] bidding."
 trait_vt_ek_lich_character:0 "Lich"
 trait_vt_ek_lich_character_desc:0 "This character has gone into death and wrestled it to its knees with dark magicks and forbidden rituals, attaining lichdom and becoming undead."
 trait_vt_ek_lich_character_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has gone into death and wrestled it to its knees with dark magicks and forbidden rituals, attaining lichdom and becoming undead."
 trait_vt_ek_undead_character:0 "Undead"
 trait_vt_ek_undead_character_desc:0 "This character has lived beyond death, and now walks Nirn as a spooky undead."
 trait_vt_ek_undead_character_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has lived beyond death, and now walks Nirn as a spooky undead."
 trait_vt_ek_undead_character_undead_version_of_desc:0 "[ROOT.Var('undead_version_of').Char.GetTitledFirstName] has lived beyond death, and now walks Nirn as a spooky undead."
 trait_vt_ek_education_magic_1:0 "Novice Evoker"
 trait_vt_ek_education_magic_1_desc:0 "This character received a poor education in the arts of magicka."
 trait_vt_ek_education_magic_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] received a poor education in the arts of magicka."
 trait_vt_ek_education_magic_2:0 "Apprentice Threadbindingian"
 trait_vt_ek_education_magic_2_desc:0 "This character received a standard education in the arts of magicka."
 trait_vt_ek_education_magic_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] received a standard education in the arts of magicka."
 trait_vt_ek_education_magic_3:0 "Expert Wizard"
 trait_vt_ek_education_magic_3_desc:0 "This character received a good education in the arts of magicka."
 trait_vt_ek_education_magic_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] received a good education in the arts of magicka."
 trait_vt_ek_education_magic_4:0 "Master Mage"
 trait_vt_ek_education_magic_4_desc:0 "This character was taught by some of the best wizards in Tamriel, and displays both an impressive natural arcana and a willingness to learn all there is about the magical arts."
 trait_vt_ek_education_magic_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] was taught by some of the best wizards in Tamriel, and displays both an impressive natural arcana and a willingness to learn all there is about the magical arts."
 trait_vt_ek_education_magic_5:0 "Supreme Magus"
 trait_vt_ek_education_magic_5_desc:0 "This character only learned from the most powerful and knowledgeable wizards and has reached the pinnacle of magical understanding. The boundaries of reality itself are no longer a match for such abilities."
 trait_vt_ek_education_magic_5_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] only learned from the most powerful and knowledgeable wizards and has reached the pinnacle of magical understanding. The boundaries of reality itself are no longer a match for such abilities."
 trait_vt_ek_arcana_good_1:0 "Attuned"
 trait_vt_ek_arcana_good_1_desc:0 "This character is keenly attuned to magicka, making arcane feats easier."
 trait_vt_ek_arcana_good_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is keenly attuned to magicka, making arcane feats easier."
 trait_vt_ek_arcana_good_2:0 "Acute"
 trait_vt_ek_arcana_good_2_desc:0 "This character has an acute perception of magicka, easily performing impressive magic."
 trait_vt_ek_arcana_good_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an acute perception of magicka, easily performing impressive magic."
 trait_vt_ek_arcana_good_3:0 "Aetheric"
 trait_vt_ek_arcana_good_3_desc:0 "This character manipulates magicka as if [ROOT.GetCharacter.GetSheHe] is blessed by Aetherius, achieving magic miracles with barely an effort."
 trait_vt_ek_arcana_good_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] manipulates magicka as if [ROOT.GetCharacter.GetSheHe] is blessed by Aetherius, achieving magic miracles with barely an effort."
 trait_vt_ek_arcana_bad_1:0 "Deficient"
 trait_vt_ek_arcana_bad_1_desc:0 "This character has a magical deficiency, making arcane feats harder."
 trait_vt_ek_arcana_bad_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has a magical deficiency, making arcane feats harder."
 trait_vt_ek_arcana_bad_2:0 "Discordant"
 trait_vt_ek_arcana_bad_2_desc:0 "This character cannot properly read the flow of magicka, only casting decent spells with significant focus."
 trait_vt_ek_arcana_bad_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] cannot properly read the flow of magicka, only casting decent spells with significant focus."
 trait_vt_ek_arcana_bad_3:0 "Destitute"
 trait_vt_ek_arcana_bad_3_desc:0 " This character seems forsaken by magic itself as they cannot command magic without great strain."
 trait_vt_ek_arcana_bad_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] seems forsaken by magic itself as [ROOT.GetCharacter.GetSheHe] cannot command magic without great strain."
 trait_vt_ek_disrupted:0 "Disrupted"
 trait_vt_ek_disrupted_desc:0 "This character's magical senses have been purposefully crippled."
 trait_vt_ek_disrupted_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]'s magical senses have been purposefully crippled."
 trait_vt_ek_magickal:0 "Thread Reservel"
 trait_vt_ek_magickal_desc:0 "Sensing and spellcasting have shaped this character, granting greater focus for magicks."
 trait_vt_ek_magickal_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] boasts an improved aptitude for magical arts."
 trait_vt_ek_experimentalist_necromancer:0 "Experimentalist"
 trait_vt_ek_experimentalist_necromancer_desc:0 "This character enjoys to perform all kinds of magical experiments and tends to forget mundane sorrows while doing so."
 trait_vt_ek_experimentalist_necromancer_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] enjoys to perform all kinds of magical experiments and tends to forget  mundane sorrows while doing so."
 trait_vt_ek_experimentalist_necromancer_player:0 "Secret Necromancer"
 trait_vt_ek_experimentalist_necromancer_player_desc:0 "This character is secretly a necromancer, though the true nature of [ROOT.GetCharacter.GetHerHis] dark doings is still hidden from the world."
 dark_arts_lifestyle_name:0 "Forbidden Threadbinding"
 dark_arts_lifestyle_desc:0 "Study the threads that persist beyond death. Bind restless souls, raise the fallen, and uncover the price of escaping mortality."
 dark_arts_lifestyle_highlight_desc:0 "Necromancers develop their mastery of the forbidden Weave through dedicated study."
 dark_arts_mysticism_focus:0 "Necromantic Study"
 dark_arts_mysticism_focus_desc:0 "Explore the boundary between a living soul and the threads left behind by death."
 monthly_vt_threadbinding_magic_lifestyle_xp_gain_mult:0 "Monthly Threadbinding Lifestyle Experience"
 voltara_unbound_weave:0 "Unbound Weave"
 voltara_unbound_weave_adj:0 "Unbound"
 voltara_unbound_weave_adherent:0 "Unbound Weaver"
 voltara_unbound_weave_adherent_plural:0 "Unbound Weavers"
 voltara_unbound_weave_desc:0 "The Unbound Weave teaches that Khaos dwells in every thread that refuses its appointed pattern. Its adepts embrace unstable magic and regard death as a change of binding, not an end. In Barelvar, Ithren teaches that the dead may be recalled to service and that forbidden knowledge is sacred precisely because others fear it. Rival Khaotists question whether binding a soul liberates it or merely replaces one chain with another."
 tenet_voltara_unbound_souls_name:0 "Unbound Souls"
 tenet_voltara_unbound_souls_desc:0 "No thread is beyond Khaos, and no mortal boundary is final. Necromancy is a sacred discipline: the dead retain a place in the changing Weave, and the learned may call them back."
