l_english:
 court_mage_court_position_desc:0 "The Court Threadbinder advises the ruler on the Weave, develops magical knowledge, and supports the court with ritual expertise."
 voltara_doctrine_necromancy_name:0 "Necromancy"
 voltara_necromancy_crime_name:0 "Criminal"
 voltara_necromancy_crime_desc:0 "Binding the dead violates the rightful order of life and death. Those who practice it must answer for their desecration."
 voltara_necromancy_accepted_name:0 "Accepted"
 voltara_necromancy_accepted_desc:0 "Death changes the pattern of a soul, but does not remove it from the Weave. Raising and binding the dead is permitted."
 doctrine_parameter_necromancy_criminal:0 "Known necromancers are criminals and are condemned for binding the dead."
 doctrine_parameter_necromancy_accepted:0 "Necromancy is permitted; practitioners may openly raise and bind the dead."
