 voltara_barelvar_master_necromancer_desc:0 "Ithren Veilroot has spent two centuries studying the threads that linger after death. From his secluded sanctum at Barelvar, he claims that memory can outlast flesh—and that no soul should be surrendered to oblivion merely because its body has failed. His patience wins students; his experiments frighten his neighbors."
