 building_type_voltara_shattered_crystal_tower_01:0 "Shattered Crystal Tower"
 building_voltara_shattered_crystal_tower_01_desc:0 "Beneath the black water of the Great Swamp lie the splintered halls of a crystal elven tower. Here, during the Sundering, a circle of High Elves attempted to break the Weave itself. The tower shattered, leaving pale shards and echoes that still trouble the reeds. Reclaiming the site permits study of its surviving fragments; it does not restore the lost tower."
