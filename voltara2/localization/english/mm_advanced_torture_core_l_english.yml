 advanced_torture_light_torture_tt:0 "A lesser torture. It causes minor harm, humiliation, and resentment, but rarely leaves permanent consequences."
 advanced_torture_medium_torture_tt:0 "A moderate torture. It may cause wounds, physical deterioration, lasting fear, and a greater chance of revealing secrets."
 advanced_torture_strong_torture_tt:0 "A severe torture. It may leave grave consequences, mutilation, illness, mental damage, or even accidental death."
 advanced_torture_sadistic_torture_tt:0 "A sadistic torture. Only those with exceptional cruelty can order these torments without hesitation."
 advanced_torture_enucleation_tt:0 "Tear out one of the prisoner's eyes. This cannot be used against characters who are already one-eyed or blind."
 advanced_torture_leg_amputation_tt:0 "Amputate one of the prisoner's legs. This cannot be used against characters who have already lost a leg."
 advanced_torture_tortured_to_survive:0 "Tortured to Survive"
 advanced_torture_tortured_to_survive_desc:0 "This prisoner is being kept at the edge of death by an expert torturer, not out of mercy, but to prolong the torment."
