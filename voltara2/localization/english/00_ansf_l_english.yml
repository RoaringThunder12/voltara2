 #events
 ansf.1001.t:0 "Who Am I?"
 ansf.1001.t.other:0 "Who Is [target.GetTitledFirstNameNoTooltip]?"
 ansf.1001.desc.adventurer:0 "I still find it strange to hear "[ROOT.Char.GetTitledFirstNameNoTooltip]" from those who surround me. I lead [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l], and I expect greatness awaits me yet, but it is still so new.\n\nWith my family so much on my mind, it falls on me to pause for a moment and reflect on how I came to this point..."
 ansf.1001.desc:0 "I still find it strange to hear "[ROOT.Char.GetTitledFirstNameNoTooltip]" from those who surround me. The [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] has known many names before mine but, on this day, it is mine they incessantly whisper.\n\nWith my family so much on my mind, it falls on me to pause for a moment and reflect on how I came to this point..."
 ansf.1001.desc.other.ruler:0 "Few know a great deal about [target.GetTitledFirstNameNoTooltip], aside from the fact that [target.GetSheHe] rules over [target.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nThe question thus arises: who is [target.GetSheHe]? Where did [target.GetSheHe] come from? Surely there is more to know beyond [target.GetHerHis] title..."
 ansf.1001.desc.other:0 "Few know much about [target.GetTitledFirstNameNoTooltip], aside from the fact that [target.GetSheHe] resides in [target.GetLiege.GetTitledFirstNamePossessiveNoTooltip] court.\n\nThe question thus arises: who is [target.GetSheHe]? Where did [target.GetSheHe] come from? Surely there is more to [target.GetHerHim] than it would first appear..."
 ansf.me.peasant.leader:0 "I came from humble origins and took my title through force."
 ansf.me.peasant.leader.adventurer:0 "I came to [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] from humble origins."
 ansf.other.peasant.leader:0 "[target.GetSheHe|U] came from humble origins."
 ansf.me.peasant.leader.tt:0 "@warning_icon! #X [target.GetShortUINameNoTooltipNoFormat|U] will automatically be the founder of [CharYourHerHis(target)] dynasty, and both [CharYourHerHis(target)] parents (and any full siblings) will be lowborn. #!"
 ansf.me.father.peasant.adventurer:0 "My father founded [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] before passing it onto me."
 ansf.me.father.peasant.leader:0 "My father took my title through force before passing it onto me."
 ansf.other.father.peasant.leader.adventurer:0 "[target.GetHerHis|U] father founded [target.GetPrimaryTitle.GetNameNoTooltip|l] before passing it onto [target.GetHerHim]."
 ansf.other.father.peasant.leader:0 "[target.GetHerHis|U] father took [target.GetHerHis] title through force before passing it onto [target.GetHerHim]."
 ansf.me.father.peasant.leader.tt:0 "@warning_icon! #X [target.GetShortUINamePossessiveNoTooltipNoFormat|U] father will be given the [GetTrait('peasant_leader').GetName( GetNullCharacter )] trait, and [CharYouSheHe(target)] will have no option but to join his dynasty. The dynasty can be customized again, if you wish, after you return to the game. #!"
 ansf.me.existing.family:0 "I am part of a larger dynasty."
 ansf.other.existing.family:0 "[target.GetSheHe|U] is part of a larger dynasty."
 ansf.me.existing.family.tt:0 "@warning_icon! #X You will need to select which dynasty you come from, using a selection of rulers and pinned characters who match your faith and culture and are of an appropriate age.\n\nIf you are a [GetTrait('bastard').GetName( target.Self )], you will keep your current dynasty and become a [GetTrait('bastard_founder').GetName( target.Self )]. Otherwise you will take on your chosen relative's dynasty.#!"
 ansf.other.existing.family.tt:0 "@warning_icon! #X You will need to select which dynasty [target.GetTitledFirstNameNoTooltip] comes from, using a selection of rulers and pinned characters who match [target.GetHerHis] faith and culture and are of an appropriate age.\n\nIf [target.GetSheHe] is a [GetTrait('bastard').GetName( target.Self )], [target.GetSheHe] will keep [target.GetHerHis] current dynasty and become a [GetTrait('bastard_founder').GetName( target.Self )]. Otherwise, [target.GetSheHe] will take on the chosen relative's dynasty.#!"
 ansf.me.has.liege:0 "I am exactly as I appear, granted my title by my liege."
 ansf.me.has.liege.tt:0 "#X You will proceed with no changes to your character, other than a pre-existing relationship with your leige. #!"
 ansf.me.no.changes:0 "I am exactly as I appear. Nothing more, nothing less."
 ansf.me.no.changes.tt:0 "Proceed with no changes to [target.GetShortUINamePossessiveNoTooltipNoFormat] character"
 ansf.other.no.changes:0 "We will find out, won't we?"
 ansf.me.no:0 "#emphasis I am not ready for this self-reflection...#"
 ansf.other.no:0 "#emphasis Actually, never mind..."
 ansf.me.no.tt:0 "Opt out of the event - you will be able to re-select the decision when you're ready, so long as it's within the first game year"
 ansf.other.no.tt:0 "Opt out of the event and create no family members"
 
 ansf.father.event.t:0 "[target.GetHerHisMy|U] Father"
 ansf.father.event.d:0 "My father is a complicated man. There are many rumours of him here at court, especially surrounding how it was his [ROOT.Char.Custom('GetDaughterSon')] who came to rule over [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] and not him, but he's so much more than those rumours would have you believe. Perhaps he isn't always the finest of men, it's true. We rarely are, on our worst days, and what man should be judged in such a light?\n\nWhat's far more important than any of that is that he has always there for his family."
 ansf.father.event.existing.d:0 "My father is a complicated man. The whispers of how he was once [ROOT.Char.GetMother.GetTitledFirstNamePossessiveNoTooltip] lover have long quieted, even if they have never entirely ceased, but he's so much more than the rumours would have you believe. Perhaps he hasn't always been the finest of men, it's true. We rarely are, on our worst days, and what man should be judged in such a light?\n\nWhat's far more important than any of that is that he has always been there for his family."
 ansf.father.event.other.d:0 "I must admit, I know little of [target.GetTitledFirstNamePossessiveNoTooltip] father.\n\n[target.GetSheHe|U] speaks so rarely of the man that you're left to wonder what stories are being left untold. Fond ones [target.GetSheHe] would simply rather keep to [target.GetHerselfHimself]? Terrible ones [target.GetSheHe] would sooner forget? Perhaps the time has come to make inquiries, to satisfy my curiosity if nothing else."
 ansf.yes.dad.house:0 "He is the true founder of [Select_CString( target.IsLocalPlayer, 'our', target.GetTitledFirstNamePossessiveNoTooltip )] dynasty."
 ansf.yes.dad:0 "That is indeed him."
 ansf.yes.dad.tooltip:0 "@warning_icon! #X [target.GetShortUINamePossessiveNoTooltipNoFormat|U] father will remain part of the [ansf_family_member.GetDynasty.GetBaseName] dynasty and will not show up in the dynasty window. If [CharYouSheHe(target)] do not join [CharYourHerHis(target)] mother's dynasty, then neither of them will. #!"
 ansf.yes.dad.relative:0 "Actually, he came to us from a larger family..."
 ansf.yes.dad.relative.other:0 "Actually, he is part of a larger family..."
 ansf.no.dad:0 "I'm not sure if that's an accurate portrayal of him."
 ansf.no.dad.regenerate:0 "Let me tell you what he was #EMP really#! like..."
 ansf.no.dad.other:0 "No, that's not what he looks like."
 
