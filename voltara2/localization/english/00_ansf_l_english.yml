 game_concept_ansf_pinned:0 "Pinned"
 game_concept_ansf_pinned_desc:0 "You can pin characters to have them evaluated as potential relatives, even if dead.\n\nThey won't appear, however, if they've been dead #EMP too#! long... and, for women, that also includes the years since they were fertile while alive, if they died after losing fertility.\n\nIf you're already seeing the list of potential matches, adding new pins won't make them appear until you back out to the previous menu and return."
 
 ansf_select_dynasty_connection:0 "Select a character to connect to"
 ansf_select_dynasty_info:0 "Potential connections are selected from among all current rulers,\nyour title's previous holder (if one exists) and [ansf_pinned|E|l] characters\nwho are of the same culture and religion and of suitable age\n\n[bastard|E] results if the character (or their father, if a sibling) has\nspouses (including former or dead) but none who can also be\n[CharYourHerHis(GetPlayer.MakeScope.Var('ansf_family_character').GetCharacter)] parent or when dealing with a ruler where [CharYouSheHe(GetPlayer.MakeScope.Var('ansf_family_character').GetCharacter)]\nwould become (or should have been) their heir.n\n[legitimized_bastard|E] can result if connecting to a sibling who [CharYouSheHe(GetPlayer.MakeScope.Var('ansf_family_character').GetCharacter)]\nwould not displace but whose father has/had spouses who cannot\nbe [CharYourHerHis(GetPlayer.MakeScope.Var('ansf_family_character').GetCharacter)] mother"
