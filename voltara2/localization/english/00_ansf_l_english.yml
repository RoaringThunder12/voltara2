 ansf.reroll.paramaters:0 "Generates a new character according to the parameters you've set"
 ansf.join.dynasty.tooltip:0 "@warning_icon! #X [target.GetShortUINameNoTooltipNoFormat|U] and [CharYourHerHis(target)] house will join the [ansf_family_member.GetDynasty.GetBaseName] dynasty, necessary in order to not break the dynasty tree display. The dynasty can be customized again, if you wish, after you return to the game. #!"
 ansf.existing.dynasty.tooltip:0 "You will need to select which dynasty [target.GetShortUINamePossessiveNoTooltipNoFormat] [ansf_family_member.GetMotherFather] comes from. using a selection of rulers that match [ansf_family_member.GetHerHis] current culture and faith\n\n@warning_icon! #X This version of the character will not be used! A new character of the exact same age ([ansf_family_member.GetAge]) will be generated once [ansf_family_member.GetHerHis] dynasty is selected #!"
 ansf.noble.title.warning.tooltip:0 "\n\n #X Since [CharYouSheHe(target)] [CharHaveHas(target)] a noble family title, you will not be able to join [CharYourHerHis(target)] [ansf_family_member.Custom('MotherFatherPossessive')] new dynasty once it is selected. #!"
 
 ansf.mother.event.t:0 "[target.GetHerHisMy|U] Mother"
 ansf.mother.event.d:0 "I step out into the gardens, wondering if my mother is there.\n\nI pause as I pick out the soft words of a woman having a discussion with a companion, and I hesitate. I have known her all my life, but how well do I truly know her? How well does anyone? The idea she had an entire life before I even existed seems unfathomable, as her family has been the center of her existence just as she has been the center of ours."
 ansf.mother.event.existing.bastard.d:0 "My mother is a complicated woman. The whispers of how she was once [ROOT.Char.GetFather.GetTitledFirstNamePossessiveNoTooltip] lover have long quieted, even if they have never entirely ceased, but she's so much more than the rumors would have you believe. I will always remember her brilliant smile, there to greet me the moment I was born, even if others choose to remember only the more sordid stories.\n\nWhat's far more important than any of that is that she was always there for her family."
 ansf.mother.event.other.d:0 "There are many things that can be said about [target.GetTitledFirstNamePossessiveNoTooltip] mother, it's true.\n\nShe is a woman who has spawned many rumours in [target_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], each a contradiction to the other. I suppose that is true of anyone who holds strong opinions, and her opinions regarding her [target.Custom('GetDaughterSon')] are the strongest of them all. Perhaps the time has come to explore who she really is."
 ansf.yes.mom.lowborn:0 "That's [Select_CString( target.IsLocalPlayer, 'Mother', 'her' )], married to [Select_CString( target.IsLocalPlayer, 'Father', target.GetFather.GetTitledFirstNameNoTooltip )] long before he took his title."
 ansf.yes.mom:0 "That's Mother for you."
 ansf.yes.mom.other:0 "That is indeed her."
 ansf.yes.mom.house:0 "[Select_CString( target.IsLocalPlayer, 'Mother', 'She' )] was actually the true founder of [Select_CString( target.IsLocalPlayer, 'our', target.GetHerHis )] dynasty."
 ansf.yes.mom.relative:0 "There's much more to [target.GetHerHisMy] mother's family..."
 ansf.no.mom:0 "Maybe another widow, but not Mother."
 ansf.no.mom.other:0 "No, that's not what she looks like."
 ansf.no.mom.regenerate:0 "Let me tell you what she was #EMP really#! like..."
 
 ansf.family.event.t:0 "The Family of [target.GetTitledFirstNameNoTooltip]"
 ansf.family.event.d:0 "Returning to the throne room, I lose myself in thought.\n\nI can hear the muffled rush of servants and the murmur of our guests just down the hall, and so my thoughts shift to the rest of my family..."
 ansf.family.event.other.d:0 "My thoughts turn to the remainder of [target.GetTitledFirstNamePossessiveNoTooltip] family.\n\nAre there others I haven't already considered? My advisors say that's the case, but none of them can recall any names, so I'm left to wonder if I have, in fact, recalled them all..."
 ansf.mother.yes:0 "I should check on my mother."
 ansf.mother.yes.other:0 "Of course! How can I forget [target.GetHerHis] mother?"
 ansf.add.mother:0 "You must reflect on [target.GetShortUINamePossessiveNoTooltipNoFormat] mother before other family members"
 ansf.wife.yes:0 "I should go check on my wife."
 ansf.husband.yes:0 "I should go check on my husband."
 ansf.spouse.other.yes:0 "[target.GetTitledFirstNameNoTooltip] is married, isn't [target.GetSheHe]?"
 ansf.add.spouse:0 "Add an appropriate spouse to [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip )] family"
 ansf.brother.yes:0 "My brother deserves some of my attention now."
 ansf.brother.yes.another:0 "I have another brother who deserves my attention."
 ansf.brother.other.yes:0 "[target.GetTitledFirstNameNoTooltip] has a brother, does [target.GetSheHe] not?"
 ansf.brother.other.yes.another:0 "I believe there is another brother to consider."
 ansf.add.brother:0 "Add a brother to [target.GetShortUINamePossessiveNoTooltipNoFormat] family"
 ansf.sister.yes:0 "I wonder how my sister is doing?"
 ansf.sister.other.yes:0 "Ah, yes. There is a sister to consider."
 ansf.sister.yes.another:0 "I have another sister who deserves my attention."
 ansf.sister.other.yes.another:0 "[target.GetTitledFirstNameNoTooltip] has more than one sister, I believe."
 ansf.add.sister:0 "Add a sister to [target.GetShortUINamePossessiveNoTooltipNoFormat] family"
 ansf.halfbrother.yes:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [CharHaveHas(target)] a half-brother, as well."
 ansf.halfbrother.another.yes:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [CharHaveHas(target)] another half-brother, as well."
 ansf.add.halfbrother:0 "Add a half-brother to [target.GetShortUINamePossessiveNoTooltipNoFormat] family"
 ansf.halfsister.yes:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [CharHaveHas(target)] a half-sister, as well."
 ansf.halfsister.another.yes:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [CharHaveHas(target)] another half-sister, as well."
 ansf.add.halfsister:0 "Add a half-sister to [target.GetShortUINamePossessiveNoTooltipNoFormat] family"
 ansf.child.yes:0 "I have a child to consider."
 ansf.child.another.yes:0 "I have another child."
 ansf.add.child:0 "Add a child (gender will be chosen)"
 ansf.family.no:0 "#emphasis It is just us now.#"
 ansf.family.no.other:0 "#emphasis That's everyone.#"
 ansf.add.done:0 "Finish family reflection and add no additional members"
 ansf.goto.father.fate.tt:0 "Onto the family news..."
 asnf.new.courtiers.tt:0 "[target.GetFirstNamePossessiveNoTooltip] Family Arrives"
 
 ansf.brother.event.t:0 "[target.GetHerHisMy|U] Brother"
 ansf.sister.event.t:0 "[target.GetHerHisMy|U] Sister"
 ansf.brother.event.d:0 "I make my way to the training yard, knowing my brother will be there.\n\nRounding a corner, I spot someone the size of my brother, back to me. Certain that it must be him, I approach."
 ansf.brother.event.other.d:0 "I'm finally reminded that [target.GetTitledFirstNameNoTooltip] has a brother, possibly at court with [target.GetHerHim] in [target_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. I wave over my chancellor to fill in the details on this mystery man. Who knows? He might one day be someone of importance."
 ansf.sister.event.d:0 "I step into the great room, watching as several servants briskly move about, eyeing me in anticipation.\n\nStaring into the fire, I notice that the room suddenly gets quiet. A woman has entered, one with the stature and bearing of my sister."
 ansf.sister.event.other.d:0 "I'm finally reminded that [target.GetTitledFirstNameNoTooltip] has a sister, possibly at court with [target.GetHerHim] in [target_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]. I wave over my chancellor to fill in the details on this mystery woman. At the very least, it would be good to know her name if I run into her at a social function."
 ansf.yes.sibling:0 "That is indeed [target.GetHerHisMy] [ansf_family_member.Custom('SisterBrother')], a proud member of [Select_CString( target.IsLocalPlayer, 'our', target.GetHerHis )] family."
 ansf.redosibling:0 "No, that certainly is not [target.GetHerHisMy] [ansf_family_member.Custom('SisterBrother')]."
 ansf.no.sibling:0 "I must be thinking of someone else."
 ansf.sibling.none:0 "Return to the family screen without adding a [ansf_family_member.Custom('SisterBrother')]"
 
 ansf.family.news.t:0 "The Family News"
 ansf.family.news.desc:0 "Having finally gathered everyone together, I inform them that I have some news.\n\nToday marks a new day for us, one where everything in [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] is likely to change, perhaps for the better and perhaps not. They wait in breathless anticipation, some anxiously looking around for anyone who might be missing from among those assembled..."
 ansf.househead.dead:0 ""[dead_parent.Custom('MotherFather')|U] is dead.""
 ansf.househead.dead.tt:0 "#emphasis You will be asked to determine how your [dead_parent.Custom('MotherFather')] died...#"
 ansf.both.dead:0 ""Mother and Father have been in a terrible accident...""
 ansf.new.househead:0 ""I am taking over as head of House [ROOT.Char.GetHouse.GetBaseNameNoTooltip].""
 ansf.nothing.new:0 ""No no, it's fine! Nothing bad has happened!""
 ansf.nothing.new.tt:0 "#emphasis You only meant to tell them you have big plans to come...#"
 ansf.go.back:0 "#emphasis Wait, I have more family!#"
 ansf.go.back.tooltip:0 "Add more family members"
 
 ansf.death.event.t:0 "Will [dead_parent.GetHerHis|U] Story be Told?"
 ansf.death.event.d:0 "For better or for worse, my [dead_parent.Custom('MotherFatherPossessive')|l] time in the [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] has come to an end. Today, I take up the mantle as leader of our house and family. I hope I am up for the coming storm...\n\nBut how will I tell the end of my [dead_parent.Custom('MotherFatherPossessive')] story? Will history remember [dead_parent.GetHerHim]?"
 ansf.death.vanish:0 "I doubt we'll ever know what happened to [dead_parent.GetHerHim], honestly."
 ansf.death.vanish.tooltip:0 "#emphasis Your [dead_parent.Custom('MotherFather')|l] vanishes from the realm, never to be seen again...#"
 ansf.death.random:0 "[dead_parent.Custom('MotherFatherPossessive')|U] death was as sudden as it was unexpected."
 ansf.death.random.tooltip:0 "#emphasis Your [dead_parent.Custom('MotherFather')|l] dies unexpectedly!#"
 ansf.death.murder:0 "I did what had to be done. For the family."
 ansf.death.murder.tooltip:0 "#emphasis You murdered your [dead_parent.Custom('MotherFather')|l] in secret!#"
 ansf.death.mysterious:0 "#EMP Someone#! murdered [dead_parent.GetHerHim], and I intend to find out who!"
 ansf.death.mysterious.tooltip:0 "#emphasis Your [dead_parent.Custom('MotherFather')|l] is murdered by someone unknown!#"
 ansf.death.none:0 "No! [dead_parent.Custom('MotherFather')|U] may yet still live!"
 ansf.death.none.tooltip:0 "#emphasis Your [dead_parent.Custom('MotherFather')] is deathly ill, but may yet pull through#"
 
 ansf.existing.event.t:0 "[target.GetHerHisMy|U] [ansf_family_member.GetMotherFather|U]'s Family"
 ansf.existing.event.d:0 "My [ansf_family_member.GetMotherFather] has spoken often of [ansf_family_member.GetHerHis] family in the past, sometimes fondly and other times... less so. Still, they are [ansf_family_member.GetHerHis] blood and therefore also my own."
 ansf.existing.event.other.d:0 "I'm told that [target.GetTitledFirstNameNoTooltip] has spoken often of [target.GerHerHis] [ansf_family_member.GetMotherFather]'s family in the past, sometimes fondly and other times... less so. I'll make some inquiries to get to the bottom of the matter. How well connected is [target.GetSheHe]?"
 ansf.yes.existing1.pibling:0 "[ansf_family_member.GetSheHe|U] is [ROOT.Var('potential_relative_1').Char.GetFullNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')]."
 ansf.yes.existing1.grandparent:0 "[ansf_family_member.GetSheHe|U] is [ROOT.Var('potential_relative_1').Char.GetFullNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')]." 
 ansf.no.existing:0 "#emphasis No, perhaps I'm misremembering...#"
 ansf.yes.existing1.grandparent.tt:0 "Create [CharYourHerHis(target)] [ansf_family_member.GetMotherFather] as a [ansf_family_member.Custom('GetDaughterSon')] of [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing1.pibling.tt:0 "Create [CharYourHerHis(target)] [ansf_family_member.GetMotherFather] as a [ansf_family_member.Custom('SisterBrother')] to [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing1.culture.tt:0 " #X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather] will be [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetCulture.GetNameNoTooltip]! #!"
 ansf.yes.existing1.faith.tt:0 " #X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather] will be a [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetFaith.GetAdherentNameNoTooltip]! #!"
 ansf.yes.existing.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather] will be a [bastard|E]! #!"
 ansf.yes.existing.legit.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather] will be a [legitimized_bastard|E]! #!"

 ansf.existing.event2.t:0 "[target.GetHerHisMy|U] [ansf_family_member.GetMotherFather|U]"
 ansf.existing.grandparent.d:0 "I suppose [ansf_family_member.GetMotherFather|U] will always be known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. I don't know if that bothers [ansf_family_member.GetHerHim], but I do know how proud [ansf_family_member.GetSheHe] is of my achievements."
 ansf.existing.grandparent.other.d:0 "I suppose [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather] will always be known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. I wonder if that bothers [ansf_family_member.GetHerHim]?"
 ansf.existing.pibling.d:0 "I suppose [ansf_family_member.GetMotherFather|U] will always be known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one who ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. I don't know if that bothers [ansf_family_member.GetHerHim], but I do know for a fact how proud [ansf_family_member.GetSheHe] is of my achievements."
 ansf.existing.pibling.other.d:0 "I suppose [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather] will always be known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one who ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. I wonder if that bothers [ansf_family_member.GetHerHim]?"
 
 ansf.yes.existing.take.dynasty:0 "That's [ansf_family_member.GetHerHim], and it's [ansf_family_member.GetHerHis] dynasty [Select_CString( target.IsLocalPlayer, 'I', target.GetTitledFirstNameNoTooltip )] now [Select_CString( target.IsLocalPlayer, 'claim', 'claims' )]."
 ansf.take.dynasty.tooltip:0 "@warning_icon! #X [target.GetShortUINameNoTooltipNoFormat|U] and [CharYourHerHis(target)] house will join the [ansf_family_member.GetHouse.GetBaseName] house in the [ansf_family_member.GetDynasty.GetBaseName] dynasty.[AddLocalizationIf( target.IsLocalPlayer, 'ansf.not.head.house.warning.tt' )] #!"
 ansf.not.head.house.warning.tt:0 " This may mean you might not start the game as the house or dynasty head!"
 ansf.yes.existing.proceed:0 "That's how I will always remember [ansf_family_member.GetHerHim], yes."
 ansf.yes.existing.proceed.other:0 "I believe that's [ansf_family_member.GetHerHim], yes."
 ansf.no.existing.reroll:0 "I'm not sure if that's an accurate portrayal of [ansf_family_member.GetHerHim]."
 ansf.no.existing.regenerate:0 "Let me tell you what [ansf_family_member.GetSheHe] was #EMP really#! like..."
 ansf.reroll.existing:0 "Generates a new character with slightly different DNA"
