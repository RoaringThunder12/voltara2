 ansf.no.existing.leave.tt:0 "Go back and start over, abandoning this character entirely"
 
 ansf.me.existing.event.t:0 "[target.GetHerHisMy|U] Family"
 ansf.me.existing.event.d:0 "The servants here in [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] whisper about my larger family in hushed tones, sometimes with awe and sometimes with fear. Since I've assumed my title, they've not often visited, and perhaps that's for the best. I have my own destiny to achieve, after all, and it will be on my own terms."
 ansf.other.ruler.existing.event.d:0 "The servants in [target.GetPrimaryTitle.GetNameNoTierNoTooltip] whisper about [target.GetTitledFirstNamePossessiveNoTooltip] family in hushed tones. [target.GetSheHe|U] supposedly isn't the only ruler in [target.GetHerHis] dynasty, and one has to wonder if [target.GetSheHe] feels overshadowed by them. Either way, it makes sense that it would cause so many rumours."
 ansf.other.existing.event.d:0 "The servants in [target_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] whisper about [target.GetTitledFirstNamePossessiveNoTooltip] family in hushed tones. What's [target.GetHerHis] connection to them? Why does [target.GetSheHe] so rarely speak of them? It makes sense that it would spawn so many rumours."
 ansf.yes.me.existing1.pibling:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [Select_CString( target.IsLocalPlayer, 'am', 'is' )] [ROOT.Var('potential_relative_1').Char.GetFullNamePossessiveNoTooltip] [target.Custom('SisterBrother')]."
 ansf.yes.me.existing1.grandparent:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe )|U] [Select_CString( target.IsLocalPlayer, 'am', 'is' )] [ROOT.Var('potential_relative_1').Char.GetFullNamePossessiveNoTooltip] [target.Custom('GetDaughterSon')]."
 ansf.yes.me.existing.bastard.tt:0 "@warning_icon! #X Any created parent will automatically have the [GetTrait('fornicator').GetName( GetNullCharacter )] trait, and all created full siblings will be younger than [target.GetShortUINameNoTooltipNoFormat], share their mother's house, and have the [GetTrait('bastard').GetName( GetNullCharacter )] trait."
 ansf.yes.me.existing.bothparents.tt:0 "@warning_icon! #X If you create any additional full siblings, they will automatically be younger than [target.GetShortUINameNoTooltipNoFormat][AddLocalizationIf( target.IsRuler, 'ansf.cannot.inherit.tt' )]. If one of their parents is a ruler, they will be a part of that parent's court.#!"
 ansf.yes.me.existing.oneparent.tt:0 "@warning_icon! #X If you create [target.GetShortUINamePossessiveNoTooltipNoFormat] missing parent, they (and any full siblings) will not be part of [CharYourHerHis(target_liege)] court. All created full siblings will be younger than [CharYouHerHim(target)][AddLocalizationIf( target.IsRuler, 'ansf.cannot.inherit.tt' )]. #!"
 ansf.cannot.inherit.tt:0 " and cannot have inherited a title"
 ansf.no.me.existing:0 "#emphasis No, perhaps I'm misremembering...#"
 ansf.no.me.existing.tt:0 "Return to the previous screen"
 
 ansf.traits.event.t:0 "Rumors about [ansf_family_member.GetTitledFirstNameNoTooltip]"
 ansf.traits.event.d:0 "In the [ansf_family_member.GetAge] winters [ansf_family_member.GetFirstNameNoTooltip] has seen, [ansf_family_member.GetSheHe] has become the center of many rumors[AddLocalizationIf( Or( target.IsLocalPlayer, target_liege.IsLocalPlayer ), ' here' )] in [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]... yet how many truly know [ansf_family_member.GetHerHim]? Perhaps I can set the record straight."
 ansf.traits.child.event.d:0 "[ansf_family_member.GetFirstNameNoTooltip] is only [ansf_family_member.GetAge], but [ansf_family_member.GetSheHe] has already become the talk of many[AddLocalizationIf( target.IsLocalPlayer, ' here' )] in [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. I doubt, however, there are many who know the [ansf_family_member.Custom('GetLassLad')] [Select_CString( target.IsLocalPlayer, 'quite as well as I do', 'particularly well' )]. Perhaps I should set them straight?"
 ansf.done:0 "#emphasis That sounds about right...#"
 ansf.done.tooltip:0 "Finalize [ansf_family_member.GetTitledFirstNameNoTooltip]"
 
 ansf.halfsibling.event.t:0 "A Complicated Family..."
 ansf.halfsibling.event.d:0 "[CharMyHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] is the [halfsibling.Custom('GetDaughterSon')] of which parent?"
 ansf.halfsibling.father:0 "[halfsibling.GetSheHe|U] is [target.GetHerHisMy] father's [halfsibling.Custom('GetDaughterSon')] by another woman."
 ansf.halfsibling.mother:0 "[halfsibling.GetSheHe|U] is [target.GetHerHisMy] mother's [halfsibling.Custom('GetDaughterSon')] by another man."
 ansf.halfsibling.nevermind:0 "#emphasis Perhaps I'm mistaken...#"
 ansf.halfsibling.nevermind.tooltip:0 "Skip creating the half-[halfsibling.Custom('SisterBrother')] and return to the family screen"
 
 ansf.halfsibling.nature.event.t:0 "[target.GetHerHisMy|U] [ansf_bastard_parent.Custom('MotherFatherPossessive')|U] [halfsibling.Custom('GetDaughterSon')|U]"
 ansf.halfsibling.nature.event.d:0 "Obviously, this is [target.GetHerHisMy] [ansf_bastard_parent.Custom('MotherFatherPossessive')] [halfsibling.Custom('GetDaughterSon')], but what was the nature of [ansf_bastard_parent.GetHerHis] relationship to the [ansf_bastard_otherparent.GetMotherFather]?"
 ansf.halfsibling.exspouse:0 "[ansf_bastard_otherparent.GetSheHe|U] was [ansf_bastard_parent.GetHerHis] ex-[ansf_bastard_otherparent.Custom('WifeHusband')]."
 ansf.halfsibling.exspouse.tt:0 "Create a new character who will be [CharYourHerHis(target)] [ansf_bastard_parent.Custom('MotherFatherPossessive')] former [ansf_bastard_otherparent.Custom('WifeHusband')]\n"
 ansf.halfsibling.expouse.tt.warning:0 "@warning_icon! #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will need to be older than [CharYouHerHim(target)] and any of [CharYourHerHis(target)] full siblings. Any future full siblings you create will need to be younger than this half-[halfsibling.Custom('SisterBrother')] or any of [halfsibling.GetHerHis] full siblings. The created ex-[ansf_bastard_otherparent.Custom('WifeHusbandPossessive')] age will be restricted in that [ansf_bastard_otherparent.GetSheHe] must be old enough to have had a [halfsibling.Custom('GetDaughterSon')] of this age #!"
 ansf.halfsibling.concubine:0 "She was his concubine."
 ansf.halfsibling.concubine.tt:0 "Create a new character who will be [CharYourHerHis(target)] [ansf_bastard_parent.Custom('MotherFatherPossessive')] concubine"
 ansf.halfsibling.lover:0 "[ansf_bastard_otherparent.GetSheHe|U] was [ansf_bastard_parent.GetHerHis] lover, who [ansf_bastard_parent.GetSheHe] never married."
 ansf.halfsibling.lover.tt:0 "Create a new character who will be [CharYourHerHis(target)] half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather]\n"
 ansf.halfsibling.lover.tt.warning:0 "@warning_icon! #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will be created as a bastard (if permitted by faith), and both [CharYourHerHis(target)] [ansf_bastard_parent.GetMotherFather] and the new character will gain either the [GetTrait('adulterer').GetName( GetNullCharacter )] or [GetTrait('fornicator').GetName( GetNullCharacter )] trait, as appropriate #!"
 ansf.halfsibling.findexisting:0 "This was another [ansf_bastard_otherparent.GetWomanMan] [ansf_bastard_parent.GetSheHe] had a relationship with."
 ansf.halfsibling.findexisting.tt:0 "You will need to select an existing character who will serve as your half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather]"
 ansf.halfsibling.existing:0 "This is another child [ansf_bastard_parent.GetSheHe] had with [ROOT.Var('existing_parent').Char.GetShortUINameNoTooltipNoFormat]."
 ansf.halfsibling.existing.first:0 "This is a [halfsibling.Custom('GetDaughterSon')] [ansf_bastard_parent.GetSheHe] had with [ROOT.Var('existing_parent').Char.GetShortUINameNoTooltipNoFormat]."
 ansf.halfsibling.existing.tt:0 "No new character will be created, as [GetPlayer.MakeScope.Var('existing_parent').Char.GetShortUIName] will be set as your half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather]"
 
 ansf.halfsibling.parent.t:0 "[target.GetHerHisMy|U] Half-[halfsibling.Custom('SisterBrotherPossessive')|U] [ansf_bastard_otherparent.GetMotherFather|U]"
 ansf.halfsibling.parent.d.concubine:0 "[target.GetHerHisMy|U] half-[halfsibling.Custom('SisterBrother')] is no bastard, as [halfsibling.GetSheHe] was born to [target.GetHerHisMy] father's concubine. It was a long time ago, but I'm trying to remember what she was like..."
 ansf.halfsibling.parent.d.former.spouse:0 "[target.GetHerHisMy|U] half-[halfsibling.Custom('SisterBrother')] is no bastard, as [halfsibling.GetSheHe] was born from [target.GetHerHisMy] [ansf_bastard_parent.Custom('MotherFatherPossessive')] previous marriage. Now I need to stop and think what [ansf_bastard_parent.GetHerHis] [ansf_bastard_otherparent.Custom('WifeHusband')] was like..."
 ansf.halfsibling.parent.d.lover:0 "[target.GetHerHisMy|U] half-[halfsibling.Custom('SisterBrother')] is the product of a love affair between [halfsibling.GetHerHis] [ansf_bastard_parent.GetMotherFather] and another [ansf_bastard_otherparent.GetWomanMan]... what was [ansf_bastard_otherparent.GetHerHis] name? I'm trying hard to remember what [ansf_bastard_otherparent.GetSheHe] was like..."
 ansf.halfsibling.parent.yes.dead:0 "That's [ansf_bastard_otherparent.GetHerHim], though [ansf_bastard_otherparent.GetSheHe]'s long dead now."
 ansf.halfsibling.parent.dead.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be killed off once your half-[halfsibling.Custom('SisterBrother')]'s character is finalized\n"
 ansf.halfsibling.parent.yes.lover.yes:0 "That's [ansf_bastard_otherparent.GetHerHim]. They're lovers still, insofar as I know."
 ansf.halfsibling.parent.lover.remain.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be set as a (public, not secret) lover to [ansf_bastard_parent.GetShortUINameNoTooltipNoFormat] and added as a courtier once your half-[halfsibling.Custom('SisterBrother')]'s character is finalized\n"
 ansf.halfsibling.parent.yes.lover.no:0 "That's [ansf_bastard_otherparent.GetHerHim]. [ansf_bastard_otherparent.GetSheHe|U] remains at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], but their affair is long over."
 ansf.halfsibling.parent.yes.remain:0 "That's [ansf_bastard_otherparent.GetHerHim], and [ansf_bastard_otherparent.GetSheHe] remains at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] still."
 ansf.halfsibling.parent.remain.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be added as a courtier once your half-[halfsibling.Custom('SisterBrother')]'s character is finalized\n"
 ansf.halfsibling.parent.yes.relative:0 "That's [ansf_bastard_otherparent.GetHerHim]. [ansf_bastard_otherparent.GetSheHe|U] has since returned to [ansf_bastard_otherparent.GetHerHis] [ansf_bastard_otherparent.Custom2('LMF_RelationToMePossessive', SCOPE.sC('actual_relative'))] court."
 ansf.halfsibling.parent.relative.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be added as [actual_relative.GetTitledFirstNamePossessive] courtier once your half-[halfsibling.Custom('SisterBrother')]'s character is finalized\n" 
 ansf.halfsibling.parent.connect:0 "[ansf_bastard_otherparent.GetSheHe|U]'s actually part of a larger family..."
 ansf.existing.other.parent.dynasty.tt:0 "You will need to select which dynasty [ansf_bastard_otherparent.GetSheHe] comes from, using a selection of rulers that match [ansf_bastard_otherparent.GetHerHis] current culture and faith\n\n@warning_icon! #X This version of [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather] will not be used! A new character of the same age ([ansf_bastard_otherparent.GetAge]) will be generated once [ansf_bastard_otherparent.GetHerHis] dynasty is selected #!"
 ansf.halfsibling.parent.redo:0 "No, that doesn't look like [ansf_bastard_otherparent.GetHerHim] at all."
 ansf.halfsibling.parent.regenerate:0 "Let me tell you what [ansf_bastard_otherparent.GetSheHe] was #EMP really#! like..."
 
 ansf.halfsibling.parent.connect.t:0 "[target.GetHerHisMy|U] Half-[halfsibling.Custom('SisterBrotherPossessive')|U] [ansf_bastard_otherparent.Custom('MotherFatherPossessive')|U] Family"
 ansf.halfsibling.parent.connect.d:0 "As little as I know of [target.GetHerHisMy] half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather], I know even less of [ansf_bastard_otherparent.GetHerHis] family. I'm told [ansf_bastard_otherparent.GetHerHis] family is influential, though how [Select_CString( target.IsLocalPlayer, 'my', target.GetTitledFirstNamePossessiveNoTooltip )] [ansf_bastard_parent.GetMotherFather] came to be connected to them I'm uncertain."
 ansf.yes.existing1.other.grandparent.tt:0 "Create the character as a [ansf_family_member.Custom('GetDaughterSon')] of [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing1.other.pibling.tt:0 "Create the character as a [ansf_family_member.Custom('SisterBrother')] to [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing.other.bastard.tt:0 "#X [ansf_family_member.GetSheHe|U] will be a [bastard|E]! #!"
 ansf.yes.existing.other.legit.bastard.tt:0 "#X [ansf_family_member.GetSheHe|U] will be a [legitimized_bastard|E]! #!"
 
 ansf.halfsibling.parent.grandparent.d:0 "Ah, yes. [target.GetHerHisMy|U] half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip], which is undoubtedly how [ansf_family_member.GetSheHe] ended up as [target.GetHerHisMy] [ansf_bastard_parent.Custom('MotherFatherPossessive')] [ROOT.Char.Custom2('otherparent_relation_type', SCOPE.sC('ansf_family_member'))]."
 ansf.halfsibling.parent.pibling.d:0 "Ah, yes. [target.GetHerHisMy|U] half-[halfsibling.Custom('SisterBrotherPossessive')] [ansf_bastard_otherparent.GetMotherFather] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but one who didn't inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip] and who isn't in line for any other titles, which is undoubtedly how [ansf_family_member.GetSheHe] ended up as [target.GetHerHisMy] [ansf_bastard_parent.Custom('MotherFatherPossessive')] [ROOT.Char.Custom2('otherparent_relation_type', SCOPE.sC('ansf_family_member'))]."
 ansf.halfsibling.notculture.tt:0 " #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will be [ansf_dominant_parent.GetCulture.GetNameNoTooltip] #!"
 ansf.halfsibling.notfaith.tt:0 " #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will be [ansf_dominant_parent.GetFaith.GetAdherentNameNoTooltip] #!"
 ansf.halfsibling.notdynasty.tt:0 " #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will be part of the [ansf_dominant_parent.GetDynasty.GetBaseName] dynasty #!"
 ansf.halfsibling.lowborn.tt:0 " #X [CharYourHerHis(target)|U] half-[halfsibling.Custom('SisterBrother')] will be lowborn #!" 
 
 ansf.halfsibling.event3.t:0 "[target.GetHerHisMy|U] Half-[halfsibling.Custom('SisterBrother')|U]"
 ansf.halfbrother.event.d:0 "I make my way to the training yard, knowing my half-brother will be there.\n\nI slow down as I pick out a familiar voice. Rounding a corner, I spot someone the size of my half-brother, back to me. Surely, it must be him. As I approach, he turns and waits for me to speak."
 ansf.halfsister.event.d:0 "I step into the great room, watching as several servants briskly move about, eyeing me in anticipation.\n\nStaring into the fire, I spot a woman with the same stature as my half-sister and step towards her. Hearing my approach, she turns, smiling, and waits for me to speak."
 ansf.halfsibling.event3.d:0 "Now that we've ascertained exactly who the parents are, it should be a simple matter to track down [target.GetTitledFirstNamePossessiveNoTooltip] half-[halfsibling.Custom('SisterBrother')]. Who is [halfsibling.GetSheHe]? What is their current relationship? I must know."
 ansf.halfsibling.event3.proceed:0 "That's [ansf_family_member.GetHerHim], raised as a part of [Select_CString( target.IsLocalPlayer, 'our', target.GetTitledFirstNamePossessiveNoTooltip )] family."
 ansf.halfsibling.event3.redo:0 "That doesn't really look like [ansf_family_member.GetHerHim] at all."
 ansf.halfsibling.event3.redo.tooltip:0 "Re-generate [target.GetShortUINamePossessiveNoTooltipNoFormat] half-[ansf_family_member.Custom('SisterBrother')] without favoring either parent's DNA"
 ansf_make_former_spouse.tt:0 "[divorcee.GetShortUIName|U] will be considered [divorcer.GetShortUINamePossessive] former [divorcee.GetWifeHusband]"
 
 ansf.2200.t:0 "[Select_CString( target.IsLocalPlayer, 'My', target.GetTitledFirstNamePossessiveNoTooltip)|U] [new_spouse.GetWifeHusband|U]"
 ansf.2200.desc:0 "The servants here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] still whisper about my [new_spouse.GetWifeHusband]. I've yet to determine whether they say good things or bad. Truth be told, the servants are still getting used to [new_spouse.GetHerHim].\n\nNo doubt they are merely curious. They know no more than I did when we were married, which is to say not much at all. Such is how it is for most rulers."
 ansf.2200.other.desc:0 "I'm trying to recall what I remember of [target.GetTitledFirstNamePossessiveNoTooltip] new [new_spouse.GetWifeHusband]. Their marriage was recent, but so quickly arranged it's all become a bit of a blur.\n\nThankfully, the servants here in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] are such terrible gossips it won't take me long to sort out what is truth and what is merely fanciful fiction when it comes to the [new_spouse.GetWomanMan]."
 ansf.spouse.yes.parents:0 "[new_spouse.GetSheHe|U] came to [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] along with family."
 ansf.spouse.parents:0 "Will first create one or both of [CharYourHerHis(target)] [new_spouse.Custom('WifeHusbandPossessive')] parents (who can be connected to existing dynasties) before creating [CharYourHerHis(target)] [new_spouse.GetWifeHusband]."
 ansf.spouse.yes.alone:0 "[new_spouse.GetSheHe|U] came to [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] alone, and I know little of [new_spouse.GetHerHis] lineage."
 ansf.spouse.other.yes.alone:0 "[new_spouse.GetSheHe|U] apparently came to [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] alone."
 ansf.spouse.alone:0 "Will create a [new_spouse.GetWifeHusband], either with no parents or connected directly to an existing dynasty (if connected, you will not be able to create any 'missing' parents)."
 ansf.spouse.yes.lowborn.wife:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)|U] married a lowborn [ROOT.Char.GetCulture.GetNameNoTooltip] woman for her beauty and talent."
 ansf.spouse.yes.lowborn.husband:0 "[Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)|U] married a lowborn [ROOT.Char.GetCulture.GetNameNoTooltip] knight for his ability and physique."
 ansf.spouse.lowborn.wife:0 "Will create a lowborn wife of [CharYourHerHis(target)] faith and culture with the [GetTrait('beauty_good_2').GetName( new_spouse.Self )] trait and decent skills, but no family."
 ansf.spouse.lowborn.husband:0 "Will create a lowborn [target.GetFaith.GetAdjective] husband of [target.GetCulture.GetNameNoTooltip] culture with the [GetTrait('physique_good_2').GetName( new_spouse.Self )] trait and decent skills."
 ansf.spouse.no:0 "#emphasis Perhaps I will find [new_spouse.GetHerHim] later...#"
 ansf.spouse.other.no:0 "#emphasis I have better things to do than listen to gossip.#"
 ansf.spouse.none:0 "Return to the family screen without adding a [new_spouse.GetWifeHusband]"
 ansf.spouse.other.none:0 "Opt out of the spouse creation process completely"
 
 ansf.2201.t:0 "[target.GetHerHisMy|U] Father-in-Law?"
 ansf.2201.desc:0 "It occurs to me that my [new_spouse.GetWifeHusband] might be out hunting with [new_spouse.GetHerHis] father, in the grounds just outside the [ROOT.Char.Custom('FortifiedBuilding')]. It's a short ride into the forest and, while I don't spot my [new_spouse.GetWifeHusband] anywhere, I do spot a man who I suspect is my father-in-law, though it's difficult to tell from this distance."
 ansf.2201.other.desc:0 "Some might consider it strange that a new [new_spouse.Custom('WifeHusbandPossessive')] parents would join [new_spouse.GetHerHim] at court, but it's not strange at all.\n\nAccording to what I've heard, [target.GetTitledFirstNamePossessiveNoTooltip] new father-in-law considered the marriage an opportunity. Perhaps at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], he will find a place to fulfill his ambitions."
 ansf.spouse.father.yes:0 "That's definitely him."
 ansf.spouse.will.have.age.range:0 "#italic [CharYourHerHis(target)|U] [new_spouse.GetWifeHusband] will have an age range of [EmptyScope.ScriptValue('adulthood_start_age')|+0] to [ruler.MakeScope.ScriptValue('target_spouse_max_age_range_forecast')|+0] #!"
 ansf.spouse.will.join.house:0 "#italic [CharYourHerHis(target)|U] [new_spouse.GetWifeHusband] will be part of the #P [ruler.MakeScope.Var('dominant_in_law').Char.GetDynasty.GetBaseName]#! #italic dynasty #!#!"
 ansf.spouse.will.have.culture:0 "#italic [CharYourHerHis(target)|U] [new_spouse.GetWifeHusband] will be #P [ruler.MakeScope.Var('dominant_in_law').Char.GetCulture.GetName] #!#!"
 ansf.spouse.will.have.faith:0 "#italic [CharYourHerHis(target)|U] [new_spouse.GetWifeHusband] will be #P [ruler.MakeScope.Var('dominant_in_law').Char.GetFaith.GetAdherentName] #!#!"
 ansf.spouse.father.existing:0 "No, [target.GetHerHisMy] father-in-law comes from a larger family."
 ansf.existing.spouse.parent.dynasty.tt:0 "You will need to select which dynasty [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] [ansf_family_member.GetMotherFather]-in-law comes from, using a selection of rulers that match [ansf_family_member.GetHerHis] current culture and faith\n\n@warning_icon! #X This version of [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] [ansf_family_member.GetMotherFather]-in-law will not be used! A new character of the same age ([ansf_family_member.GetAge]) will be generated once [ansf_family_member.GetHerHis] dynasty is selected #!"
 ansf.spouse.father.redo.same.both:0 "I think not. [new_spouse.GetHerHis|U] [ansf_family_member.GetMotherFather] is [target.GetCulture.GetNameNoTooltip] and a [target.GetFaith.GetAdherentNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]."
 ansf.spouse.father.redo.same.faith:0 "I think not. [new_spouse.GetHerHis|U] [ansf_family_member.GetMotherFather] is a [target.GetFaith.GetAdherentNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]."
 ansf.spouse.father.redo.same.culture:0 "I think not. [new_spouse.GetHerHis|U] [ansf_family_member.GetMotherFather] is [target.GetCulture.GetNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]."
 ansf.reroll.paramaters.same:0 "Generates a new character of both [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] culture and faith, according to the parameters you've set."
 ansf.spouse.redo.father.same.tt:0 "Generates a new character of both [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] culture and faith."
 ansf.spouse.father.redo:0 "Mmm, no. That's clearly someone else."
 ansf.spouse.redo.father.tt:0 "Generates a new character of a random nearby culture either in [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)] culture group or which has a friendly faith."
 ansf.spouse.father.no:0 "#emphasis [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)|U] [Select_CString( target.IsLocalPlayer, 'have', 'has')] no father-in-law to speak of.#"
 ansf.spouse.proceed.spouse.mother.tt:0 "Discards this character. [Select_CString( target.IsLocalPlayer, 'your', target.GetFirstNamePossessiveNoTooltip)|U] [new_spouse.GetWifeHusband] will have no set father. You must, however, generate a mother for [new_spouse.GetHerHim]."
 
 ansf.2202.t:0 "[target.GetHerHisMy|U] Mother-in-Law?"
 ansf.2202.desc:0 "Still looking for my [new_spouse.GetWifeHusband], I come across a gaggle of servants in one of the [ROOT.Char.Custom('FortifiedBuilding')]'s rooms, gathered around a woman seated on one of the divans. Immediately I suspect this woman is none other than my mother-in-law, though the only way to tell is to go inside and... disrupt whatever is going on in there."
 ansf.2202.other.desc:0 "Also accompanying [target.GetTitledFirstNamePossessiveNoTooltip] [new_spouse.GetWifeHusband] to [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] is, of course, [new_spouse.GetHerHis] mother.Apparently, she was a little more reluctant to relocate to court, but for all I know that might be just more rumour. Perhaps she simply intends to ensure that her [new_spouse.Custom('GetDaughterSon')]'s new [target.GetWifeHusband] treats [new_spouse.GetHerHim] well."
 ansf.spouse.mother.yes:0 "That's definitely her."
 ansf.spouse.mother.existing:0 "No, [Select_CString( target.IsLocalPlayer, 'my', target.GetHerHis)] mother-in-law comes from a larger dynasty."
 ansf.spouse.mother.no:0 "#emphasis Sorry, what mother-in-law?#"
 ansf.spouse.proceed.spouse.no.mother.tt:0 "Discards this character. [target.GetShortUINamePossessiveNoTooltipNoFormat|U] [new_spouse.GetWifeHusband] will only have a set father."
 
 ansf.2203.t:0 "[target.GetHerHisMy|U] [new_spouse.GetWifeHusband|U]"
 ansf.2203.desc:0 "Finally, I think to look for my [new_spouse.GetWifeHusband] in our bedchambers. And there [new_spouse.GetSheHe] is, resting. Or, at least, I think it's [new_spouse.GetHerHim]. Lying behind the gauzy curtain that surrounds our marriage bed, it's hard to tell... but who else could it be, here in our private space?"
 ansf.2203.other.desc:0 "And then there is the matter of the [new_spouse.GetWifeHusband] [new_spouse.GetHerselfHimself]. I've asked five different servants about [new_spouse.GetHerHim] and received five completely different descriptions. Perhaps it's time to speak to someone on the council who would have more concrete information..."
 ansf.spouse.final.yes:0 "Yes, that's [target.GetHerHisMy] [new_spouse.GetWifeHusband]."
 ansf.spouse.redo:0 "No no, [new_spouse.GetSheHe] doesn't look like that at all."
 ansf.spouse.redo.spouse.tt:0 "Generate another [new_spouse.GetWifeHusband] with a different random appearance."
 ansf.spouse.cancel:0 "#emphasis Wait, none of this seems correct...#"
 ansf.spouse.cancel.tt:0 "Discard all characters and start over."
 
 ansf.2204.t:0 "[target.GetHerHisMy|U] [ansf_family_member.GetMotherFather|U]-in-Law's Family"
 ansf.2204.desc:0 "As little as I know about my [new_spouse.Custom('WifeHusbandPossessive')] [ansf_family_member.GetMotherFather], I know even less about [new_spouse.GetHerHis] [ansf_family_member.Custom('MotherFatherPossessive')] family. [new_spouse.GetSheHe|U] speaks little of them, only enough to say that [new_spouse.GetHerHis] [ansf_family_member.GetMotherFather] is not on exceptional terms with [ansf_family_member.GetHerHis] kin... which is why [ansf_family_member.GetSheHe] came to [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to be part of my court, I imagine."
 ansf.2204.other.desc:0 "As little as I know about [target.GetTitledFirstNamePossessiveNoTooltip] new [new_spouse.GetWifeHusband], I know even less about [new_spouse.GetHerHis] [ansf_family_member.Custom('MotherFatherPossessive')] family.\n\nAll I'm aware of is that they are influential and that the [ansf_family_member.GetMotherFather] is not on exceptional terms with [ansf_family_member.GetHerHis] kin... no doubt why [ansf_family_member.GetSheHe] elected to join [target.GetTitledFirstNameNoTooltip] at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] in the first place."
 ansf.yes.existing1.inlaw.grandparent.tt:0 "Create [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather]-in-law as a [ansf_family_member.Custom('GetDaughterSon')] of [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing1.inlaw.pibling.tt:0 "Create [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather]-in-law as a [ansf_family_member.Custom('SisterBrother')] to [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing.inlaw.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather]-in-law will be a [bastard|E]! #!"
 ansf.yes.existing.inlaw.legit.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetMotherFather]-in-law will be a [legitimized_bastard|E]! #!"
 ansf.no.inlaw.existing:0 "#emphasis No, perhaps I've got this all wrong...#"
 
 ansf.2205.t:0 "[target.GetHerHisMy|U] [ansf_family_member.GetMotherFather|U]-in-Law"
 ansf.2205.grandparent.desc:0 "I suppose my [ansf_family_member.GetMotherFather]-in-law is primarily known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. That's certainly all I knew of [ansf_family_member.GetHerHim], before we were introduced. Now that [ansf_family_member.GetSheHe] is a part of my court, I imagine I'll get to know [ansf_family_member.GetHerHim] better."
 ansf.2205.pibling.desc:0 "I suppose my [ansf_family_member.GetMotherFather]-in-law is primarily known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one who ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. That's certainly all I knew of [ansf_family_member.GetHerHim], before we were introduced. Now that [ansf_family_member.GetSheHe] is a part of my court, I imagine I'll get to know [ansf_family_member.GetHerHim] better."
 ansf.2205.grandparent.other.desc:0 "Ah, yes. [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather]-in-law is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip], so perhaps it's just as well [ansf_family_member.GetSheHe] ended up at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] along with [ansf_family_member.GetHerHis] [target.Custom('GetDaughterSon')]."
 ansf.2205.pibling.other.desc:0 "Ah, yes. [target.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.GetMotherFather]-in-law is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but one who didn't inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip] and who isn't in line for any other titles, so perhaps it's just as well [ansf_family_member.GetSheHe] ended up at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] along with [ansf_family_member.GetHerHis] [target.Custom('GetDaughterSon')]."
 ansf.yes.inlaw.existing.proceed:0 "That is indeed [ansf_family_member.GetHerHim], yes."
 ansf.reroll.inlaw.existing:0 "Regenerates the character"
 
 ansf.2206.t:0 "[target.GetHerHisMy|U] [new_spouse.GetWifeHusband|U]"
 ansf.2206.desc:0 "I thought to look for my [new_spouse.GetWifeHusband] in our bedchambers, and there [new_spouse.GetSheHe] is, resting. Or, at least, I think it's [new_spouse.GetHerHim]. Lying behind the gauzy curtain that surrounds our marriage bed, it's hard to tell... but who else could it be, here in our private space?"
 ansf.2206.other.desc:0 "I've asked five different servants about [target.GetTitledFirstNamePossessiveNoTooltip] new [new_spouse.GetWifeHusband] and received five completely different descriptions. How can it be that one [new_spouse.GetWomanMan] has spawned so many tales? It's true that [new_spouse.GetSheHe] appeared at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] seemingly out of nowhere, but I understood the marriage had no scandal attached to it?\n\nPerhaps it's time to speak to someone on the council who would have more concrete information..."
 ansf.spouse.existing:0 "No, [target.GetHerHisMy] [new_spouse.GetWifeHusband] comes from a larger family."
 ansf.existing.spouse.dynasty.tt:0 "You will need to select which dynasty [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip)] [ansf_family_member.GetWifeHusband] comes from, using a selection of rulers that match [ansf_family_member.GetHerHis] current culture and faith\n\n@warning_icon! #X This version of [CharYourHerHis(target)] [ansf_family_member.GetWifeHusband] will not be used! A new character of the same age ([ansf_family_member.GetAge]) will be generated once the dynasty is selected #!"
 ansf.spouse.redo.spouse2.tt:0 "Generate another [new_spouse.GetWifeHusband] of a random nearby culture either in [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip)] culture group or which has a friendly faith."
 ansf.spouse.redo.same.both:0 "I think not. [target.GetHerHisMy|U] [new_spouse.GetWifeHusband] is [target.GetCulture.GetNameNoTooltip] and a [target.GetFaith.GetAdherentNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]."
 ansf.spouse.redo.same.faith:0 "I think not. [target.GetHerHisMy|U] [new_spouse.GetWifeHusband] is a [target.GetFaith.GetAdherentNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]."
 ansf.spouse.redo.same.culture:0 "I think not. [target.GetHerHisMy|U] [new_spouse.GetWifeHusband] is [target.GetCulture.GetNameNoTooltip], like [Select_CString( target.IsLocalPlayer, 'I', target.GetSheHe)] [Select_CString( target.IsLocalPlayer, 'am', 'is')]"
 ansf.spouse.redo.same.tt:0 "Generate another [new_spouse.GetWifeHusband] of [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip)] culture and faith."
 
 ansf.2207.t:0 "[target.GetHerHisMy|U] [new_spouse.Custom('WifeHusbandPossessive')|U] Family"
 ansf.2207.desc:0 "I knew very little about my [new_spouse.Custom('WifeHusbandPossessive')] family when we were first introduced and, to tell the truth, I still don't know much. [new_spouse.GetSheHe|U] barely speaks of them, except to say that they are not close. Still, surely it's worth recognizing that [new_spouse.GetSheHe] comes from a dynasty of importance."
 ansf.2207.other.desc:0 "As little as I know about [target.GetTitledFirstNamePossessiveNoTooltip] new [new_spouse.GetWifeHusband], I know even less about [new_spouse.GetHerHis] family.\n\nAll I'm aware of is that they are influential and that the [new_spouse.GetSheHe] is not on exceptional terms with [new_spouse.GetHerHis] kin... no doubt why [new_spouse.GetSheHe] married [target.GetTitledFirstNameNoTooltip] in the first place."
 ansf.yes.existing1.spouse.grandparent.tt:0 "Create [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip)] [ansf_family_member.GetWifeHusband] as a [ansf_family_member.Custom('GetDaughterSon')] of [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing1.spouse.pibling.tt:0 "Create [Select_CString( target.IsLocalPlayer, 'your', target.GetTitledFirstNamePossessiveNoTooltip)] [ansf_family_member.GetWifeHusband] as a [ansf_family_member.Custom('SisterBrother')] to [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetTitledFirstName] and a member of the [GetPlayer.MakeScope.Var('potential_relative_1').Char.GetDynasty.GetBaseNameNoTooltip] dynasty."
 ansf.yes.existing.spouse.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetWifeHusband] will be a [bastard|E]! #!"
 ansf.yes.existing.spouse.legit.bastard.tt:0 "#X [CharYourHerHis(target)|U] [ansf_family_member.GetWifeHusband] will be a [legitimized_bastard|E]! #!"
 ansf.no.spouse.existing:0 "#emphasis No, perhaps I've got it wrong...#"
 
 ansf.2208.t:0 "[target.GetHerHisMy|U] [new_spouse.GetWifeHusband|U]"
 ansf.2208.grandparent.desc:0 "I suppose that, prior to our marriage, my [ansf_family_member.GetWifeHusband] was primarily known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. Now, I imagine [ansf_family_member.GetSheHe] will be forever known as the [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [ansf_family_member.GetWifeHusband]. Is that better? I hope so!"
 ansf.2208.pibling.desc:0 "I suppose that, prior to our marriage, my [ansf_family_member.GetWifeHusband] was primarily known as [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')], a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty but not one who ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. Now, I imagine [ansf_family_member.GetSheHe] will be forever known as the [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [ansf_family_member.GetWifeHusband]. Is that better? I hope so!"
 ansf.2208.grandparent.other.desc:0 "Ah, yes. [target.GetTitledFirstNamePossessiveNoTooltip] new [ansf_family_member.GetWifeHusband] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('GetDaughterSon')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip], so perhaps it's just as well [ansf_family_member.GetSheHe] ended up at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 ansf.2208.pibling.other.desc:0 "Ah, yes. [target.GetTitledFirstNamePossessiveNoTooltip] new [ansf_family_member.GetWifeHusband] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_family_member.Custom('SisterBrother')].\n\nThat makes [ansf_family_member.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but one who didn't inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip] and who isn't in line for any other titles, so perhaps it's just as well [ansf_family_member.GetSheHe] ended up at [target_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]." 
 ansf.yes.spouse.existing.proceed:0 "That is indeed [target.GetHerHisMy] [ansf_family_member.GetWifeHusband]."
 ansf.reroll.spouse.existing:0 "Generates a new character."
 
 ansf.2209.t:0 "[target.GetHerHisMy|U] [new_spouse.GetWifeHusband|U]"
 ansf.2209.desc:0 "I thought to look for my [new_spouse.GetWifeHusband] in our bedchambers, and there [new_spouse.GetSheHe] is, hiding away from the [ROOT.Char.Custom('FortifiedBuilding')] servants. Or, at least, I think it's [new_spouse.GetHerHim]. Lying behind the gauzy curtain that surrounds our marriage bed, it's hard to tell... but who else could it be, here in our private space?"
 ansf.2209.other.desc:0 "Word has it that [target.GetTitledFirstNamePossessiveNoTooltip] new [new_spouse.GetWifeHusband] is, in fact, lowborn. Could it be true?\n\nEven if it is, rumour also has it that the [new_spouse.GetWomanMan] is exceptional in several ways... no doubt why [target.GetTitledFirstNamePossessiveNoTooltip] chose [new_spouse.GetHerHim] in the first place. Hopefully [target.GetSheHe] does not come to regret that choice."
 
 ansf.2300.t:0 "My Growing Family"
 ansf.2300.desc:0 "All this talk about family, and I've almost forgotten the most important thing of all: my children!\n\nAs I bump into one of the servants in the hall, one who has long served our family as nursemaid, and the old woman asks who I'm so frantically looking for..."
 ansf.child.son.yes:0 "I'm looking for my son."
 ansf.add.son.tooltip:0 "Create a legitimate son, the child of you and your [target.Custom('WifeHusbandOpp')]"
 ansf.child.daughter.yes:0 "My daughter, of course."
 ansf.add.daughter.tooltip:0 "Create a legitimate daughter, the child of you and your [target.Custom('WifeHusbandOpp')]"
 ansf.child.son.bastard.yes:0 "My son, though he is no child of my [ROOT.Char.Custom('WifeHusbandOpp')]'s."
 ansf.child.son.bastard.single.yes:0 "I'm looking for my son."
 ansf.add.son.bastard.tooltip:0 "Create a son, the child of you and either a former spouse, concubine, or lover"
 ansf.child.daughter.bastard.yes:0 "My daughter, though she is no child of my [ROOT.Char.Custom('WifeHusbandOpp')]'s."
 ansf.child.daughter.bastard.single.yes:0 "My daughter, of course."
 ansf.add.daughter.bastard.tooltip:0 "Create a daughter, the child of you and either a former spouse, concubine, or lover"
 ansf.child.no:0 "#emphasis Never mind. I must be mistaken.#"
 ansf.child.no.tooltip:0 "Back out of the child creation process completely"
 
 ansf.2301.t:0 "My [new_child.Custom('GetDaughterSon')|U]'s [source_otherparent.GetMotherFather|U]"
 ansf.2301.desc: "It's my young [new_child.Custom('GetDaughterSon')] I'm looking for, obviously, but now that I'm alone it does give me a moment to think about [new_child.GetHerHis] [source_otherparent.GetMotherFather]. It feels like forever since I've done this, to be honest..."
 ansf.your.exspouse:0 "[source_otherparent.GetSheHe|U] was my ex-[source_otherparent.Custom('WifeHusband')]."
 ansf.your.exspouse.tt:0 "Create a new character who will be your former [source_otherparent.Custom('WifeHusband')]\n"
 ansf.your.exspouse.tt.single.warning:0 "@warning_icon! #X Any future children (with a [target.Custom('WifeHusbandOpp')], should you marry) will need to be younger than this [new_child.Custom('GetDaughterSon')] or any of [new_child.GetHerHis] full siblings. The created ex-[source_otherparent.Custom('WifeHusbandPossessive')] age will be restricted in that [source_otherparent.GetSheHe] must be old enough to have had a [new_child.Custom('GetDaughterSon')] of this age #!"
 ansf.your.exspouse.tt.married.warning:0 "@warning_icon! #X Your [new_child.Custom('GetDaughterSon')] will need to be older than any children you have with your current [target.Custom('WifeHusbandOpp')]. Any future children of you and your current [target.Custom('WifeHusbandOpp')] will need to be younger than this [new_child.Custom('GetDaughterSon')] or any of [new_child.GetHerHis] full siblings. The created ex-[source_otherparent.Custom('WifeHusbandPossessive')] age will be restricted in that [source_otherparent.GetSheHe] must be old enough to have had a [new_child.Custom('GetDaughterSon')] of this age #!"
 ansf.your.concubine:0 "She was my concubine."
 ansf.your.concubine.tt:0 "Create a new character who will be your concubine"
 ansf.your.lover:0 "[source_otherparent.GetSheHe|U] was my lover, who I never married."
 ansf.your.lover.tt:0 "Create a new character who will be your [new_child.Custom('GetDaughterSon')]'s [source_otherparent.GetMotherFather]\n"
 ansf.your.lover.tt.warning:0 "@warning_icon! #X Your [new_child.Custom('GetDaughterSon')] will be created as a bastard (if permitted by faith), and both you and the new character will gain either the [GetTrait('adulterer').GetName( GetNullCharacter )] or [GetTrait('fornicator').GetName( GetNullCharacter )] trait, as appropriate #!"
 ansf.your.findexisting:0 "This was another [source_otherparent.GetWomanMan] I've had a relationship with."
 ansf.your.findexisting.tt:0 "You will need to select an existing character who will serve as your [new_child.Custom('GetDaughterSon')]'s [source_otherparent.GetMotherFather]"
 ansf.your.existing:0 "This is another child I had with [ROOT.Var('existing_parent').Char.GetShortUINameNoTooltipNoFormat]."
 ansf.your.existing.first:0 "This is a [new_child.Custom('GetDaughterSon')] I had with [ROOT.Var('existing_parent').Char.GetShortUINameNoTooltipNoFormat]."
 ansf.your.existing.tt:0 "No new character will be created, as [GetPlayer.MakeScope.Var('existing_parent').Char.GetShortUIName] will be set as your [new_child.Custom('GetDaughterSon')]'s [source_otherparent.GetMotherFather]"
 ansf.your.nevermind.tooltip:0 "Skip the creation process and return to the family screen"
 
 ansf.your.parent.d.concubine:0 "My [new_child.Custom('GetDaughterSon')] is no bastard, as [new_child.GetSheHe] was born to one of my concubines... which, to some, marks [new_child.GetHerHim] as a "lesser" child compared to any born to a proper [ROOT.Char.Custom('WifeHusbandOpp')], even though I've never thought of [new_child.GetHerHim] as such. It has raised many questions and rumours about [new_child.GetHerHis] mother, however."
 ansf.your.parent.d.former.spouse:0 "My [new_child.Custom('GetDaughterSon')] is no bastard, of course, as [new_child.GetSheHe] was a product of my previous marriage. The questions and rumours about my ex-[ROOT.Char.Custom('WifeHusbandOpp')] have been extensive, however..."
 ansf.your.parent.d.lover:0 "My [new_child.Custom('GetDaughterSon')] is, of course, the product of my love affair with [new_child.GetHerHis] [source_otherparent.GetMotherFather]. It was no small scandal when the news came out, but I've always been very clear on who my [new_child.Custom('GetDaughterSon')] was to me. Even so, the questions and rumours about [new_child.GetHerHis] [source_otherparent.GetMotherFather] mother continue to circulate..."
 ansf.your.parent.dead.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be killed off once your [new_child.Custom('GetDaughterSon')]'s character is finalized\n"
 ansf.your.notculture.tt:0 " #X Your [new_child.Custom('GetDaughterSon')] will be [ansf_dominant_parent.GetCulture.GetName] #!"
 ansf.your.notfaith.tt:0 " #X Your [new_child.Custom('GetDaughterSon')] will be [ansf_dominant_parent.GetFaith.GetAdherentName] #!"
 ansf.your.notdynasty.tt:0 " #X Your [new_child.Custom('GetDaughterSon')] will be part of the [ansf_dominant_parent.GetDynasty.GetBaseName] dynasty #!"
 ansf.your.parent.yes.lover.yes:0 "That's [ansf_bastard_otherparent.GetHerHim]. We're lovers still, as everybody knows."
 ansf.your.parent.lover.remain.tt:0 "[ansf_bastard_otherparent.GetShortUIName]will be set as your lover (public, not secret) and added as a courtier once your [new_child.Custom('GetDaughterSon')]'s character is finalized\n"
 ansf.your.parent.yes.lover.no:0 "That's [ansf_bastard_otherparent.GetHerHim]. [ansf_bastard_otherparent.GetSheHe|U] remains at [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], but our affair is long over."
 ansf.your.parent.yes.remain:0 "That's [ansf_bastard_otherparent.GetHerHim], and [ansf_bastard_otherparent.GetSheHe] remains at [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] still."
 ansf.your.parent.remain.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be added as a courtier once your [new_child.Custom('GetDaughterSon')]'s character is finalized\n"
 ansf.your.existing.other.parent.dynasty.tt:0 "You will need to select which dynasty [ansf_bastard_otherparent.GetSheHe] comes from, using a selection of rulers that match [ansf_bastard_otherparent.GetHerHis] current culture and faith\n\n@warning_icon! #X This version of your [new_child.Custom('GetDaughterSon')]'s [ansf_bastard_otherparent.GetMotherFather] will not be used! A new character of the same age ([ansf_bastard_otherparent.GetAge]) will be generated once [ansf_bastard_otherparent.GetHerHis] dynasty is selected #!"
 
 ansf.2303.t:0 "[new_child.GetHerHis|U] [source_otherparent.GetMotherFather|U]'s Family"
 ansf.your.parent.connect.d:0 "I haven't thought of [source_otherparent.GetHerHis] family for some time. My [new_child.Custom('GetDaughterSon')]'s [source_otherparent.GetMotherFather] was born among the ranks of the nobility, though [source_otherparent.GetSheHe] rarely spoke of them. Still, I suppose they helped make [source_otherparent.GetHerHim] who [source_otherparent.GetSheHe] was."
  
 ansf.your.parent.grandparent.d:0 "As it turns out, my [ROOT.Char.Custom2('otherparent_relation_type', SCOPE.sC('ansf_bastard_otherparent'))] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_bastard_otherparent.Custom('GetDaughterSon')].\n\nThat makes [ansf_bastard_otherparent.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but not one ever expected to inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip]. It's not something [ansf_bastard_otherparent.GetSheHe] was ever particularly happy about, and I remember that [ansf_bastard_otherparent.GetSheHe] had little to no contact with the rest of [ansf_bastard_otherparent.GetHerHis] family during our time together."
 ansf.your.parent.pibling.d:0 "As it turns out, my [ROOT.Char.Custom2('otherparent_relation_type', SCOPE.sC('ansf_bastard_otherparent'))] is [actual_relative.GetTitledFirstNamePossessiveNoTooltip] [ansf_bastard_otherparent.Custom('SisterBrother')].\n\nThat makes [ansf_bastard_otherparent.GetHerHim] a member of the [actual_relative.GetDynasty.GetBaseNameNoTooltip] dynasty, but one who didn't inherit the [actual_relative.GetPrimaryTitle.GetNameNoTooltip] and who isn't in line for any other titles. It's not something [ansf_bastard_otherparent.GetSheHe] was ever particularly happy about, and I remember that [ansf_bastard_otherparent.GetSheHe] had little to no contact with the rest of [ansf_bastard_otherparent.GetHerHis] family during our time together."
 
 ansf.your.parent.yes.relative:0 "That's [ansf_bastard_otherparent.GetHerHim]. [ansf_bastard_otherparent.GetSheHe|U] has since returned to [ansf_bastard_otherparent.GetHerHis] [ansf_bastard_otherparent.Custom2('LMF_RelationToMePossessive', SCOPE.sC('actual_relative'))] court."
 ansf.your.parent.relative.tt:0 "[ansf_bastard_otherparent.GetShortUIName] will be added as [actual_relative.GetTitledFirstNamePossessive] courtier once your [new_child.Custom('GetDaughterSon')]'s character is finalized\n"
 
 ansf.legitimate.child.t:0 "My [ansf_family_member.Custom('GetDaughterSon')|U]?"
 ansf.legimate.yes.proceed:0 "Of course! I think I would know my own [ansf_family_member.Custom('GetDaughterSon')]." 
 ansf.child.infant.desc:0 "Naturally, I find my [ansf_family_member.Custom('GetDaughterSon')] right where [ansf_family_member.GetSheHe] is supposed to be: tucked away in [ansf_family_member.GetHerHis] crib, with [ansf_family_member.GetHerHis] nanny hovering nervously nearby.\n\nOr am I mistaken? This... is my [ansf_family_member.Custom('GetDaughterSon')], isn't it?"
 ansf.child.smallchild.desc:0 "Finally, I find my young [ansf_family_member.Custom('GetDaughterSon')] right where [ansf_family_member.GetSheHe] is supposed to be: in [ansf_family_member.GetHerHis] chambers, running wildly about as children are supposed to do. [ansf_family_member.GetHerHis|U] nanny hovers nearby, clearly exhausted by this small child's constant energy. Even I'm impressed by it.\n\nOr am I mistaken? This... is my [ansf_family_member.Custom('GetDaughterSon')], isn't it?"
 ansf.child.teen.desc:0 "Eventually, I find my [ansf_family_member.Custom('GetDaughterSon')] out in the courtyard, playing some manner of game with a few other children.\n\n[ROOT.Char.Custom2('QuirkStandalonePosOrNeg', SCOPE.sC('ansf_family_member'))] when [ansf_family_member.GetSheHe] notices me nearby, and this typical display makes me grin.\n\nOr am I mistaken? This... is my [ansf_family_member.Custom('GetDaughterSon')], isn't it?"
 ansf.child.adult.desc:0 "Eventually, I find my [ansf_family_member.Custom('GetDaughterSon')] out in the courtyard, [ansf_family_member.GetHerHis] [ansf_family_member.Custom('quirk_pos_noun')] obvious even at such a young age... though I suppose some have complained of [ansf_family_member.GetHerHis] constant [ansf_family_member.Custom('quirk_neg_noun')] as well.\n\nEither way, it matters not. [ansf_family_member.GetSheHe|U] is my [ansf_family_member.Custom('GetDaughterSon')] and that's all I care about.\n\nOr am I mistaken? This... is my [ansf_family_member.Custom('GetDaughterSon')], isn't it?"
 ansf.child.redo.tooltip:0 "Re-generate your [ansf_family_member.Custom('GetDaughterSon')] without favoring either parent's DNA"
 