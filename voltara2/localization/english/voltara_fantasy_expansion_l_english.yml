l_english:
 voltara_stoneborn_pikes:0 "Ironhold Steelpikes"
 voltara_stoneborn_pikes_flavor:0 "Ranks of steel fill the narrow mountain roads. Ironhold teaches its pikemen to hold the pass even when the banners behind them have fallen."
 voltara_stoneborn_guard:0 "Stoneborn Hallguard"
 voltara_stoneborn_guard_flavor:0 "These shield-bearing veterans defend the doors of the mountain halls. Each bears the maker's mark of the stronghold that armed them."
 voltara_high_elven_bows:0 "High Elven Starbows"
 voltara_high_elven_bows_flavor:0 "Long years of practice make every volley deliberate. The Starbows take their names from the constellations used to judge the wind on a clear night."
 voltara_high_elven_guard:0 "High Elven Dawnguard"
 voltara_high_elven_guard_flavor:0 "Oath-bound companies whose patient discipline is measured in decades. Their bright shields form a wall before the high elven courts."
 voltara_thornfell_hunters:0 "Thornfell Huntsmen"
 voltara_thornfell_hunters_flavor:0 "Woodland guides and bowmen who know the old paths beneath Thornfall's canopy. An invading column seldom sees the first arrow coming."
 voltara_orc_warband:0 "Balskaar Warband"
 voltara_orc_warband_flavor:0 "Balskaar's veterans fight shoulder to shoulder, advancing behind battered shields and the shouted names of their kin."
 voltara_giant_breakers:0 "Giant Linebreakers"
 voltara_giant_breakers_flavor:0 "The few giants who leave their secluded holds carry weapons that smaller folk could scarcely lift. Their charge breaks formations rather than pursuing fugitives."
 voltara_deep_stalkers:0 "Deep Elven Stalkers"
 voltara_deep_stalkers_flavor:0 "Deep Elven scouts practice their craft in stone galleries and the shadows of the northern mountains. Silence is their first weapon."
 voltara_severosi_crossbows:0 "Severosi Crown Crossbows"
 voltara_severosi_crossbows_flavor:0 "Paid from crown revenues and trained to loose by command, these companies turn the workshops of Severos into disciplined battlefield power."
 voltara_coastal_marines:0 "Lantern Coast Marines"
 voltara_coastal_marines_flavor:0 "The beacon towns furnish tough boarding troops accustomed to wet decks, harbor walls and fighting far from friendly shores."
 voltara_southron_spears:0 "Southron Sun Spears"
 voltara_southron_spears_flavor:0 "Southron spear companies travel light between wells and caravan settlements. Their long ranks guard the water on which an army depends."
 voltara_kartholos_guard:0 "Kartholos Gate Guard"
 voltara_kartholos_guard_flavor:0 "The Keepers drill these defenders at the bridge approaches. They are chosen for the patience to hold a gate, not the haste to chase an enemy."
 voltara_stoneborn_sappers:0 "Stoneborn Deep Sappers"
 voltara_stoneborn_sappers_flavor:0 "Stoneborn miners turn the craft of opening mountain galleries against hostile walls. Their crews bring braces, picks and generations of hard-won knowledge."
 voltara_goblin_ambushers:0 "Goblin Hollow Ambushers"
 voltara_goblin_ambushers_flavor:0 "Small bands hide along wooded hollows and broken ground, striking supply wagons before melting back into cover."
 voltara_enderali_wardens:0 "Enderali Pass Wardens"
 voltara_enderali_wardens_flavor:0 "Enderal's pass companies guard the roads beneath the mountains. Their campfires are shared with guides who speak carefully of the old bear-blooded families."
 trait_voltara_threadwarrior:0 "Threadwarrior"
 trait_voltara_threadwarrior_desc:0 "A practitioner trained to weave the Threads amid the confusion of battle."
 trait_voltara_oathwarden:0 "Oathwarden"
 trait_voltara_oathwarden_desc:0 "A sworn defender of Kartholos, entrusted with the gates and the safety of those under the Keepers' protection."
 trait_voltara_deep_engineer:0 "Deep Engineer"
 trait_voltara_deep_engineer_desc:0 "Trained beneath the mountain, this engineer reads the weakness in stone and builds where others see only rock."
 building_voltara_artisan_lodge:0 "Artisan Lodge"
 building_voltara_artisan_lodge_desc:0 "Smiths, stonecutters and Thread-trained artisans share this chartered workshop. Its ledgers preserve techniques that once belonged to isolated halls."
 building_type_voltara_artisan_lodge:0 "Artisan Lodge"
 building_type_voltara_artisan_lodge_desc:0 "Smiths, stonecutters and Thread-trained artisans share this chartered workshop. Its ledgers preserve techniques that once belonged to isolated halls."
 voltara_train_threadwarrior:0 "Train as a Threadwarrior"
 voltara_train_threadwarrior_desc:0 "A veteran lays a scarred shield beside a candle. Holding a Thread steady in a quiet chamber is one thing; keeping it steady while arrows fall is another. The lesson begins with the shield."
 voltara_train_threadwarrior_tooltip:0 "Undertake regional training and gain a professional trait."
 voltara_train_threadwarrior_confirm:0 "Begin the training"
 voltara_training.1.t:0 "The Muster of Threads"
 voltara_training.1.desc:0 "A veteran lays a scarred shield beside a candle. Holding a Thread steady in a quiet chamber is one thing; keeping it steady while arrows fall is another. The lesson begins with the shield."
 voltara_training.1.a:0 "Practice until the flame holds."
 voltara_train_deep_engineer:0 "Train as a Deep Engineer"
 voltara_train_deep_engineer_desc:0 "The master mason taps the gallery wall, then offers you the hammer. Every fracture has a voice. Above ground, armies wait for walls to fall; here, you learn why they stand."
 voltara_train_deep_engineer_tooltip:0 "Undertake regional training and gain a professional trait."
 voltara_train_deep_engineer_confirm:0 "Begin the training"
 voltara_training.2.t:0 "The Stone Listens"
 voltara_training.2.desc:0 "The master mason taps the gallery wall, then offers you the hammer. Every fracture has a voice. Above ground, armies wait for walls to fall; here, you learn why they stand."
 voltara_training.2.a:0 "Learn the mountain's craft."
 voltara_train_oathwarden:0 "Train as an Oathwarden"
 voltara_train_oathwarden_desc:0 "At the bridge, a Keeper recites the names of travelers sheltered during the last siege. Your oath is sworn to their safety as much as to the stones beneath your feet."
 voltara_train_oathwarden_tooltip:0 "Undertake regional training and gain a professional trait."
 voltara_train_oathwarden_confirm:0 "Begin the training"
 voltara_training.3.t:0 "An Oath at Kartholos"
 voltara_training.3.desc:0 "At the bridge, a Keeper recites the names of travelers sheltered during the last siege. Your oath is sworn to their safety as much as to the stones beneath your feet."
 voltara_training.3.a:0 "I will keep the passage."
 voltara_bear_lodge:0 "Visit a Bear Lodge"
 voltara_bear_lodge_desc:0 "Travel to an Enderali lodge where the old bear-blooded families keep their winter gatherings."
 voltara_bear_lodge_tooltip:0 "Hear the lodge's stories, ease your mind and, if you bear the gift, practice its control."
 voltara_bear_lodge_confirm:0 "Seek the lodge"
 voltara_training.4.t:0 "Beneath the Carved Bear"
 voltara_training.4.desc:0 "A bear is carved above the lintel, its paws resting on the mountain. Within, the elders speak of strength held in check: a hand that can break a door must also know how to cradle a child. No one asks what walks outside when the moon rises. For this evening, a place beside the fire is enough."
 voltara_training.4.a:0 "Listen, and remember."
