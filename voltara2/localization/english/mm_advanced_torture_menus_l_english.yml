l_english:
 advanced_torture.0001.t:0 "Advanced Torture"
 advanced_torture.0001.desc:0 "[advanced_torture_prisoner.GetShortUIName] is at your mercy. The cell is cold, damp, and silent, broken only by the sound of chains and the prisoner's trembling breath. You may order a minor punishment, turn to harsher methods, begin a prolonged torture, or open the door to torments reserved for the truly ruthless."
 advanced_torture.0001.light:0 "Lesser Tortures"
 advanced_torture.0001.medium:0 "Moderate Tortures"
 advanced_torture.0001.strong:0 "Severe Tortures"
 advanced_torture.0001.long_tortures:0 "Prolonged Tortures"
 advanced_torture.0001.unique:0 "Unique Tortures"
 advanced_torture.0001.cancel:0 "It is not worth it"

 advanced_torture.0002.t:0 "Lesser Tortures"
 advanced_torture.0002.desc:0 "Not every torture is meant to destroy the body. Some only need to humiliate, mark, or break the prisoner's dignity without turning the cell into a slaughterhouse."
 advanced_torture.0002.simple_whipping:0 "Lashings"
 advanced_torture.0002.branding_iron:0 "Branding Iron"
 advanced_torture.0002.stocks:0 "Foot Stocks"
 advanced_torture.0002.walk_of_shame:0 "Walk of Shame"

 advanced_torture.0003.t:0 "Moderate Tortures"
 advanced_torture.0003.desc:0 "These methods are no longer simple punishments. They are designed to break resistance, extract confessions, and leave the prisoner with an unforgettable memory of the pain your authority can cause."
 advanced_torture.0003.bastinado:0 "Bastinado / Falaka"
 advanced_torture.0003.water_torment:0 "Water Torment / Toca"
 advanced_torture.0003.compression_cords:0 "Compression Cords"
 advanced_torture.0003.strappado:0 "Strappado"
 advanced_torture.0003.thumbscrew:0 "Thumbscrew"
 advanced_torture.0003.short_stretching_bench:0 "Short Stretching Bench"

 advanced_torture.0004.t:0 "Severe Tortures"
 advanced_torture.0004.desc:0 "Here warnings end and lasting wounds begin. These torments leave broken bodies, useless limbs, lost eyes, and memories no physician can erase."
 advanced_torture.0004.rack:0 "The Rack"
 advanced_torture.0004.wedged_boot:0 "Wedged Boot"
 advanced_torture.0004.rats:0 "Rat Torture"
 advanced_torture.0004.enucleation:0 "Enucleation of One Eye"
 advanced_torture.0004.leg_amputation:0 "Leg Amputation"
 advanced_torture.0004.nail_cleaner:0 "Nail Cleaner / Stilettos"

 advanced_torture.0005.t:0 "Unique Tortures"
 advanced_torture.0005.desc:0 "Some torments do not belong to any ordinary category. They belong to specific cultures, dark traditions, special compatibility patches, or those who have already crossed the limits of common cruelty."
 advanced_torture.0005.sadistic:0 "Sadistic Tortures"
 advanced_torture.0005.cultural:0 "Cultural Tortures"

 advanced_torture.0006.t:0 "Sadistic Tortures"
 advanced_torture.0006.desc:0 "These methods are not justice, discipline, or ordinary interrogation. They are acts of exceptional cruelty reserved for those who find pleasure in the suffering of others."
 advanced_torture.0006.phalaris_bull:0 "Brazen Bull of Phalaris"
 advanced_torture.0006.judas_cradle:0 "Judas Cradle"
 advanced_torture.0006.pear_of_anguish:0 "Pear of Anguish"
 advanced_torture.0006.iron_spider:0 "Iron Spider"
 advanced_torture.0006.torture_chair:0 "Torture Chair / Chair of Nails"
 advanced_torture.0006.skull_crusher:0 "Skull Crusher"

 advanced_torture.0007.t:0 "Cultural Tortures"
 advanced_torture.0007.desc:0 "Cultural tortures are reserved for a later phase. For now, the dungeons have not prepared these methods."
 advanced_torture.0007.empty:0 "There are no cultural tortures available for now"