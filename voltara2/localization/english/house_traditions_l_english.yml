l_english:
 trad_valor:0 "House Traditions: Valor"
 trad_valor_desc:0 "Favors Brave, Stubborn, and Impatient traits.\nDisfavors Craven trait.\nMembers are more likely to pursue Martial Education.\nChildren start to learn swordsmanship at an early age."
 trad_honor:0 "House Traditions: Honor"
 trad_honor_desc:0  "Favors Honest, Just, and Stubborn traits.\nDisfavors Deceitful, Arbitrary, and Fickle traits.\nInspires vassals to affirm their loyalty after a succession."
 trad_duty:0 "House Traditions: Duty"
 trad_duty_desc:0 "Favors Diligent, Humble, and Impatient traits.\nDisfavors Lazy, Arrogant, Ambitious traits."
 trad_justice:0 "House Traditions: Justice"
 trad_justice_desc:0 "Favors Just, Vengeful, and Zealous traits.\nDisfavors Arbitrary and Forgiving traits."
 trad_vengeance:0 "House Traditions: Vengeance"
 trad_vengeance_desc:0 "Favors Vengeful, Just, and Sadistic traits.\nDisfavors Forgiving and Compassionate traits.\nAvenging murdered kinsmen is a house-wide effort."
 trad_pride:0 "House Traditions: Pride"
 trad_pride_desc:0 "Favors Arrogant, Ambitious, and Wrathful traits.\nDisfavors Humble and Content traits."
 trad_respect:0 "House Traditions: Authority"
 trad_respect_desc:0 "Favors Callous, Arrogant, and Vengeful traits.\nDisfavors Humble and Compassionate traits.\nCan demand a pledge of loyalty once per lifetime."
 trad_power:0 "House Traditions: Power"
 trad_power_desc:0 "Favors Ambitious, Wrathful, and Impatient traits.\nDisfavors Lazy and Content traits."
 trad_influence:0 "House Traditions: Influence"
 trad_influence_desc:0 "Favors Gregarious, Calm, and Deceitful traits.\nDisfavors Trusting and Content traits.\nMembers are more likely to pursue Diplomacy Education."
 trad_guile:0 "House Traditions: Guile"
 trad_guile_desc:0 "Favors Deceitful, Fickle, and Arbitrary traits.\nDisfavors Trusting and Honest traits.\nMembers are more likely to pursue Intrigue Education."
 trad_survival:0 "House Traditions: Perseverance"
 trad_survival_desc:0 "Favors Craven, Paranoid, and Deceitful traits.\nDisfavors Brave and Trusting traits."
 trad_vigilance:0 "House Traditions: Vigilance"
 trad_vigilance_desc:0 "Favors Diligent, Patient, and Paranoid traits.\nDisfavors Impatient and Trusting traits."
 trad_peace:0 "House Traditions: Peace"
 trad_peace_desc:0 "Favors Forgiving, Honest, and Trusting traits.\nDisfavors Wrathful and Vengeful traits."
 trad_fortune:0 "House Traditions: Fortune"
 trad_fortune_desc:0 "Favors Greedy, Diligent, Gregarious traits.\nDisfavors Shy and Content traits.\nMembers are more likely to pursue Stewardship Education."
 trad_knowledge:0 "House Traditions: Knowledge"
 trad_knowledge_desc:0 "Favors Patient, Cynical, and Shy traits.\nDisfavors Lazy and Paranoid traits.\nMembers are more likely to pursue Learning Education."
 trad_truth:0 "House Traditions: Truth"
 trad_truth_desc:0 "Favors Cynical, Honest, Just traits.\nDisfavors Arbitrary and Fickle traits."
 trad_wisdom:0 "House Traditions: Wisdom"
 trad_wisdom_desc:0 "Favors Temperate, Calm, and Patient traits.\nDisfavors Wrathful and Impatient traits."
 trad_devotion:0 "House Traditions: Devotion"
 trad_devotion_desc:0 "Favors Content, Diligent, and Zealous traits.\nDisfavors Cynical and Fickle traits."
 trad_family:0 "House Traditions: Family"
 trad_family_desc:0 "Favors Compassionate, Forgiving, and Chaste traits.\nDisfavors Lustful and Sadistic traits."
 trad_compassion:0 "House Traditions: Compassion"
 trad_compassion_desc:0 "Favors Compassionate, Forgiving, and Generous traits.\nDisfavors Callous and Sadistic traits."
 trad_joy:0 "House Traditions: Joy"
 trad_joy_desc:0 "Favors Lustful, Gluttonous, and Generous traits.\nDisfavors Chaste and Temperate traits."
 trad_distinction:0 "House Traditions: Distinction"
 trad_distinction_desc:0 "Favors Arbitrary, Eccentric, and Brave traits.\nDisfavors Humble and Shy traits."
 trad_freedom:0 "House Traditions: Free Spirit"
 trad_freedom_desc:0 "Does not influence the traits of offspring, but has a strong desire for independence and dislike lieges."

 establish_house_traditions_decision:0 "Establish House Traditions"
 establish_house_traditions_decision_tooltip:0 "Establish traditions for your house to follow and shape their values."
 establish_house_traditions_decision_desc:0 "A House is nothing but its traditions and values. I will exemplify the values of this house and codify the proper way to conduct onself for posterity."
 establish_house_traditions_effect_1:0 "Establish House Traditions based on a set of values."
 establish_house_traditions_effect_2:0 "Available values are determined based on your personality [traits|E]."
 establish_house_traditions_effect_3:0 "A set of personality [traits|E] will become favored or disfavored by future members of your [house|E] as they grow up."
 establish_house_traditions_decision_confirm:0 "Establish House Traditions"
 establish_house_traditions_validate:0 "You must be either a landed noble, an estate holder, or a legitimist adventurer."

 house_trad.0001.t:0 "Establishing House Traditions"
 house_trad.0001.opening:0 "The time has come to set example for posterity and establish traditions for your house. What would you like your descendants to value?"
