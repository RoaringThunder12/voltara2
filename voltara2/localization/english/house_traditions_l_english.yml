house_trad.1001.t:0 "Childhood Role Model"
house_trad.1001.desc:0 "Growing up, I have always looked up towards my family on the proper way to behave like a member of House [personality_child.GetDynastyHouseNameNoTooltip]."
# Valor
house_trad.1010.a:0 "I will be brave like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1010.b:0 "I will standup for myself like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1010.c:0 "I will be direct like [value_trait_3.GetTitledFirstNameNoTooltip]."
#house_trad.1010.d:0 "Without a role model to look up to, I rely only on stories of House [personality_child.GetDynastyHouseNameNoTooltip] taught to me as a child."
house_trad.1010.d:0 "I will heed the stories of House [personality_child.GetDynastyHouseNameNoTooltip]."
house_trad.1010.e:0 "Traditions are not for me. I do what I want."
# Honor
house_trad.1020.a:0 "I will keep my word like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1020.b:0 "I will conduct fairly like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1020.c:0 "I will uphold my honor like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Duty
house_trad.1030.a:0 "I will be responsible like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1030.b:0 "I will be dutiful like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1030.c:0 "I will take initiative like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Justice
house_trad.1040.a:0 "I will uphold the law like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1040.b:0 "I will mete out justice like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1040.c:0 "I will be righteous like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Vengeance
house_trad.1050.a:0 "I will punish those who wronged me like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1050.b:0 "I will demand justice like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1050.c:0 "I will destroy my enemies like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Pride
house_trad.1060.a:0 "I will show my status like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1060.b:0 "I will earn my own name like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1060.c:0 "I will command respect like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Authority
house_trad.1070.a:0 "I will set myself apart from peasants, just like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1070.b:0 "I will demand obedience like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1070.c:0 "I will make my name to be respected like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Power
house_trad.1080.a:0 "I will seek power like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1080.b:0 "I will be feared like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1080.c:0 "I will drive for results like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Influence
house_trad.1090.a:0 "I will be cordial to others like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1090.b:0 "I will not reveal any weakness, just like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1090.c:0 "I will devise grand machinations like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Guile
house_trad.1100.a:0 "I will manipulate others to my advantage like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1100.b:0 "I will conceal my intentions like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1100.c:0 "I will follow my whims like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Perseverance
house_trad.1110.a:0 "I will avoid risks, just like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1110.b:0 "I will watch for every danger like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1110.c:0 "I will do what it takes to survive, just like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Vigilance
house_trad.1120.a:0 "I will always be prepared like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1120.b:0 "I will be observant like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1120.c:0 "I will protect myself from conspirers, just like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Peace
house_trad.1130.a:0 "I will seek peaceful resolution like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1130.b:0 "I will be open to others like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1130.c:0 "I will not doubt the goodwill of others, just like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Fortune
house_trad.1140.a:0 "I will hoard treasures like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1140.b:0 "I will build my wealth like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1140.c:0 "I will make friendly connections, just like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Knowledge
house_trad.1150.a:0 "I will take time to understand everything like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1150.b:0 "I will think things through like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1150.c:0 "I will devote myself to my studies like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Truth
house_trad.1160.a:0 "I will seek to learn the real truths like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1160.b:0 "I will be truthful like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1160.c:0 "I will discern right from wrong like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Wisdom
house_trad.1170.a:0 "I will seek moderation like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1170.b:0 "I will have self-restraint like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1170.c:0 "I will be patient with others, just like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Devotion
house_trad.1180.a:0 "I will faithfully serve higher powers, just like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1180.b:0 "I will commit myself to great causes like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1180.c:0 "I will spread [ROOT.Char.GetFaith.HighGodNamePossessive] word like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Family
house_trad.1190.a:0 "I will be caring like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1190.b:0 "I will be forgiving like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1190.c:0 "I will be faithful to my family like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Compassion
house_trad.1200.a:0 "I will be compassionate like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1200.b:0 "I will be understanding like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1200.c:0 "I will be generous like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Joy
house_trad.1210.a:0 "I will seek pleasure like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1210.b:0 "I will indulge myself with food like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1210.c:0 "I will bring joy to others like [value_trait_3.GetTitledFirstNameNoTooltip]."
# Distinction
house_trad.1220.a:0 "I will think outside the box like [value_trait_1.GetTitledFirstNameNoTooltip]."
house_trad.1220.b:0 "I will find unique solutions like [value_trait_2.GetTitledFirstNameNoTooltip]."
house_trad.1220.c:0 "I will speak my mind like [value_trait_3.GetTitledFirstNameNoTooltip]."


