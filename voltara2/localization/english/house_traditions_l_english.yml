house_trad.6001.t:0 "Child Takes After Parent"
house_trad.6001.desc.parents:0 "Growing up, I often sought guidance from my parents."
house_trad.6001.desc.father:0 "Growing up, I often sought guidance from my father."
house_trad.6001.desc.mother:0 "Growing up, I often sought guidance from my mother."
house_trad.6001.desc.guardian:0 "Growing up, I often sought guidance from my guardian, [guardian.GetTitledFirstNameNoTooltip]."
house_trad.6001.o.father:0 "I have always felt a strong bond with my father."
house_trad.6001.o.mother:0 "I have always felt a strong bond with my mother."
house_trad.6001.o.guardian.male:0 "[guardian.GetTitledFirstNameNoTooltip] has always been like a father to me."
house_trad.6001.o.guardian.female:0 "[guardian.GetTitledFirstNameNoTooltip] has always been like a mother to me."
house_trad.6001.o.noeffect:0 "I never really felt close to my parents."


