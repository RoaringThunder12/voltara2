house_trad.2030.t:0 "A Gift of Duty"
house_trad.2030.desc:0 "[guardian.GetFirstNameNoTooltip] has assigned me with additional responsibilities in the estate. [guardian.GetSheHe|U] wants me bear greater responsibilities for House [personality_child.GetDynastyHouseNameNoTooltip] and uphold our family values."
house_trad.2035.a:0 "I shall be the embodiment of Duty."

house_trad.2040.t:0 "A Gift of Justice"
house_trad.2040.desc:0 "[guardian.GetFirstNameNoTooltip] has gifted me a personalized signet ring. [guardian.GetSheHe|U] administer justice in the name of House [personality_child.GetDynastyHouseNameNoTooltip] and uphold our family values."
house_trad.2045.a:0 "I shall be the embodiment of Justice."
trad_justice_gift:0 "[personality_child.GetFirstNamePossessive] Signet Ring"
trad_justice_gift.desc:0 "A simple gold signet ring bearing the sigil of House [personality_child.GetDynastyHouseName]. \n\nThe motto of the [personality_child.GetDynastyHouseName] family, '[personality_child.GetHouse.GetMotto]', is elegantly inscribed on the inside."

house_trad.2050.t:0 "A Gift of Vengeance"
house_trad.2050.desc:0 "[guardian.GetFirstNameNoTooltip] has gifted me an ornate dagger engraved with the house motto. [guardian.GetSheHe|U] reminds me that House [personality_child.GetDynastyHouseNameNoTooltip] always pays its debts, especially to its enemies."
