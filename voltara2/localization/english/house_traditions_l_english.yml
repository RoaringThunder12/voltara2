house_trad.5010.desc:0 "It is time for a break from [personality_child.GetFirstNamePossessiveNoTooltip] routine lesson plan. I think it may be a good time to pass along some values of House [ROOT.Char.GetDynastyHouseNameNoTooltip] to [personality_child.GetHerHim]."
house_trad.5010.a:0 "I will tell [personality_child.GetFirstNameNoTooltip] a story about House [ROOT.Char.GetDynastyHouseNameNoTooltip]."
house_trad.5010.b:0 "I will discourage [personality_child.GetFirstNamePossessiveNoTooltip] bad behaviors."
house_trad.5010.c:0 "I will hone [personality_child.GetFirstNamePossessiveNoTooltip] skills by House [ROOT.Char.GetDynastyHouseNameNoTooltip] traditions."
house_trad.5010.d:0 "I take [personality_child.GetFirstNameNoTooltip] on a traditional House [ROOT.Char.GetDynastyHouseNameNoTooltip] activity."
house_trad.5010.e:0 "[personality_child.GetFirstNameNoTooltip] should discover who [personality_child.GetSheHe] is on [personality_child.GetHerHis] own."

