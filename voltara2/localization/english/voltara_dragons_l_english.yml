 trait_dragon:0 "Dragon"
 trait_dragon_desc:0 "A long-lived winged creature whose fire and strength can change the fate of kingdoms. Dragons cannot inherit mortal titles or marry."
 trait_dragonrider:0 "Dragonrider"
 trait_dragonrider_desc:0 "This character has formed an exclusive bond with a dragon. Only a living, mature dragon can be ridden into war."
