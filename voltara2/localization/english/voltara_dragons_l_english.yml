 rule_voltara_dragon_clutches:0 "Dragon Egg Clutches"
 setting_voltara_clutches_balanced:0 "Balanced"
 setting_voltara_clutches_balanced_desc:0 "A mature bonded female can lay an egg every five years, with a 20% yearly chance."
 setting_voltara_clutches_abundant:0 "Abundant"
 setting_voltara_clutches_abundant_desc:0 "Successful clutches contain two eggs. The five-year recovery remains."
 setting_voltara_clutches_rare:0 "Rare"
 setting_voltara_clutches_rare_desc:0 "Egg laying has a 5% yearly chance and yields one egg."
