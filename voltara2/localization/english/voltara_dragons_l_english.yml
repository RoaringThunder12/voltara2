 voltara_dragons.1.t:0 "In Search of Wings"
 voltara_dragons.1.desc:0 "Your scouts return with tracks, scorched stone and a report of something moving above the ridgeline. Approaching a wild dragon is a dangerous undertaking, not a claim of ownership."
 voltara_dragons.1.o0:0 "Approach with patience."
 voltara_dragons.1.o1:0 "Leave the creature undisturbed."
 voltara_dragons.3.t:0 "The First Bond"
 voltara_dragons.3.desc:0 "The dragon holds your gaze and allows you to remain. Trust has begun; it will take time and care to make a partnership."
 voltara_dragons.3.o0:0 "I will earn that trust."
 voltara_dragons.4.t:0 "The Dragon Refuses"
 voltara_dragons.4.desc:0 "You return without a bond. No title, payment or proclamation can force a dragon to accept a rider."
 voltara_dragons.4.o0:0 "We survived the attempt."
 voltara_dragons.10.t:0 "The Hatching Chamber"
 voltara_dragons.10.desc:0 "The egg is placed in a carefully tended chamber. Warmth and patient attention offer a chance of life, but there is no guarantee that the shell will open."
 voltara_dragons.10.o0:0 "Begin the vigil."
 voltara_dragons.10.o1:0 "Preserve the egg for another time."
 voltara_dragons.11.t:0 "A Flame Takes Breath"
 voltara_dragons.11.desc:0 "A small creature breaks through the shell. Its first breath carries warmth, and its eyes follow your movements. For now it needs care, not a battlefield."
 voltara_dragons.11.o0:0 "Welcome, little flame."
 voltara_dragons.12.t:0 "An Unbroken Shell"
 voltara_dragons.12.desc:0 "The vigil ends without a hatchling. The egg is intact and can be tended again in another season."
 voltara_dragons.12.o0:0 "Keep it safe."
 voltara_dragons.13.t:0 "A Silent Shell"
 voltara_dragons.13.desc:0 "The shell cracks without a living creature inside. The egg cannot be recovered."
 voltara_dragons.13.o0:0 "Record what we learned."
 voltara_dragons.20.t:0 "A Nest Among the Stones"
 voltara_dragons.20.desc:0 "Your expedition searches old mountain nests. Most contain only ash and broken shell."
 voltara_dragons.20.o0:0 "Examine the deepest shelter."
 voltara_dragons.30.t:0 "An Egg in the Nest"
 voltara_dragons.30.desc:0 "Your dragon has laid an egg. The keepers record its mother and place it in your care."
 voltara_dragons.30.o0:0 "Guard it well."
 voltara_dragons.40.t:0 "The Rider’s Discipline"
 voltara_dragons.40.desc:0 "You spend the season learning the movements and temper of your dragon. Training builds understanding; it does not make the creature harmless."
 voltara_dragons.40.o0:0 "Continue the training."
 voltara_dragons.50.t:0 "Wings Above the Host"
 voltara_dragons.50.desc:0 "Your mature dragon is ready to accompany you. Its support strengthens your command, but only while you remain capable of riding."
 voltara_dragons.50.o0:0 "We fly with the army."
 voltara_seek_dragon:0 "Seek a Wild Dragon"
 voltara_seek_dragon_desc:0 "Fund an expedition to approach an unbonded dragon. The attempt can fail or cause injury."
 voltara_seek_dragon_tooltip:0 "Fund an expedition to approach an unbonded dragon. The attempt can fail or cause injury."
 voltara_seek_dragon_confirm:0 "Proceed"
 voltara_hatch_dragon:0 "Tend a Dragon Egg"
 voltara_hatch_dragon_desc:0 "Attempt to hatch an owned egg. Success creates a bonded hatchling; failure may leave the egg intact or destroy it."
 voltara_hatch_dragon_tooltip:0 "Attempt to hatch an owned egg. Success creates a bonded hatchling; failure may leave the egg intact or destroy it."
 voltara_hatch_dragon_confirm:0 "Proceed"
 voltara_seek_egg:0 "Search Abandoned Dragon Nests"
 voltara_seek_egg_desc:0 "Search remote nesting grounds for a surviving egg. Finding one is uncertain."
 voltara_seek_egg_tooltip:0 "Search remote nesting grounds for a surviving egg. Finding one is uncertain."
 voltara_seek_egg_confirm:0 "Proceed"
 voltara_train_dragon:0 "Train with Your Dragon"
 voltara_train_dragon_desc:0 "Spend a season developing your partnership."
 voltara_train_dragon_tooltip:0 "Spend a season developing your partnership."
 voltara_train_dragon_confirm:0 "Proceed"
 voltara_deploy_dragon:0 "Ride with the Host"
 voltara_deploy_dragon_desc:0 "Deploy a mature bonded dragon for one year of military service. You must still lead the army to use your command advantage."
 voltara_deploy_dragon_tooltip:0 "Deploy a mature bonded dragon for one year of military service. You must still lead the army to use your command advantage."
 voltara_deploy_dragon_confirm:0 "Proceed"
