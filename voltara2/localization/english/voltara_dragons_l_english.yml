 voltara_dragon_training:0 "Rider Training"
 voltara_dragon_warfare:0 "Dragon Support"
 voltara_dragon_egg_black_name:0 "Black Dragon Egg"
 voltara_dragon_egg_blue_name:0 "Blue Dragon Egg"
