l_english:
 trait_dragon:0 "Dragon"
 trait_dragon_desc:0 "A winged, fire-breathing creature of Voltara. Dragons have size, combat effectiveness, draconic dread and temperament, rather than the skills of mortal rulers."
 trait_dragonrider:0 "Dragonrider"
 trait_dragonrider_desc:0 "Dragonriders are those few men and women who have bonded a dragon, wielding that fearsome power to their own ends."
 trait_dragon_aggressive:0 "Aggressive"
 trait_dragon_aggressive_desc:0 "Quick to lash out at any creature, in any situation, this dragon is notoriously known for anger."
 trait_dragon_friendly:0 "Friendly"
 trait_dragon_friendly_desc:0 "This dragon is surprisingly peaceful and considerate with most creatures, and can often be calm or even playful.."
 trait_dragon_solitary:0 "Solitary"
 trait_dragon_solitary_desc:0 "This dragon is at it's most effective when free from distractions and other dragons."
 trait_dragon_cooperative:0 "Cooperative"
 trait_dragon_cooperative_desc:0 "This dragon is a pack animal through and through. It excels with peers at it's side."
 trait_dragon_physique_good_3:0 "Tyrannic Leviathan"
 trait_dragon_physique_good_3_desc:0 "Some dragons are such specimens of their kind that all from Asshai to the Wall knows of the sheer physical majesty. To be in their presence is to be in the presence of death incarnate."
 trait_dragon_physique_good_2:0 "Great Drake"
 trait_dragon_physique_good_2_desc:0 "Not all dragons are made equal, and some seem to ripple with the strength of fire made flesh, stunning all who behold them."
 trait_dragon_physique_good_1:0 "Fearsome Wyrm"
 trait_dragon_physique_good_1_desc:0 "With powerful wings, a heavy frame, and a titanic bite, some dragons can display the power of old Valyria by their mere presence."
 trait_dragon_physique_bad_1:0 "Unhealthy Wyrm"
 trait_dragon_physique_bad_1_desc:0 "With slightly malformed wings and patches of misshapen scales, abnormalities of the blood or mystical interference can cause some dragons to be subtly lesser than others."
 trait_education_dragon_1:0 "Feral Dragon"
 trait_education_dragon_1_desc:0 "Growing up alone amidst harsh environs, a dragon becomes as wild as any beast of nature."
 trait_education_dragon_2:0 "Natural Dragon"
 trait_education_dragon_2_desc:0 "Raised in the wilderness without guidance or training, a dragon is wilful and prone to animalistic acts."
 trait_education_dragon_3:0 "Trained Dragon"
 trait_education_dragon_3_desc:0 "Raised around people, some dragons will retain the wild and independent streak typical of their ilk."
 trait_education_dragon_4:0 "Socialized Dragon"
 trait_education_dragon_4_desc:0 "Being appropriately challenged and coaxed throughout their growth, a dragon can be made at ease around both people and other dragons."
 voltara_dragons.1.t:0 "In Search of Wings"
 voltara_dragons.1.desc:0 "Your scouts return with tracks, scorched stone and a report of something moving above the ridgeline. Approaching a wild dragon is a dangerous undertaking, not a claim of ownership."
 voltara_dragons.1.o0:0 "Approach with patience."
 voltara_dragons.1.o1:0 "Leave the creature undisturbed."
 voltara_dragons.3.t:0 "The First Bond"
 voltara_dragons.3.desc:0 "The dragon holds your gaze and allows you to remain. Trust has begun; it will take time and care to make a partnership."
 voltara_dragons.3.o0:0 "I will earn that trust."
 voltara_dragons.4.t:0 "The Dragon Refuses"
 voltara_dragons.4.desc:0 "You return without a bond. No title, payment or proclamation can force a dragon to accept a rider."
 voltara_dragons.4.o0:0 "We survived the attempt."
 voltara_dragons.10.t:0 "The Hatching Chamber"
 voltara_dragons.10.desc:0 "The egg is placed in a carefully tended chamber. Warmth and patient attention offer a chance of life, but there is no guarantee that the shell will open."
 voltara_dragons.10.o0:0 "Begin the vigil."
 voltara_dragons.10.o1:0 "Preserve the egg for another time."
 voltara_dragons.11.t:0 "A Flame Takes Breath"
 voltara_dragons.11.desc:0 "A small creature breaks through the shell. Its first breath carries warmth, and its eyes follow your movements. For now it needs care, not a battlefield."
 voltara_dragons.11.o0:0 "Welcome, little flame."
 voltara_dragons.12.t:0 "An Unbroken Shell"
 voltara_dragons.12.desc:0 "The vigil ends without a hatchling. The egg is intact and can be tended again in another season."
 voltara_dragons.12.o0:0 "Keep it safe."
 voltara_dragons.13.t:0 "A Silent Shell"
 voltara_dragons.13.desc:0 "The shell cracks without a living creature inside. The egg cannot be recovered."
 voltara_dragons.13.o0:0 "Record what we learned."
 voltara_dragons.20.t:0 "A Nest Among the Stones"
 voltara_dragons.20.desc:0 "Your expedition searches old mountain nests. Most contain only ash and broken shell."
 voltara_dragons.20.o0:0 "Examine the deepest shelter."
 voltara_dragons.30.t:0 "An Egg in the Nest"
 voltara_dragons.30.desc:0 "Your dragon has laid an egg. The keepers record its mother and place it in your care."
 voltara_dragons.30.o0:0 "Guard it well."
 voltara_dragons.40.t:0 "The Rider’s Discipline"
 voltara_dragons.40.desc:0 "You spend the season learning the movements and temper of your dragon. Training builds understanding; it does not make the creature harmless."
 voltara_dragons.40.o0:0 "Continue the training."
 voltara_dragons.50.t:0 "Wings Above the Host"
 voltara_dragons.50.desc:0 "Your mature dragon is ready to accompany you. Its support strengthens your command, but only while you remain capable of riding."
 voltara_dragons.50.o0:0 "We fly with the army."
 voltara_seek_dragon:0 "Seek a Wild Dragon"
 voltara_seek_dragon_desc:0 "Fund an expedition to approach an unbonded dragon. The attempt can fail or cause injury."
 voltara_seek_dragon_tooltip:0 "Fund an expedition to approach an unbonded dragon. The attempt can fail or cause injury."
 voltara_seek_dragon_confirm:0 "Proceed"
 voltara_hatch_dragon:0 "Tend a Dragon Egg"
 voltara_hatch_dragon_desc:0 "Attempt to hatch an owned egg. Success creates a bonded hatchling; failure may leave the egg intact or destroy it."
 voltara_hatch_dragon_tooltip:0 "Attempt to hatch an owned egg. Success creates a bonded hatchling; failure may leave the egg intact or destroy it."
 voltara_hatch_dragon_confirm:0 "Proceed"
 voltara_seek_egg:0 "Search Abandoned Dragon Nests"
 voltara_seek_egg_desc:0 "Search remote nesting grounds for a surviving egg. Finding one is uncertain."
 voltara_seek_egg_tooltip:0 "Search remote nesting grounds for a surviving egg. Finding one is uncertain."
 voltara_seek_egg_confirm:0 "Proceed"
 voltara_train_dragon:0 "Train with Your Dragon"
 voltara_train_dragon_desc:0 "Spend a season developing your partnership."
 voltara_train_dragon_tooltip:0 "Spend a season developing your partnership."
 voltara_train_dragon_confirm:0 "Proceed"
 voltara_deploy_dragon:0 "Ride with the Host"
 voltara_deploy_dragon_desc:0 "Deploy a mature bonded dragon for one year of military service. You must still lead the army to use your command advantage."
 voltara_deploy_dragon_tooltip:0 "Deploy a mature bonded dragon for one year of military service. You must still lead the army to use your command advantage."
 voltara_deploy_dragon_confirm:0 "Proceed"
 Voltara_Thornwing:0 "Thornwing"
 Voltara_Frostscale:0 "Frostscale"
 Voltara_Cindermaw:0 "Cindermaw"
 Voltara_Emberwing:0 "Emberwing"
 voltara_dragon_egg_name:0 "Dragon Egg"
 voltara_dragon_egg_desc:0 "A scaled dragon egg, warm or cold according to mysteries its keepers do not yet fully understand."
 voltara_dragon_egg_modifier:0 "Dragon Egg"
 voltara_dragon_training:0 "Rider Training"
 voltara_dragon_warfare:0 "Dragon Support"
 voltara_dragon_egg_black_name:0 "Black Dragon Egg"
 voltara_dragon_egg_blue_name:0 "Blue Dragon Egg"
 voltara_dragon_egg_red_name:0 "Red Dragon Egg"
 voltara_dragon_egg_white_name:0 "White Dragon Egg"
 voltara_dragon_egg_gold_name:0 "Gold Dragon Egg"
 rule_voltara_dragon_clutches:0 "Dragon Egg Clutches"
 setting_voltara_clutches_balanced:0 "Balanced"
 setting_voltara_clutches_balanced_desc:0 "A mature bonded female can lay an egg every five years, with a 20% yearly chance."
 setting_voltara_clutches_abundant:0 "Abundant"
 setting_voltara_clutches_abundant_desc:0 "Successful clutches contain two eggs. The five-year recovery remains."
 setting_voltara_clutches_rare:0 "Rare"
 setting_voltara_clutches_rare_desc:0 "Egg laying has a 5% yearly chance and yields one egg."
 Voltara_Dawnscale:0 "Dawnscale"
 Voltara_Ashwhisper:0 "Ashwhisper"
 Voltara_Nightflare:0 "Nightflare"
 Voltara_Stormtalon:0 "Stormtalon"
 Voltara_Sunfang:0 "Sunfang"
 voltara_dragon_wounded:0 "Wounded Dragon"
 voltara_battlefield_veteran:0 "Battlefield Duel Veteran"
 voltara_dragon_battle_interaction:0 "Engage the Enemy Dragon"
 voltara_dragon_battle_interaction_desc:0 "Confront the opposing commander in the air. Both riders must be deployed in the same battle. Dragon age, training and injuries influence the outcome; defeat wounds the rider and dragon and ends their deployment."
 voltara_battlefield_duel_interaction:0 "Seek Battlefield Combat"
 voltara_battlefield_duel_interaction_desc:0 "Face an opposing commander in personal combat. Active dragonriders and primary war leaders or their heirs are protected from this foot duel. Defeat can cause injury or death."
 voltara_suggest_dragon_bond_interaction:0 "Sponsor a Dragon Bond"
 voltara_suggest_dragon_bond_interaction_desc:0 "Pay 300 gold for this courtier or vassal to approach a wild dragon. Their attempt can fail or cause injury; success bonds the dragon to them, not to you."
 voltara_dragons.60.t:0 "Wings Over the Battlefield"
 voltara_dragons.60.desc:0 "An enemy dragon rises above the host. A single pass can decide which rider commands the sky. Your dragon’s age, training and wounds matter more than the titles of its rider."
 voltara_dragons.60.attack:0 "Meet them in the air."
 voltara_dragons.60.retreat:0 "Withdraw my dragon from the battle."
 voltara_dragons.61.t:0 "The Sky Is Won"
 voltara_dragons.61.desc:0 "[scope:voltara_winner.GetFirstName] holds the sky. [scope:voltara_loser.GetFirstName] breaks away, wounded, their dragon driven from the fighting. Pursuing a defeated dragon may kill it, but brings fresh danger."
 voltara_dragons.61.mercy:0 "Let the defeated dragon withdraw."
 voltara_dragons.61.pursue:0 "Pursue them — risk another clash."
 voltara_view_dragon:0 "Visit Your Dragon"
 voltara_view_dragon_desc:0 "Visit your bonded dragon and review your partnership. Dragons mature for war at fifteen and remain bonded until either partner dies. Eggs are inherited and traded as artifacts; bonds are not inherited."
 voltara_view_dragon_tooltip:0 "Visit your living dragon."
 voltara_view_dragon_confirm:0 "Visit"
 voltara_dragons.80.t:0 "Your Dragon"
 voltara_dragons.80.desc:0 "Your dragon remains a living companion, not a title or an inheritance. Train patiently, safeguard its eggs and remember that a hatchling cannot carry a rider to war. A dragon may accept another rider after its current partner dies."
 voltara_dragons.80.close:0 "Our bond endures."
 voltara_battlefield_victories:0 "Battlefield victories"
 trait_dragonless_dragonrider:0 "Dragonless Rider"
 trait_dragonless_dragonrider_desc:0 "Having previously bonded with a dragon, this character once wielded the greatest force of the world; although they are currently dragonless."
 trait_dragonwidowed:0 "Bondbroken"
 trait_dragonwidowed_desc:0 "Having previously bonded a dragon, the loss of this character's companion has left them unable to consider bonding with another."
 trait_dragon_imperious:0 "Imperious"
 trait_dragon_imperious_desc:0 "There is something almost regal about the interactions between this dragon and other dragons. It expects all, dragon and man, to submit to it."
 trait_dragon_supporting:0 "Supporting"
 trait_dragon_supporting_desc:0 "It seems this dragon would be happiest as one of many working henchmen. It values being loyal over being in control."
 trait_dragon_impulsive:0 "Impulsive"
 trait_dragon_impulsive_desc:0 "Attacking with reckless abandon, this dragon will often engage enemies immediately."
 trait_dragon_calculating:0 "Calculating"
 trait_dragon_calculating_desc:0 "A patient beast, this dragon prefers to battle with its moves well-planned and focused."
 trait_dragon_voracious:0 "Voracious"
 trait_dragon_voracious_desc:0 "With an insatiable appetite, this dragon is known to feed in excess."
 trait_dragon_restrained:0 "Restrained"
 trait_dragon_restrained_desc:0 "This dragon eats less than would be expected for a dragon of its size, preserving valuable resources."
 trait_dragon_defiant:0 "Defiant"
 trait_dragon_defiant_desc:0 "Reviling submission to any man, this dragon is likely to reject riders, orders, or chains."
 trait_dragon_accepting:0 "Accepting"
 trait_dragon_accepting_desc:0 "Curiously relaxed around people, this dragon has shown a tendency toward riders and following directions."
 trait_dragon_bloodthirsty:0 "Bloodthirsty"
 trait_dragon_bloodthirsty_desc:0 "This dragon craves bloody conflict and is noticeably in its element as the cause of death or destruction."
 trait_dragon_skittish:0 "Skittish"
 trait_dragon_skittish_desc:0 "With a tendency to run from conflict, this dragon seems terribly unaware of their power within.."
 trait_dragon_cannibal:0 "Cannibal"
 trait_dragon_cannibal_desc:0 "Far from simply battling over territory or in war, this dragon is known to cannibalize other dragons, to simply sate their appetite."
 trait_dragon_physique_bad_2:0 "Malformed Drake"
 trait_dragon_physique_bad_2_desc:0 "Not all dragons are made equal, and some bear the mark of a lesser creature, with disjoined limbs set out at awkward angles, and movements that are awkward and stilted."
 trait_dragon_physique_bad_3:0 "Pitiful Wyrmling"
 trait_dragon_physique_bad_3_desc:0 "Such is the fate of dragons born in the least magical times, where from tip to tail there is no part of them that looks right. Misshapen eyes set awkwardly in an asymmetric skull. The wings are too small, and the back too large. Far from terror, these creatures incite pity."
 trait_dragon_swift:0 "Swift"
 trait_dragon_swift_desc:0 "Some dragons are known for their speed and agility, able to outmaneuver their peers of the same size and age."
 trait_dragon_slow:0 "Slow"
 trait_dragon_slow_desc:0 "Some dragons are slow and lumbering, unable to keep up with their peers of the same size and age."
 trait_dragon_spindly:0 "Spindly"
 trait_dragon_spindly_desc:0 "With elongated limbs and a thin frame, some dragons are known for an unnerving spindly appearance causing them to be both smaller and more agile than their peers."
 trait_dragon_majestic:0 "Majestic"
 trait_dragon_majestic_desc:0 "Awe-inspiring in their presence, some dragons are known for their sheer majesty and grandeur, scales gleaming in the sun like polished metal."
 trait_dragon_ugly:0 "Ugly"
 trait_dragon_ugly_desc:0 "The majority of dragons are either beautiful or terrifying, but with dull scales and a face only a mother could love, some dragons can also be ugly."
 trait_dragon_fertile:0 "Fertile"
 trait_dragon_fertile_desc:0 "The fertility of dragons is a fickle thing, but this dragon is known to be fruitful and fertile."
 trait_dragon_destined:0 "Destined"
 trait_dragon_destined_desc:0 "The wheels of fate turn ever onward, and such has seen this dragon marked as the implement of destiny."
 trait_education_dragon_5:0 "Noble Dragon"
 trait_education_dragon_5_desc:0 "An exemplar of temperament and character, a dragon ideally raised is all any dragonrider could want in their charge."
 trait_dragonslayer:0 "Dragonslayer"
 trait_dragonslayer_desc:0 "Extremely few can claim the mantle of dragonslayer, but this character has done just that!"
 trait_dragon_wounded_1:0 "Lightly Wounded"
 trait_dragon_wounded_1_desc:0 "Whether through a minor accident or a very one-sided combat, a dragon can be lightly wounded."
 trait_dragon_wounded_2:0 "Wounded"
 trait_dragon_wounded_2_desc:0 "Surprising for creatures of their stature, dragons can be wounded in combat or through accidents."
 trait_dragon_wounded_3:0 "Badly Wounded"
 trait_dragon_wounded_3_desc:0 "A dragon can suffer a great wound that requires much rest to recover fully."
 trait_dragon_wounded_4:0 "Grievously Wounded"
 trait_dragon_wounded_4_desc:0 "A wound of this size can only have been inflicted by something great and terrible."
 trait_dragon_wounded_5:0 "Mortally Wounded"
 trait_dragon_wounded_5_desc:0 "Against all probability for a creature of such magnificence, dragons can take wounds so bad as to be nearly fatal."
 trait_dragon_burned:0 "Burned"
 trait_dragon_burned_desc:0 "Though innately resistant to fire, dragons can still be burned by truly great heat."
 trait_dragon_ill:0 "Ill"
 trait_dragon_ill_desc:0 "Though dragons rarely get ill, it has been known to happen on occasion either due to a bad meal or an unseen malaise."
 trait_dragon_blind:0 "Blind"
 trait_dragon_blind_desc:0 "Either through injury or misfortune at birth, this dragon is unable to see."
 trait_dragon_depressed:0 "$trait_depressed_1$"
 trait_dragon_depressed_desc:0 "This dragon has suffered a great emotional loss after their previous rider passed away. As a result, they have begun to shun human interaction and remain alone, seeking solace in isolation."
 trait_track_dragon_training:0 "Dragon Training"
 trait_track_dragon_training_desc:0 "Time spent training or in combat together improves the skill and speed with which a rider can use their dragon's mighty power.\n\nEach level of training will add dragon combat effectiveness: @dragon_combat_effectiveness_icon! #P +10%#!, to a maximum of #P +30%#!."
 trait_track_dragon_bond:0 "Dragon Bond"
 trait_track_dragon_bond_desc:0 "The bond between a dragon and rider is always strong, but the greatest are said to be magically linked. A closer bond will keep a dragon serving their rider in even the most stressful of circumstances."
 voltara_stat_dragon_size:0 "Size"
 voltara_stat_dragon_combat_effectiveness:0 "Combat"
 voltara_stat_draconic_dread:0 "Dread"
 voltara_stat_temperament:0 "Temperament"
 voltara_stat_taming_chance:0 "Taming"
 voltara_dragon_wild_label:0 "Wild dragon · No rider"
 voltara_dragon_bonded_label:0 "Bonded dragon"
 voltara_dragon_panel_lore:0 "Dragon strength grows with age. Physique, disposition, wounds and rider training alter its power. A bond belongs to the rider and is not inherited."
