 Voltara_Ashwhisper:0 "Ashwhisper"
 Voltara_Nightflare:0 "Nightflare"
 Voltara_Stormtalon:0 "Stormtalon"
 Voltara_Sunfang:0 "Sunfang"
 voltara_dragon_wounded:0 "Wounded Dragon"
 voltara_battlefield_veteran:0 "Battlefield Duel Veteran"
 voltara_dragon_battle_interaction:0 "Engage the Enemy Dragon"
 voltara_dragon_battle_interaction_desc:0 "Confront the opposing commander in the air. Both riders must be deployed in the same battle. Dragon age, training and injuries influence the outcome; defeat wounds the rider and dragon and ends their deployment."
 voltara_battlefield_duel_interaction:0 "Seek Battlefield Combat"
 voltara_battlefield_duel_interaction_desc:0 "Face an opposing commander in personal combat. Active dragonriders and primary war leaders or their heirs are protected from this foot duel. Defeat can cause injury or death."
 voltara_suggest_dragon_bond_interaction:0 "Sponsor a Dragon Bond"
 voltara_suggest_dragon_bond_interaction_desc:0 "Pay 300 gold for this courtier or vassal to approach a wild dragon. Their attempt can fail or cause injury; success bonds the dragon to them, not to you."
 voltara_dragons.60.t:0 "Wings Over the Battlefield"
 voltara_dragons.60.desc:0 "An enemy dragon rises above the host. A single pass can decide which rider commands the sky. Your dragon’s age, training and wounds matter more than the titles of its rider."
 voltara_dragons.60.attack:0 "Meet them in the air."
 voltara_dragons.60.retreat:0 "Withdraw my dragon from the battle."
 voltara_dragons.61.t:0 "The Sky Is Won"
 voltara_dragons.61.desc:0 "[scope:voltara_winner.GetFirstName] holds the sky. [scope:voltara_loser.GetFirstName] breaks away, wounded, their dragon driven from the fighting. Pursuing a defeated dragon may kill it, but brings fresh danger."
 voltara_dragons.61.mercy:0 "Let the defeated dragon withdraw."
 voltara_dragons.61.pursue:0 "Pursue them — risk another clash."
 voltara_view_dragon:0 "Visit Your Dragon"
 voltara_view_dragon_desc:0 "Visit your bonded dragon and review your partnership. Dragons mature for war at fifteen and remain bonded until either partner dies. Eggs are inherited and traded as artifacts; bonds are not inherited."
 voltara_view_dragon_tooltip:0 "Visit your living dragon."
 voltara_view_dragon_confirm:0 "Visit"
 voltara_dragons.80.t:0 "Your Dragon"
 voltara_dragons.80.desc:0 "Your dragon remains a living companion, not a title or an inheritance. Train patiently, safeguard its eggs and remember that a hatchling cannot carry a rider to war. A dragon may accept another rider after its current partner dies."
 voltara_dragons.80.close:0 "Our bond endures."
 voltara_battlefield_victories:0 "Battlefield victories"
