 voltara_dragon_ceremony_location:0 "A seat of power or a functioning dragonpit is suitable for a hatching ceremony."
 building_dragonpit_ruins_03:0 "Restored Dragonpit of Skyreach"
 building_dragonpit_ruins_03_desc:0 "The vaults of Skyreach shelter dragons once more. Dragons housed here grow more slowly, but remain under the protection of their keepers."
 building_type_dragonpit_ruins_03:0 "Dragonpit of Skyreach"
 building_type_dragonpit_ruins_03_desc:0 "A restored enclosure in the mountains of Halithor."
 building_generic_dragon_pit_01:0 "Dragonpit"
 building_generic_dragon_pit_01_desc:0 "A fortified enclosure for dragons, with feeding grounds and chambers for their keepers. Use Send Dragon to Dragonpit on a dragon under your control."
 building_type_generic_dragon_pit_01:0 "Dragonpit"
 building_type_generic_dragon_pit_01_desc:0 "A fortified dragon enclosure."
 voltara_send_dragon_to_pit:0 "Send Dragon to Dragonpit"
 voltara_send_dragon_to_pit_desc:0 "House this dragon in one of your functioning dragonpits. Confined dragons grow more slowly and cannot be deployed until released."
 voltara_release_dragon_from_pit:0 "Release Dragon from Dragonpit"
 voltara_release_dragon_from_pit_desc:0 "Allow this dragon to leave its enclosure and accompany its rider."
 voltara_give_dragon_egg:0 "Give a Dragon Egg"
 voltara_give_dragon_egg_desc:0 "Give one unreserved dragon egg to this character."
 voltara_cradle_dragon_egg:0 "Cradle a Dragon Egg"
 voltara_cradle_dragon_egg_desc:0 "Spend six months tending a fertile egg. It may hatch, or remain dormant. Petrified eggs require a hatching ceremony."
 voltara_cradle_dragon_egg_tooltip:0 "Try to hatch a fertile egg through patient care."
 voltara_cradle_dragon_egg_confirm:0 "Tend the egg"
 voltara_study_dragonlore:0 "Study Dragonlore"
 voltara_study_dragonlore_desc:0 "Collect accounts of dragons and their hatching rituals. This knowledge improves the prospects of a hatching ceremony."
 voltara_study_dragonlore_tooltip:0 "Gain dragonlore and Learning experience."
 voltara_study_dragonlore_confirm:0 "Begin research"
 voltara_dragon_expansion.1.t:0 "An Egg at My Side"
 voltara_dragon_expansion.1.desc:0 "For months I have kept the egg warm and close. Today, a faint vibration stirs beneath its shell. Is this the moment I have awaited?"
 voltara_dragon_expansion.1.a:0 "Let us see what emerges."
 voltara_dragon_expansion.20.t:0 "The Demands of a Dragon"
 voltara_dragon_expansion.20.desc:0 "A dragon is no tame hunting beast. Feeding, training, and understanding my companion demand constant attention."
 voltara_dragon_expansion.20.train:0 "We shall train together."
 voltara_dragon_expansion.20.feed:0 "Provide fresh food and care."
 voltara_dragon_expansion.20.leave:0 "Give the dragon room to roam."
 agot_dragon_in_dragonpit:0 "Housed in a Dragonpit"
 agot_dragon_in_dragonpit_desc:0 "Protected and provisioned in a fortified enclosure; confinement limits growth."

 voltara_glowing_dragon_prestige:0 "Rider of a Luminous Dragon"
 voltara_glowing_dragon_prestige_desc:0 "This rider’s dragon possesses magnificent glowing scales."
