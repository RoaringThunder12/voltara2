l_english:
 advanced_torture.5500.t:0 "The Pleasure of Cruelty"
 advanced_torture.5500.desc:0 "At first, every torment was only a tool: a key to open secrets, a warning to enemies, a method to impose obedience. But something has changed. When the screams begin, you no longer look away. When you give the order, you no longer feel the same weight as before. Somewhere in the dark corners of your soul, cruelty has ceased to be a means and become a satisfaction."
 advanced_torture.5500.a:0 "The fear of others has a strange taste..."