l_english:
 lp_feudal_government:0 "Severosi Paramountcy"
 lp_feudal_government_adjective:0 "Paramount"
 lp_feudal_government_desc:0 "Hereditary noble houses govern the regional empires beneath the Severosi hegemon. During imperial wars the great lords choose the Crown, its opponent, or neutrality before the realm reunites."
 voltara_keeper_government:0 "Strait Keepers"
 voltara_keeper_government_adjective:0 "Keeper"
 voltara_keeper_government_desc:0 "An independent sworn order protecting the Strait of Kartholos, defended by the Severosi hegemon. Commanders are elected from eligible sworn members by merit and service rather than inherited blood."
 voltara_keeper_succession:0 "Keeper Election"
 voltara_keeper_succession_effects:0 "On a commander’s death, eligible adult Keepers are shortlisted by experience, ability and character. A weighted election selects the successor."
 trait_voltara_oathkeeper:0 "Oathkeeper"
 trait_voltara_oathkeeper_desc:0 "Sworn to defend the Strait. Earns 5 experience each year of service, and 3 for personally commanding a completed raid against Southron lands. Vows bar new marriages and ordinary inheritance."
 trait_track_voltara_oathkeeper:0 "Service to the Strait"
 trait_track_voltara_oathkeeper_desc:0 "At 25, 50 and 100 experience, service grants increasing martial ability, prowess and prestige."
 trait_voltara_keeper_elect:0 "Commander-Elect"
 trait_voltara_keeper_elect_desc:0 "Chosen by the Keepers to assume command of the Strait."
 voltara_send_to_keepers:0 "Send to the Keepers of Kartholos"
 voltara_send_to_keepers_desc:0 "Release this adult unlanded prisoner into the Keepers. They join the Commander’s court, relinquish claims and take lifelong vows."
 voltara_ask_keeper_vows:0 "Ask to Take Strait Keeper Vows"
 voltara_ask_keeper_vows_desc:0 "Ask this adult courtier to relinquish claims and join the Keepers of Kartholos. They may refuse."
 voltara_mega_wars.1.t:0 "The Empire at War"
 voltara_mega_wars.1.desc:0 "War has divided the Severosi hegemony. My realm now stands temporarily apart, free to choose its allegiance. I may fight for the Crown, support its opponent, or remain neutral. When this war ends, the regional realms will return beneath the surviving Severosi hegemony."
 voltara_mega_wars.1.loyal:0 "Stand with the Crown."
 voltara_mega_wars.1.rebel:0 "Support the opposing cause."
 voltara_mega_wars.1.neutral:0 "Keep our armies at home."
 trait_track_voltara_slaver:0 "Enslavement"
 trait_track_voltara_slaver_desc:0 "Enslaving a person for the first time grants 10 experience. At 25, 50 and 100 experience, unlock increasing stewardship, dread gain and domain taxes. Selling or repeatedly enslaving the same person grants no experience."
 watch_centralization:0 "Keeper Centralization"
 watch_special_contract:0 "Keeper Duties"
 no_watch_centralization:0 "Autonomous Garrisons"
 low_watch_centralization:0 "Limited Centralization"
 moderate_watch_centralization:0 "Coordinated Garrisons"
 high_watch_centralization:0 "Central Command"
 full_watch_centralization:0 "Unified Command"
 watch_special_contract_ranger:0 "Rangers"
 watch_special_contract_builder:0 "Builders"
 watch_special_contract_steward:0 "Stewards"
